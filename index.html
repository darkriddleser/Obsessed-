<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSESSED</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=GFS+Didot&family=Manrope:wght@400;500;700;800&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #eee;
}

body {
  font-family: "Noto Serif", serif;
}

.screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 80px 24px 90px;

  overflow-x: hidden;
}

.hidden {
  display: none !important;
}


/* =========================
   ΠΡΩΤΗ ΟΘΟΝΗ
========================= */

#languageScreen {
  overflow: hidden;

  background-image:
    linear-gradient(
      rgba(0,0,0,.18),
      rgba(0,0,0,.32)
    ),
    url("file_00000000a95081f4ad0a889b8883d67c.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

#languageScreen::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,.22) 60%,
      rgba(0,0,0,.75) 100%
    );

  pointer-events: none;
}

.language-content {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 430px;

  display: flex;
  flex-direction: column;
  align-items: center;

  transform: translateY(90px);
}


/* LANGUAGE BUTTONS */

.language-button {
  width: 290px;
  max-width: 90%;

  margin: 8px 0;
  padding: 17px 20px;

  background: rgba(3,3,3,.76);
  border: 1px solid rgba(130,20,20,.8);

  color: #e3dfd8;

  font-family: "Cinzel", serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 2px;

  cursor: pointer;

  backdrop-filter: blur(3px);

  transition:
    background .25s,
    border-color .25s,
    transform .15s;
}

.language-button:active {
  transform: scale(.98);
  background: rgba(80,0,0,.35);
  border-color: #b32828;
}

.flag {
  margin-right: 13px;
  font-size: 21px;
}


/* =========================
   LANGUAGE SWITCHER
========================= */

#languageSwitcher {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;
  box-sizing: border-box;

  height: 55px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 3px;

  padding: 0 18px;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.95),
    rgba(0,0,0,.70),
    transparent
  );

  pointer-events: none;
}

#languageSwitcher button {
  border: 0;
  background: transparent;

  padding: 5px 6px;

  font-size: 19px;
  cursor: pointer;

  opacity: .4;

  pointer-events: auto;
}

#languageSwitcher button.active {
  opacity: 1;
}


/* =========================
   VIDEO / INTRO
========================= */

#videoScreen {
  background:
    radial-gradient(
      circle at center,
      #140707 0%,
      #050303 45%,
      #000 100%
    );

  padding-top: 35px;
  padding-bottom: 100px;
  justify-content: flex-start;
}

.video-frame {
  position: relative;

  width: min(100%, 360px);
  aspect-ratio: 9 / 16;
  max-height: 48vh;

  background: #050505;
  border: 1px solid #351010;

  overflow: hidden;

  box-shadow:
    0 0 45px rgba(80,0,0,.18),
    inset 0 0 50px #000;

  flex-shrink: 1;
}


/* =========================
   STORY CHAPTER 01
========================= */

.story-chapter {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}

.chapter-number {
  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: #7d1b1b;
  margin-bottom: 6px;
}

.story-title {
  font-family: "Cinzel", serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 3px;
  margin: 0 0 20px;
  color: #eee9e2;
}


/* FLIP PHOTO */

.memory-photo {
  width: 100%;
  aspect-ratio: 2 / 3;
  margin-bottom: 22px;

  perspective: 1200px;
  cursor: pointer;

  background: transparent;
  border: none;
  overflow: visible;
}

.memory-card {
  position: relative;
  width: 100%;
  height: 100%;

  transition: transform .8s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.memory-card.flipped {
  transform: rotateY(180deg);
}

.memory-card-face {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.memory-card-back {
  transform: rotateY(180deg);
}

.memory-card-face img {
  width: 100%;
  height: 100%;
  object-fit: cover;

  display: block;

  user-select: none;
  -webkit-user-drag: none;
}


/* STORY TEXT */

.story-text {
  font-family: "GFS Didot", serif;
  font-size: 18px;
  line-height: 1.65;
  color: #d8d3cc;
  margin-bottom: 25px;
}


/* RIDDLE */

.riddle-box {
  width: 100%;
  padding-top: 20px;
  border-top: 1px solid #301010;
}

.riddle-text {
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 17px;
  line-height: 1.6;
  color: #c9c3bc;
  margin-bottom: 18px;
}

.riddle-input {
  width: 100%;
  box-sizing: border-box;

  padding: 13px 14px;

  background: rgba(0,0,0,.55);
  border: 1px solid #4a1818;

  color: #eee9e2;
  text-align: center;

  font-family: "GFS Didot", serif;
  font-size: 17px;

  outline: none;
}

.riddle-input:focus {
  border-color: #8b2525;
}

.riddle-button {
  margin-top: 12px;
  padding: 11px 24px;

  border: 1px solid #651c1c;
  background: transparent;

  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 2px;

  cursor: pointer;
}

.riddle-message {
  min-height: 22px;
  margin-top: 12px;

  font-family: "GFS Didot", serif;
  font-size: 15px;
}


/* =========================
   INTRO TEXT
========================= */

.placeholder {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Cinzel", serif;
  color: #5d5555;

  font-size: 12px;
  letter-spacing: 4px;
}

.quote {
  max-width: 520px;

  margin: 30px auto;

  color: #e0dcd5;

  font-family: "GFS Didot", serif;
  font-size: 19px;
  font-weight: 400;
  font-style: italic;

  line-height: 1.75;
  letter-spacing: .2px;

  text-shadow:
    0 1px 2px rgba(0,0,0,.8);
}


/* START BUTTON */

.start-button {
  width: 300px;
  max-width: 90%;

  padding: 16px;

  background: rgba(0,0,0,.5);

  color: #ddd8d0;

  border: 1px solid #651313;

  font-family: "Cinzel", serif;
  font-size: 13px;
  letter-spacing: 1.5px;

  cursor: pointer;
}

.start-button:active {
  background: rgba(90,0,0,.3);
}


/* =========================
   NAVIGATION ARROWS
========================= */

#navigationArrows {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  min-height: 65px;

  padding:
    8px
    18px
    max(12px, env(safe-area-inset-bottom));

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;

  background: linear-gradient(
    to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.65),
    transparent
  );

  pointer-events: none;
}

#navigationArrows button {
  width: 42px;
  height: 42px;

  border: none;
  background: transparent;
  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 25px;

  cursor: pointer;
  opacity: .75;
  pointer-events: auto;
}

#navigationArrows button:active {
  background: transparent;
  color: #ffffff;
  opacity: 1;
}

#navigationArrows button:disabled {
  opacity: .2;
  cursor: default;
}


/* =========================
   EVENT 01 / 02
========================= */

#storyScreen1,
#storyScreen2 {
  justify-content: flex-start;
  padding-top: 35px;
}

#storyScreen2 {
  transform: none;
}

#storyScreen2 .heart-monitor {
  margin-top: 22vh;
}

.heart-monitor {
  width: 100%;
  margin: 35px 0;
  padding: 18px 0;
  background: #020403;
  overflow: hidden;
  box-shadow: inset 0 0 30px rgba(0, 255, 100, 0.05);
}

.heart-monitor.fade-out {
  opacity: 0;
  transition: opacity 2s ease;
}

.monitor-line {
  width: 100%;
  height: 120px;
  overflow: hidden;
}

.monitor-line svg {
  width: 300%;
  height: 100%;
  animation: ecgCollapse 10s linear forwards;
}

.ecg-line {
  fill: none;
  stroke: #39ff78;
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 5px #39ff78);
}

@keyframes ecgCollapse {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-60%);
  }
}

@media (min-width: 768px) {

  .video-frame {
    width: 280px;
    max-height: 52vh;
  }

  .quote {
    max-width: 650px;
  }

  #languageScreen {
    background-size: auto 100%;
    background-position: center;
    background-color: #000;
  }
}

.hospital-document {
  opacity: 0;
  transition: opacity 3s ease;
  width: 100%;
  max-width: 390px;
  margin: 25px auto 40px;
  padding: 28px 24px;

  background:
    linear-gradient(
      rgba(255,255,255,.04),
      rgba(0,0,0,.05)
    ),
    #d8d0ba;

  color: #171512;

  text-align: left;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.55;

  border: 1px solid #8e8775;

  box-shadow:
    0 8px 30px rgba(0,0,0,.8),
    inset 0 0 35px rgba(70,55,30,.12);

  transform: rotate(-0.4deg);
}

.hospital-document.show {
  opacity: 1;
}

#hospitalName {
  text-align: center;
  font-weight: bold;
  font-size: 16px;
  letter-spacing: 1px;
}

#hospitalRecordTitle {
  text-align: center;
  font-weight: bold;
  font-size: 12px;
  margin-top: 5px;
  letter-spacing: .8px;
}

.hospital-document hr {
  border: 0;
  border-top: 1px solid rgba(30,25,20,.45);
  margin: 17px 0;
}

#hospitalTimeline {
  line-height: 1.8;
}

#hospitalMotherStatus {
  margin-top: 4px;
  font-weight: bold;
}

#incidentTimeInput {
  width: 55%;
  padding: 10px;

  background: rgba(255,255,255,.35);
  border: 1px solid #625c50;

  color: #171512;
  text-align: center;

  font-family: "Courier New", monospace;
  font-size: 16px;
}

#incidentTimeButton {
  width: 43%;
  padding: 10px 4px;

  background: #24211c;
  border: 1px solid #24211c;

  color: #ddd5c1;

  font-family: "Courier New", monospace;
  font-size: 11px;

  cursor: pointer;
}


/* =========================
   EVENT 03
========================= */

.henry-anger {
  height: 150px;
  overflow: hidden;
  margin-top: 35px;
  text-align: center;
  position: relative;
  font-size: 19px;
  line-height: 1.6;

  opacity: 1;
  transition: opacity 2s ease;
}

/* EVENT 03 - Smooth κίνηση λόγων Henry */
.henry-line {
  position: absolute;
  left: 0;
  top: 120px;
  width: 100%;

  opacity: 0;

  transition:
    top 9s linear,
    opacity 1s ease;
}

.henry-line.show {
  top: -40px;
  opacity: 1;
}

.henry-line.fade-away {
  top: 0;
  opacity: 0;
}

#storyScreen3 {
  justify-content: flex-start;
  padding-top: 35px;
}

#storyScreen3 .story-chapter {
  width: 100%;
}

#storyScreen3 .henry-anger {
  margin-top: 22vh;
}

/* EVENT 03 - ΣΚΗΝΗ ΦΩΤΙΑΣ */
.fire-scene {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 100%;

  transform: translate(-50%, -50%);
  opacity: 0;

  transition: opacity 2s ease;
}

.fire-scene.show {
  opacity: 1;
}

.fire-scene video {
  width: 100%;
  max-height: 55vh;
  object-fit: cover;
  display: block;
}

/* EVENT 03 - ΕΠΙΣΗΜΗ ΚΑΤΑΘΕΣΗ HENRY */
.henry-statement {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 40px);
  max-width: 390px;

  margin: 30px auto;
  padding: 26px 22px;

  background:
    linear-gradient(
      rgba(25, 18, 14, .18),
      rgba(0, 0, 0, .12)
    ),
    #aaa18c;

  color: #18130f;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.65;
  text-align: left;

  border: 1px solid #8e8775;

  box-shadow:
    0 12px 35px rgba(0,0,0,.95),
    inset 0 0 45px rgba(45,20,8,.28),
    inset 0 0 8px rgba(0,0,0,.35);

  opacity: 0;
  transition: opacity 3s ease;
}

.henry-statement.show {
  opacity: 1;
}

/* EVENT 03 - ΑΝΑΦΟΡΑ ΠΥΡΟΣΒΕΣΤΙΚΗΣ / ΑΣΤΥΝΟΜΙΑΣ */
.fire-report {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 40px);
  max-width: 390px;

  margin: 30px auto;
  padding: 26px 22px;

  background:
    linear-gradient(
      rgba(25, 18, 14, .20),
      rgba(0, 0, 0, .14)
    ),
    #9f9785;

  color: #17120f;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.65;
  text-align: left;

  border: 1px solid #77736a;

  box-shadow:
    0 12px 35px rgba(0,0,0,.95),
    inset 0 0 45px rgba(45,20,8,.30),
    inset 0 0 8px rgba(0,0,0,.38);

  opacity: 0;

  transition: opacity 1.5s ease;
}

.fire-report.show {
  opacity: 1;
}

/* EVENT 03 - ΚΡΥΜΜΕΝΟ ΣΤΟΙΧΕΙΟ */
.hidden-evidence {
  position: absolute;
  top: 50%;
  left: 50%;

  width: calc(100% - 30px);
  max-width: 420px;
  aspect-ratio: 3 / 4;

  transform: translate(-50%, -50%);

  background: #020202;

  overflow: hidden;

  opacity: 0;
  transition: opacity 2s ease;

  box-shadow: 0 10px 40px rgba(0,0,0,.95);
  touch-action: none;
}

.hidden-evidence.show {
  opacity: 1;
}

.hidden-evidence img {
  filter: brightness(1.35) contrast(1.05);
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;

  user-select: none;
  -webkit-user-drag: none;
}

.evidence-darkness {
  position: absolute;
  inset: 0;

  background: rgba(0, 0, 0, 0.97);

  -webkit-mask-image: radial-gradient(
    circle 65px at var(--x, 100%) var(--y, 100%),
    transparent 0,
    transparent 45px,
    black 75px
  );

  mask-image: radial-gradient(
    circle 65px at var(--x, 100%) var(--y, 100%),
    transparent 0,
    transparent 45px,
    black 75px
  );

  pointer-events: none;
  z-index: 2;
  transition: opacity 2s ease;
}

.evidence-darkness.found {
  opacity: 0;
}


/* =========================
   EVENT 04 - ΗΜΕΡΟΛΟΓΙΟ
========================= */

#storyScreen4 {
  justify-content: flex-start;
  padding-top: 35px;

  background:
    radial-gradient(
      circle at 50% 38%,
      #140b07 0%,
      #060403 45%,
      #000 100%
    );
}

.calendar-scene {
  position: relative;
  z-index: 2;

  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 6vh;

  transition: opacity 1.5s ease;
}

.calendar-scene.fade-out {
  opacity: 0;
}

.old-calendar {
  position: relative;

  width: 230px;
  height: 290px;

  display: flex;
  flex-direction: column;

  background: #c9bea4;
  color: #1c1712;

  font-family: "Courier New", monospace;

  /* Κρεμασμένο στον τοίχο, ελαφρώς στραβό */
  transform: rotate(-1.2deg);

  /* Πάχος στοίβας σελίδων + σκιά */
  box-shadow:
    0 2px 0 #b4a98f,
    0 4px 0 #a69b81,
    0 6px 0 #978c73,
    0 7px 0 #6e6553,
    0 20px 45px rgba(0,0,0,.95);

  transition:
    filter 1.8s ease,
    transform 2.2s ease;
}

/* Γέρνει και κρεμάει στις πένθιμες μέρες */
.old-calendar.grieving {
  transform: rotate(-3.5deg) translateY(8px);
}

/* Μεταλλικοί κρίκοι */
.old-calendar::before,
.old-calendar::after {
  content: "";
  position: absolute;
  top: -10px;
  z-index: 5;

  width: 9px;
  height: 22px;

  border: 3px solid #77726a;
  border-radius: 6px;

  box-shadow:
    inset 0 0 2px rgba(0,0,0,.7),
    0 2px 3px rgba(0,0,0,.8);
}

.old-calendar::before { left: 27%; }
.old-calendar::after  { right: 27%; }

.calendar-top {
  flex-shrink: 0;

  padding: 17px 10px 11px;

  background: linear-gradient(#30241d, #1b1410);
  color: #b7aa91;

  font-family: "Cinzel", serif;
  font-size: 11px;
  letter-spacing: 4px;

  box-shadow: 0 2px 4px rgba(0,0,0,.45);
  position: relative;
  z-index: 4;
}

/* Στοίβα σελίδων */
.calendar-pages {
  position: relative;
  flex: 1;
}

.calendar-page,
.calendar-stub {
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at 25% 15%,
      rgba(255,248,230,.28),
      transparent 60%
    ),
    linear-gradient(
      rgba(70,45,25,.05),
      rgba(40,22,10,.24)
    ),
    #cbbfa3;
}

.calendar-page {
  display: flex;
  flex-direction: column;
  align-items: center;

  box-shadow: inset 0 0 28px rgba(60,35,15,.28);
}

.calendar-month {
  margin-top: 20px;
  font-size: 15px;
  letter-spacing: 4px;
}

.calendar-day {
  margin-top: 4px;

  font-family: "GFS Didot", serif;
  font-size: 96px;
  line-height: 1;
}

.calendar-weekday {
  margin-top: 4px;

  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 16px;
}

.calendar-year {
  margin-top: 12px;

  font-size: 13px;
  letter-spacing: 6px;
  opacity: .75;
}

/* Κυριακές με κόκκινο */
.calendar-page.sunday .calendar-day,
.calendar-page.sunday .calendar-weekday {
  color: #8b1d1d;
}

/* Υπόλειμμα χαρτιού στην κορυφή */
.calendar-stub {
  z-index: 2;
  pointer-events: none;
  filter: brightness(.86);
  clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
}

/* Η σελίδα που σκίζεται και πέφτει */
.torn-sheet {
  z-index: 3;
  transform-origin: top left;
  will-change: transform, clip-path, opacity;
  filter: brightness(1.03);
}

/* Κόκκινος κύκλος στην ημερομηνία */
.calendar-mark {
  position: absolute;
  left: 50%;
  top: 30px;
  width: 150px;
  height: 120px;
  transform: translateX(-50%) rotate(-5deg);
  z-index: 4;
  pointer-events: none;
  overflow: visible;
  opacity: 0;
}

.calendar-mark path {
  fill: none;
  stroke: #8b1414;
  stroke-width: 3.5;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
}

.calendar-mark.draw {
  opacity: .9;
}

.calendar-mark.draw path {
  animation: drawMark 1.6s ease-out forwards;
}

@keyframes drawMark {
  to { stroke-dashoffset: 0; }
}

/* Μαρασμός: λεκέδες υγρασίας + σκοτάδι στις άκρες */
.calendar-wither {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;

  background:
    radial-gradient(ellipse at 28% 72%, rgba(70,40,15,.5), transparent 35%),
    radial-gradient(ellipse at 76% 30%, rgba(60,35,12,.4), transparent 30%),
    radial-gradient(ellipse at 60% 90%, rgba(50,30,10,.35), transparent 25%),
    radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.8) 100%);

  opacity: 0;
  transition: opacity 1.8s ease;
}

/* Ο κόσμος γύρω σκοτεινιάζει */
#storyScreen4::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;

  background: radial-gradient(
    ellipse at 50% 40%,
    rgba(0,0,0,.15) 0%,
    rgba(0,0,0,.94) 70%
  );

  opacity: 0;
  transition: opacity 2s ease;
}

#storyScreen4.mourning::after {
  opacity: 1;
}

/* Φράσεις πένθους */
.grief-line {
  min-height: 60px;
  max-width: 320px;
  margin-top: 34px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 17px;
  line-height: 1.6;
  color: #cfc6b8;
  opacity: 0;
  transition: opacity 1.2s ease;
}

.grief-line.show { opacity: 1; }


/* =========================
   EVENT 04 - ΓΡΑΦΕΙΟ HENRY (δωμάτιο)
========================= */

.desk-scene {
  position: relative;
  width: 100%;
  aspect-ratio: 400 / 340;
  margin-top: 3vh;
  overflow: hidden;
  border-radius: 4px;
  opacity: 0;
  transition: opacity 2s ease;
}

.desk-scene.show { opacity: 1; }

/* Σκοτάδι στις άκρες του δωματίου */
.desk-scene::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background: radial-gradient(
    ellipse at 48% 48%,
    transparent 35%,
    rgba(0,0,0,.75) 100%
  );
}

.room-svg,
.light-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.light-svg {
  z-index: 5;
  pointer-events: none;
}

/* Η ταλαιπωρημένη λάμπα τρεμοπαίζει */
.lamp-beam,
.lamp-glow,
.lamp-bulb {
  animation: lampFlicker 7s infinite;
}

@keyframes lampFlicker {
  0%, 60%, 66%, 100% { opacity: 1; }
  61%  { opacity: .35; }
  62%  { opacity: .9; }
  64%  { opacity: .25; }
  65%  { opacity: .85; }
}

@media (prefers-reduced-motion: reduce) {
  .lamp-beam, .lamp-glow, .lamp-bulb { animation: none; }
}

/* Κοινά για όλα τα αντικείμενα */
.desk-item {
  position: absolute;
  z-index: 2;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: filter .5s ease;
}

.desk-item.seen { filter: brightness(.65); }

/* Αντικείμενα ξαπλωμένα πάνω στο γραφείο (προοπτική) */
.flat {
  transform:
    translate(-50%, -50%)
    matrix(1, 0, -0.55, 0.45, 0, 0)
    rotate(var(--r, 0deg));
  transform-origin: center;
  box-shadow: 2px 3px 5px rgba(0,0,0,.55);
}

/* Αντικείμενα όρθια πάνω στο γραφείο */
.upright {
  transform: translateX(-50%);
}

/* --- Σημειώσεις Henry --- */
.desk-notes {
  left: 32%;
  top: 47%;
  width: 17%;
  aspect-ratio: 3 / 4;
  --r: 6deg;
  background:
    repeating-linear-gradient(to bottom,
      transparent 0 6px,
      rgba(60,90,140,.35) 6px 7px),
    #e2dac6;
  box-shadow:
    2px 2px 0 #cfc5ad,
    4px 4px 0 #b9ae93,
    5px 7px 8px rgba(0,0,0,.6);
}

/* Σύμβολο σκαριφημένο πάνω στις σημειώσεις */
.desk-notes .vodou-symbol {
  position: absolute;
  right: 8%;
  bottom: 8%;
  width: 45%;
  height: auto;
  color: #7a1414;
  stroke-width: 6;
}

/* --- Εφημερίδα / μαρτυρία --- */
.newspaper-clip {
  left: 51%;
  top: 54%;
  width: 24%;
  aspect-ratio: 4 / 3;
  --r: -4deg;
  padding: 5% 6%;
  background: #d9d3c1;
  color: #1a1510;
  font-family: "Times New Roman", serif;
  overflow: hidden;
}

.clip-masthead {
  font-size: 6px;
  letter-spacing: 1px;
  text-align: center;
  border-bottom: 1px solid #1a1510;
  padding-bottom: 2px;
}

.clip-lines {
  margin-top: 5px;
  height: 70%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(26,21,16,.45) 0 1.5px,
    transparent 1.5px 5px
  );
}

/* --- Φυλλάδιο μέντιουμ --- */
.medium-flyer {
  left: 73%;
  top: 52%;
  width: 12%;
  aspect-ratio: 2 / 3;
  --r: 12deg;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #3b1414, #150606);
  border: 1px solid #6b5426;
  color: #d8c48f;
  font-family: "Cinzel", serif;
}

.flyer-symbol { font-size: 16px; line-height: 1; }
.flyer-name   { margin-top: 3px; font-size: 5px; letter-spacing: .5px; }

/* --- Φάκελοι λογαριασμών --- */
.envelopes {
  left: 14%;
  top: 55%;
  width: 16%;
  aspect-ratio: 3 / 2;
  --r: -10deg;
  box-shadow: none;
}

.envelopes span {
  position: absolute;
  inset: 0;
  background: #cfc5ad;
  border: 1px solid #9c917a;
  box-shadow: 2px 3px 5px rgba(0,0,0,.55);
}

.envelopes span:nth-child(1) { transform: rotate(-9deg) translate(-4px, 3px); }
.envelopes span:nth-child(2) { transform: rotate(6deg) translate(3px, -2px); }
.envelopes span:nth-child(3) {
  transform: rotate(-2deg);
  background:
    linear-gradient(35deg, transparent 49%, rgba(0,0,0,.25) 50%, transparent 51%),
    linear-gradient(-35deg, transparent 49%, rgba(0,0,0,.25) 50%, transparent 51%),
    #d8cfb8;
}

/* Κόκκινη σφραγίδα "ΑΠΛΗΡΩΤΟ" στον πάνω φάκελο */
.envelopes span:nth-child(3)::after {
  content: "";
  position: absolute;
  right: 10%;
  top: 14%;
  width: 26%;
  height: 22%;
  border: 1.5px solid rgba(150,20,20,.8);
}

/* --- Κλειστός υπολογιστής --- */
.laptop {
  left: 54%;
  top: 41%;
  width: 26%;
  aspect-ratio: 3 / 2;
  --r: -3deg;
  border-radius: 4px;
  background:
    linear-gradient(135deg,
      rgba(255,255,255,.14) 0%,
      transparent 35%),
    linear-gradient(#34363b, #1c1d20);
  border: 1px solid #0c0c0e;
  box-shadow:
    0 2px 0 #0e0e10,
    3px 5px 8px rgba(0,0,0,.7);
}

/* Μικρό φωτάκι λειτουργίας */
.laptop::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 6%;
  width: 4px;
  height: 4px;
  margin-left: -2px;
  border-radius: 50%;
  background: #6bd08a;
  box-shadow: 0 0 5px #6bd08a;
  animation: laptopPulse 3s infinite ease-in-out;
}

@keyframes laptopPulse {
  0%, 100% { opacity: .25; }
  50%      { opacity: 1; }
}

/* --- Κάδρο Karen (όρθιο) --- */
.photo-frame {
  left: 86%;
  bottom: 61%;
  width: 11%;
  aspect-ratio: 3 / 4;
  padding: 3px;
  background: #2a1c12;
  border: 2px solid #6d5230;
  box-shadow: 3px 4px 6px rgba(0,0,0,.7);
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: sepia(.4) brightness(.85);
}

/* --- Μπουκάλι κρασί (όρθιο) --- */
.wine-bottle {
  left: 79%;
  bottom: 58%;
  width: 5.5%;
  aspect-ratio: 1 / 4;
}

.wine-bottle::before {             /* σώμα */
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 66%;
  border-radius: 7px 7px 3px 3px;
  background: linear-gradient(90deg, #0d1a0e, #2f4d2e 40%, #0d1a0e);
  box-shadow: 3px 4px 6px rgba(0,0,0,.7);
}

.wine-bottle::after {              /* λαιμός */
  content: "";
  position: absolute;
  left: 33%;
  right: 33%;
  top: 0;
  height: 38%;
  border-radius: 2px 2px 0 0;
  background: linear-gradient(90deg, #0d1a0e, #2a4429, #0d1a0e);
}

.wine-label {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 18%;
  height: 20%;
  z-index: 1;
  background: #d8cba8;
}

/* --- Ποτήρια (όρθια) --- */
.glasses {
  left: 67%;
  bottom: 56%;
  width: 11%;
  aspect-ratio: 2 / 1.5;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.glass {
  position: relative;
  width: 40%;
  height: 100%;
}

.glass .bowl {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 55%;
  border: 1px solid rgba(230,225,215,.55);
  border-top: none;
  border-radius: 0 0 50% 50% / 0 0 70% 70%;
  background: rgba(255,255,255,.06);
}

.glass.wine .bowl {
  background: linear-gradient(transparent 55%, rgba(110,10,20,.8) 55%);
}

.glass::before {                   /* πόδι */
  content: "";
  position: absolute;
  left: 50%;
  top: 55%;
  width: 1.5px;
  height: 40%;
  margin-left: -.75px;
  background: rgba(230,225,215,.55);
}

.glass::after {                    /* βάση */
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  bottom: 0;
  height: 2px;
  border-radius: 50%;
  background: rgba(230,225,215,.55);
}

/* Hint κάτω από το γραφείο */
.desk-hint {
  min-height: 52px;
  margin-top: 14px;
  padding: 0 10px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.55;
  color: rgba(230,215,190,.55);
  transition: color .6s ease;
}

.desk-hint.grief-active { color: rgba(240,228,205,.92); }

/* =========================
   EVENT 04 - ΜΕΓΕΘΥΜΕΝΗ ΠΡΟΒΟΛΗ
========================= */

.desk-viewer {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0,0,0,.88);
  opacity: 0;
  transition: opacity .6s ease;
}

.desk-viewer.show { opacity: 1; }

.desk-viewer-content {
  width: 100%;
  max-width: 370px;
  max-height: 100%;
  padding: 6px;
  overflow-x: hidden;
  overflow-y: auto;
}

.viewer-tip {
  margin-top: 16px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 14px;
  color: rgba(230,215,190,.55);
}

/* Εφημερίδα */
.viewer-newspaper {
  padding: 22px 20px;
  background: #dcd6c4;
  color: #16120d;
  text-align: left;
  font-family: "Times New Roman", serif;
  transform: rotate(-1deg);
  box-shadow:
    0 12px 40px rgba(0,0,0,.9),
    inset 0 0 40px rgba(90,70,40,.18);
}

.viewer-newspaper .masthead {
  text-align: center;
  font-family: "Cinzel", serif;
  font-size: 15px;
  letter-spacing: 3px;
  border-bottom: 2px solid #16120d;
  padding-bottom: 6px;
}

.viewer-newspaper .dateline {
  text-align: center;
  font-size: 10px;
  letter-spacing: 1px;
  margin: 5px 0 12px;
}

.viewer-newspaper h3 {
  margin: 0 0 10px;
  font-size: 19px;
  line-height: 1.2;
}

.viewer-newspaper p {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
}

.henry-circle {
  position: relative;
  white-space: nowrap;
}

.henry-circle::after {
  content: "";
  position: absolute;
  inset: -5px -8px;
  border: 2px solid rgba(140,20,20,.85);
  border-radius: 50%;
  transform: rotate(-3deg);
}

/* Σημειώσεις Henry (μεγάλες) */
.viewer-notes {
  padding: 14px 14px 16px 36px;
  text-align: left;
  color: #1d2233;
  background:
    linear-gradient(to right,
      transparent 24px,
      rgba(170,40,40,.45) 24px 26px,
      transparent 26px),
    repeating-linear-gradient(to bottom,
      transparent 0 20px,
      rgba(60,90,140,.22) 20px 21px),
    #e2dac6;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
  transform: rotate(1deg);
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 14px;
  line-height: 1.45;
}

.notes-title {
  font-size: 17px;
  margin-bottom: 4px;
}

.notes-symbols {
  display: flex;
  gap: 8px;
  margin: 6px 0;
  color: #7a1414;
}

.notes-symbols .vodou-symbol {
  width: 32px;
  height: 32px;
}

.viewer-notes .henry-ink { font-size: 16px; }

.notes-symbols .vodou-symbol:nth-child(2) { transform: rotate(-8deg); opacity: .8; }
.notes-symbols .vodou-symbol:nth-child(3) { transform: rotate(6deg); opacity: .6; }

/* Οθόνη υπολογιστή */
.laptop-screen {
  aspect-ratio: 16 / 10;
  padding: 14px;
  border: 10px solid #1c1d20;
  border-radius: 10px;
  background: #050607;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6f7a70;
  font-family: "Courier New", monospace;
  font-size: 13px;
}

.laptop-cursor {
  display: inline-block;
  width: 8px;
  height: 15px;
  margin-left: 4px;
  vertical-align: middle;
  background: #6f7a70;
  animation: laptopPulse 1s infinite steps(1);
}

/* Φυλλάδιο (μεγάλο, γυρίζει) */
.flyer-card {
  width: min(100%, 46vh);
  aspect-ratio: 2 / 3;
  margin: 0 auto;
  perspective: 1200px;
  cursor: pointer;
}

.flyer-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .8s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.flyer-inner.flipped { transform: rotateY(180deg); }

.flyer-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 26px 22px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
}

.flyer-front {
  background: radial-gradient(circle at 50% 30%, #3d1515, #140505 75%);
  border: 1px solid #6b5426;
  color: #d9c48c;
  font-family: "Cinzel", serif;
  text-align: center;
}

.f-title   { font-size: 14px; letter-spacing: 3px; }
.f-symbol  { font-size: 46px; margin: 16px 0; }
.f-name    { font-size: 17px; letter-spacing: 1px; }
.f-quote   { margin: 16px 0; font-family: "GFS Didot", serif; font-style: italic; font-size: 15px; color: #e8dcc0; }
.f-details { font-size: 11px; letter-spacing: 1.5px; line-height: 1.9; }

.flyer-back {
  transform: rotateY(180deg);
  align-items: flex-start;
  background: #d6cdb6;
  color: #1d2233;
  text-align: left;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 16px;
  line-height: 1.55;
}

.flyer-symbol-copy {
  width: 72px;
  height: 72px;
  margin: 10px auto 0;
  color: #1d2233;
}

.vodou-symbol {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Τα λόγια του Henry με κόκκινο μελάνι */
.henry-ink {
  color: #8b1414;
  font-size: 18px;
}

.henry-hope {
  min-height: 30px;
  margin-top: 22px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 21px;
  color: #e6ddcf;
  opacity: 0;
  transition: opacity 3s ease;
}

.henry-hope.show { opacity: 1; }


/* =========================
   EVENT 04 - ΥΠΟΛΟΓΙΣΤΗΣ: CURIOSITY LUST
========================= */

.desk-viewer-content.wide {
  max-width: 760px;
}

.laptop-frame {
  border: 10px solid #1c1d20;
  border-bottom-width: 14px;
  border-radius: 10px;
  background: #000;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
  overflow: hidden;
  cursor: default;
}

.browser {
  display: flex;
  flex-direction: column;
  height: min(74vh, 620px);
  background: #333;
  color: #f2f2f2;
  text-align: left;
  font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
}

/* Καρτέλες */
.browser-tabs {
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 6px 10px 0;
  background: #000;
}

.browser-dot {
  align-self: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #6e1a33;
}

.browser-tab {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 12px;
  border-radius: 7px 7px 0 0;
  background: #333;
  font-size: 12px;
}

.tab-x   { color: #777; font-size: 13px; }
.tab-plus { align-self: center; font-size: 20px; line-height: 1; padding-bottom: 4px; }

/* Γραμμή διεύθυνσης */
.browser-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
}

.browser-nav {
  color: #ccc;
  font-size: 14px;
  letter-spacing: 4px;
  white-space: nowrap;
}

.browser-url {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  padding: 5px 12px;
  border-radius: 20px;
  background: #c4c5c7;
  color: #555;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.browser-url svg {
  flex-shrink: 0;
  width: 13px;
  height: 13px;
  fill: none;
  stroke: #222;
  stroke-width: 2.5;
}

/* Η σελίδα του forum */
.site {
  flex: 1;
  overflow-y: auto;
  padding: 10px 16px 24px;
  -webkit-overflow-scrolling: touch;
}

.site::-webkit-scrollbar { width: 8px; }
.site::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }

.site-nav {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 13px;
  font-weight: 800;
  color: #0e6282;
}

.site-nav span { padding: 3px 9px; }

.site-nav .active {
  border: 1.5px solid #cfcfcf;
  border-radius: 20px;
}

.site-logo {
  margin: 4px 0 14px;
  font-size: clamp(30px, 9vw, 56px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1px;
  color: #0e6282;
}

.forum-topic {
  margin: 0 0 14px;
  font-size: clamp(19px, 5vw, 28px);
  font-weight: 500;
  line-height: 1.25;
}

.comments-title {
  margin: 20px 0 10px;
  font-size: 16px;
}

.forum-entry {
  margin-bottom: 14px;
}

.forum-entry.reply {
  margin: 10px 0 0 26px;
}

.forum-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: #bdbdbd;
}

.forum-avatar {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  color: #e8e8e8;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.2;
}

.forum-user.bold {
  font-weight: 700;
  color: #cfcfcf;
}

.forum-text {
  margin: 4px 0 0 29px;
  font-size: 15px;
  line-height: 1.5;
}

.forum-reply-icon {
  width: 16px;
  height: 16px;
  margin-right: 5px;
  vertical-align: -3px;
  fill: none;
  stroke: #0e6282;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}


/* =========================
   EVENT 04 - ΚΛΕΙΔΩΜΑ ΥΠΟΛΟΓΙΣΤΗ (σύμβολο)
========================= */

.lock-screen {
  height: min(74vh, 620px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  background: radial-gradient(circle at 50% 30%, #1d2a36, #07090c 75%);
  color: #dfe6ec;
  font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
  text-align: center;
}

.lock-avatar {
  width: 64px;
  height: 64px;
}

.lock-avatar .forum-avatar {
  width: 100%;
  height: 100%;
}

.lock-user {
  font-size: 18px;
  font-weight: 700;
}

.lock-label {
  margin-bottom: 8px;
  font-size: 13px;
  color: #9aa7b2;
}

.lock-symbols {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: min(100%, 320px);
}

.lock-symbol {
  aspect-ratio: 1;
  padding: 9px;

========================= */

  padding-top: 35px;
  background: #000;

.cabin-scene {
  width: 100%;
  aspect-ratio: 400 / 520;
  max-height: 66vh;
  margin: 2vh auto 0;
  overflow: hidden;
  border-radius: 4px;
  opacity: 0;
  transition: opacity 2.5s ease;
}

.cabin-scene.show { opacity: 1; }

.cabin-scene {
  position: relative;
}

.cabin-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Αν υπάρχει αληθινή φωτογραφία (cabin.jpg), μπαίνει πάνω από το σχέδιο */
.cabin-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.8) contrast(1.05) saturate(.8);
}

/* Κόκκος φιλμ και σκοτάδι στις άκρες για πιο κινηματογραφική εικόνα */
.cabin-scene::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(0,0,0,.7) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
  opacity: .35;
  mix-blend-mode: overlay;
}

/* Το φως στο παράθυρο τρεμοπαίζει */
.cabin-window,
.cabin-window-glow {
  animation: cabinFlicker 5s infinite;
}

@keyframes cabinFlicker {
  0%, 40%, 46%, 100% { opacity: 1; }
  42% { opacity: .55; }
  44% { opacity: .9; }
  45% { opacity: .4; }
}

/* Η ομίχλη κινείται αργά */
.cabin-fog {
  animation: fogDrift 18s linear infinite alternate;
}

@keyframes fogDrift {
  from { transform: translateX(0); }
  to   { transform: translateX(160px); }
}

@media (prefers-reduced-motion: reduce) {
  .cabin-window, .cabin-window-glow, .cabin-fog { animation: none; }
}

.cabin-caption {
  min-height: 48px;
  margin-top: 14px;

  font-style: italic;
  font-size: 15px;
  line-height: 1.55;
  color: rgba(230,215,190,.75);
  opacity: 0;
  transition: opacity 2s ease;
}

.cabin-caption.show { opacity: 1; }

/* Ο Henry πλησιάζει: αργό ζουμ προς την πόρτα */

.cabin-photo {
  transform-origin: 50% 76%;
  transition: transform 10s ease-in-out;
}

.cabin-scene.approach .cabin-svg,

  transform: scale(1.7);
}

}

  max-height: 66vh;

  height: 100%;
  display: block;
}

.basement-darkness {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: rgba(0,0,0,.97);

  -webkit-mask-image: radial-gradient(
    circle 70px at var(--x, 15%) var(--y, 85%),
    transparent 0, transparent 45px, black 80px
  );
  mask-image: radial-gradient(
    circle 70px at var(--x, 15%) var(--y, 85%),
    transparent 0, transparent 45px, black 80px
  );

  transition: opacity 2s ease;
}

.basement-darkness.found { opacity: .5; }

/* Ο φακός σβήνει: απόλυτο σκοτάδι */
.basement-scene.lights-out .basement-darkness {
  opacity: 1;

  mask-image: none;
  transition: none;

/* Διαγραφή με μελάνι */

  position: absolute;

  top: 55%;

  height: 2px;
  background: #1d2233;

}

  content: "";
  position: absolute;
  inset: -6px -12px;

  border-radius: 50%;
  opacity: 0;
  transform: rotate(-2deg) scale(.6);

<script>

let selectedLanguage = "gr";


function enterExperience(language) {

  selectedLanguage = language;

  // Ξεκλείδωμα audio για mobile browsers
  document.querySelectorAll("audio").forEach(audio => {
    audio.muted = true;

    const playPromise = audio.play();

    if (playPromise !== undefined) {
      playPromise.then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
      }).catch(() => {
        audio.muted = false;
      });
    }
  });

  document
    .getElementById("languageScreen")
    .classList.add("hidden");

  document
    .getElementById("videoScreen")
    .classList.remove("hidden");

  document
    .getElementById("navigationArrows")
    .classList.remove("hidden");

  updateLanguage();
}


// ==========================================
// ΕΛΕΓΧΟΣ ACTIVE EVENT / TIMERS
// ==========================================

let eventTimers = [];
let eventIntervals = [];

function eventTimeout(callback, delay) {

  const timer = setTimeout(callback, delay);

  eventTimers.push(timer);

  return timer;
}

function eventInterval(callback, delay) {

  const interval = setInterval(callback, delay);

  eventIntervals.push(interval);

  return interval;
}

function clearEventTimers() {

  eventTimers.forEach(timer => clearTimeout(timer));
  eventIntervals.forEach(interval => clearInterval(interval));

  eventTimers = [];
  eventIntervals = [];
}


// RESET ΟΛΩΝ ΤΩΝ ΗΧΩΝ ΚΑΙ VIDEO
function resetMedia() {

  document.querySelectorAll("audio, video").forEach(media => {

    media.pause();

    try {
      media.currentTime = 0;
    } catch (e) {}

    if (media.tagName === "AUDIO") {
      media.volume = 1;
    }

  });

}


// RESET EVENT 03
function resetEvent3() {

  const container = document.getElementById("storyText3");
  const fireScene = document.getElementById("fireScene");
  const statement = document.getElementById("henryStatement");
  const report = document.getElementById("fireReport");

  // Reset φακού / κρυμμένης φωτογραφίας
  evidenceFound = false;
  hotspotTimer = null;
  document.getElementById("hiddenEvidence").classList.remove("show");
  document.getElementById("hiddenEvidence").classList.add("hidden");
  document.getElementById("evidenceDarkness").classList.remove("found");

        "You took her from me.",

        "Not her.",
        "It should have been you. I'll fix it."

  container.innerHTML = "";

  lines.forEach((line, index) => {

  eventTimeout(() => {

    const screen3 = document.getElementById("storyScreen3");

    if (screen3.classList.contains("hidden")) {

         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();

// Τυχαία σκισμένη άκρη - διαφορετική σε κάθε σελίδα
function makeTornEdge() {
  const count = 16;
  const points = [];
  for (let i = 0; i < count; i++) {
    points.push({
      x: (i / (count - 1)) * 100,
      y: 2 + Math.random() * 6        // 2%–8% από την κορυφή
    });
  }
  return points;
}

function tearOffSheet(nextDate) {

  const page = document.getElementById("calendarPage");
  const stub = document.getElementById("calendarStub");

  // 1. Αντίγραφο της τρέχουσας σελίδας -> αυτό θα σκιστεί
  const sheet = page.cloneNode(true);
  sheet.removeAttribute("id");
  sheet.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
  sheet.classList.add("torn-sheet");
  page.parentElement.appendChild(sheet);

  // 2. Από κάτω εμφανίζεται ήδη η επόμενη μέρα
  setCalendarDate(nextDate);

  // 3. Σχήματα σκισίματος
  const edge = makeTornEdge();
  const poly = pts =>
    `polygon(${pts.map(p => `${p.x}% ${p.y}%`).join(", ")}, 100% 100%, 0% 100%)`;

  const intact  = poly(edge.map(p => ({ x: p.x, y: 0 })));
  const halfway = poly(edge.map(p => ({ x: p.x, y: p.x > 55 ? p.y : 0 }))); // σκίζεται από δεξιά
  const torn    = poly(edge);

  const drift = -20 + Math.random() * 40;
  const spin  = 6 + Math.random() * 10;

  const anim = sheet.animate([
    { offset: 0,   clipPath: intact,  transform: "translate(0,0) rotate(0deg)",   opacity: 1 },
    { offset: 0.2, clipPath: halfway, transform: "translate(0,2px) rotate(1.5deg)", opacity: 1 },
    { offset: 0.4, clipPath: torn,    transform: "translate(0,6px) rotate(3deg)",   opacity: 1 },
    { offset: 1,   clipPath: torn,    transform: `translate(${drift}px,190px) rotate(${spin}deg)`, opacity: 0 }
  ], { duration: 700, easing: "ease-in", fill: "forwards" });

  // 4. Τη στιγμή που αποκολλάται, μένει το σκισμένο κομμάτι πάνω
  eventTimeout(() => {
    stub.style.clipPath =
      `polygon(0% 0%, 100% 0%, ${[...edge].reverse().map(p => `${p.x}% ${p.y}%`).join(", ")})`;
  }, 280);

  anim.onfinish = () => sheet.remove();
}

// Μόνιμη φθορά: κάθε πένθιμο γεγονός παίρνει κάτι για πάντα
let griefLoss = 0;

function applyCalendarLife(progress, grieving) {

  const calendar = document.getElementById("calendar");
  const wither = document.getElementById("calendarWither");

  // Φθορά από τον χρόνο + από τα πένθιμα γεγονότα
  let brightness = 1 - progress * 0.25 - griefLoss * 0.5;
  let saturation = 1 - progress * 0.5 - griefLoss;
  let sepia = Math.min(0.3, griefLoss);
  let witherOpacity = griefLoss * 1.5;

  // Τη στιγμή του πένθους: μαρασμός
  if (grieving) {
    brightness -= 0.3;
    saturation -= 0.45;
    sepia = 0.4;
    witherOpacity = 1;
  }

  calendar.style.filter =
    `brightness(${Math.max(0.3, brightness)}) ` +
    `saturate(${Math.max(0, saturation)}) ` +
    `sepia(${sepia})`;

  wither.style.opacity = Math.min(1, witherOpacity);

  calendar.classList.toggle("grieving", grieving);
  document.getElementById("storyScreen4").classList.toggle("mourning", grieving);
}

function startEvent4Calendar() {

  const current = new Date(CALENDAR_START);
  const totalDays = Math.round((CALENDAR_END - CALENDAR_START) / 86400000);
  let delay = 900;

  // Καθαρή εκκίνηση
  document.querySelectorAll(".torn-sheet").forEach(s => s.remove());
  document.getElementById("calendarStub").style.clipPath = "";
  document.getElementById("calendarMark").classList.remove("draw");
  document.getElementById("griefLine").classList.remove("show");
  griefLoss = 0;
  applyCalendarLife(0, false);
  resetDeskScene();
  resetResearchScene();
  setCalendarDate(current);

  function tick() {

    if (document.getElementById("storyScreen4").classList.contains("hidden")) return;

    const remaining = Math.round((CALENDAR_END - current) / 86400000);

    if (remaining <= 0) {
      onCalendarFinished();
      return;
    }

    let step = 1;

    if (remaining <= 10) {
      delay = Math.min(delay * 1.3, 1200);   // φρενάρει στις τελευταίες μέρες
    } else {
      delay = Math.max(delay * 0.88, 90);    // επιταχύνει
      if (delay <= 100) step = 4;            // στη μέγιστη ταχύτητα, 4 μέρες τη φορά
    }

    step = Math.min(step, remaining);

    // Να μην προσπεράσει ποτέ πένθιμη μέρα
    const nextMoment = calendarMoments.find(m => m.date > current);
    if (nextMoment) {
      const toMoment = Math.round((nextMoment.date - current) / 86400000);
      step = Math.min(step, toMoment);
    }

    current.setDate(current.getDate() + step);
    tearOffSheet(current);

    // Πόσος χρόνος έχει περάσει (0 → 1)
    const progress =
      1 - Math.round((CALENDAR_END - current) / 86400000) / totalDays;

    const moment = calendarMoments.find(m => sameDay(m.date, current));

    // ===== ΠΕΝΘΙΜΗ ΜΕΡΑ =====
    if (moment) {

      // Το ημερολόγιο μαραζώνει, ο κόσμος σκοτεινιάζει
      applyCalendarLife(progress, true);

      eventTimeout(() => {
        showGriefLine(selectedLanguage === "gr" ? moment.gr : moment.en, 4200);
      }, 900);

      // Συνέρχεται λίγο, αλλά κρατά μόνιμη φθορά
      eventTimeout(() => {
        griefLoss += 0.06;
        applyCalendarLife(progress, false);
      }, 5400);

      delay = 400;
      eventTimeout(tick, 6800);
      return;
    }

    // ===== ΚΑΝΟΝΙΚΗ ΜΕΡΑ =====
    applyCalendarLife(progress, false);

    eventTimeout(tick, delay);
  }

  eventTimeout(tick, 1200); // μικρή παύση πριν αρχίσει
}

function onCalendarFinished() {

  // Στιγμή σιωπής και μετά ο κόκκινος κύκλος
  eventTimeout(() => {

function resetDeskScene() {

  deskDone = false;
  finalPhase = false;
  finalForumOpened = false;
  finalDone = false;
  laptopUnlocked = false;

  const finalDate = document.getElementById("finalDate");
  finalDate.classList.remove("show");

  deskSeen.flyer = false;
  deskSeen.notes = false;

  document.getElementById("calendarScene").classList.remove("hidden", "fade-out");

  desk.classList.remove("show");

function showDeskScene() {

  const calendarScene = document.getElementById("calendarScene");
  const desk = document.getElementById("deskScene");

  document.getElementById("deskHint").textContent = deskText().hint;

  calendarScene.classList.add("fade-out");

  eventTimeout(() => {
    calendarScene.classList.add("hidden");
    desk.classList.remove("hidden");
    eventTimeout(() => desk.classList.add("show"), 50);
  }, 1500);
}

function openDeskItem(type) {

  const t = deskText();
  const viewer = document.getElementById("deskViewer");
  const content = document.getElementById("deskViewerContent");

  // Το 2019 ο υπολογιστής μένει κλειστός. Ανοίγει μόνο στην τελική σκηνή.
  if (type === "laptop" && !finalPhase) {
    tapGriefItem("laptop");
    return;
  }

  // ===== ΜΑΡΤΥΡΙΑ (ΕΦΗΜΕΡΙΔΑ) =====
  if (type === "newspaper") {

    content.innerHTML = `
      <div class="viewer-newspaper">
        <div class="masthead">THE EVENING CHRONICLE</div>
        <div class="dateline">${t.dateline}</div>
        <h3>${t.headline}</h3>
        <p>${t.article}</p>
      </div>
      <div class="viewer-tip">${t.closeTip}</div>`;

    deskSeen.newspaper = true;
    document.getElementById("newspaperClip").classList.add("seen");
  }

  // ===== ΣΗΜΕΙΩΣΕΙΣ HENRY =====
  if (type === "notes") {

    content.innerHTML = `
      <div class="viewer-notes">${t.notes}</div>
      <div class="viewer-tip">${t.closeTip}</div>`;

    deskSeen.notes = true;
    document.getElementById("deskNotes").classList.add("seen");
  }

  // ===== ΥΠΟΛΟΓΙΣΤΗΣ: κλείδωμα με σύμβολο → forum Curiosity Lust =====
  if (type === "laptop") {

    content.innerHTML = laptopUnlocked
      ? `${buildForumSite()}<div class="viewer-tip">${t.laptopTip}</div>`
      : `${buildLockScreen()}<div class="viewer-tip">${t.closeTip}</div>`;
  }

  // Ο υπολογιστής ανοίγει σε πιο φαρδύ παράθυρο
  content.classList.toggle("wide", type === "laptop");

  // ===== ΦΥΛΛΑΔΙΟ ΜΕΝΤΙΟΥΜ (γυρίζει) =====
  if (type === "flyer") {

    content.innerHTML = `
      <div class="flyer-card" onclick="flipCard(event, 'flyer')">
        <div id="cardInner" class="flyer-inner">
          <div class="flyer-face flyer-front">
            <div class="f-title">${t.flyerTitle}</div>
            <div class="f-symbol">☽&#xFE0E;</div>
            <div class="f-name">Madame Céleste Marchand</div>
            <div class="f-quote">${t.flyerQuote}</div>
            <div class="f-details">${t.flyerDetails}</div>
          </div>
          <div class="flyer-face flyer-back">${t.flyerBack}</div>
        </div>
      </div>
      <div class="viewer-tip">${t.flyerTip}</div>`;
  }

  viewer.classList.remove("hidden");
  eventTimeout(() => viewer.classList.add("show"), 30);
}

function flipCard(event, type) {

  // Να μην κλείσει το viewer όταν γυρίζουμε το φυλλάδιο
  event.stopPropagation();

  const inner = document.getElementById("cardInner");
  inner.classList.toggle("flipped");

  // Μετράει ως "διαβασμένο" μόνο όταν δει την πίσω πλευρά
  if (inner.classList.contains("flipped")) {
    deskSeen[type] = true;
    document.getElementById("mediumFlyer").classList.add("seen");
  }
}

function tapGriefItem(type) {

        laptop:  "Ο υπολογιστής του. Κλειδωμένος. Δεν τον είχε ανοίξει από τότε."
      }
    : {
        photo:   "He talked to her every night. She never answered.",
        mail:    "Bills. Final notices. Not a single envelope was ever opened.",
        wine:    "The wine she loved. He opened it every Friday, like before.",
        glasses: "Two glasses. He always poured two.",
        laptop:  "His computer. Locked. He hadn't opened it since."

function closeDeskItem() {

  const viewer = document.getElementById("deskViewer");

  viewer.classList.remove("show");
  eventTimeout(() => viewer.classList.add("hidden"), 600);

  // Τελική σκηνή: μόλις κλείσει το forum, τελειώνει το Event 04
  if (finalPhase) {
    if (finalForumOpened && !finalDone) {
      finalDone = true;
      eventTimeout(showFinalLine, 900);
    }
    return;
  }

  // Όταν έχει δει μαρτυρία, φυλλάδιο και σημειώσεις → ελπίδα
  if (!deskDone && deskSeen.newspaper && deskSeen.flyer && deskSeen.notes) {
    deskDone = true;
    eventTimeout(showHenryHope, 900);
  }
}

function tryLockSymbol(key) {

  if (laptopUnlocked) return;

  const t = deskText();
  const button = document.getElementById("lock-" + key);
  const message = document.getElementById("lockMessage");

  if (key === "baron") {

    laptopUnlocked = true;
    finalForumOpened = true;

    button.classList.add("correct");
    message.style.color = "#5fa873";
    message.textContent = t.lockCorrect;

    // Ξεκλειδώνει και ανοίγει το forum
    eventTimeout(() => {
      document.getElementById("deskViewerContent").innerHTML =

    }, 1300);

  } else {

    button.classList.add("wrong");
    message.style.color = "#e06060";
    message.textContent = t.lockWrong;
  }
}

        <span>| ${entry.date}</span>
      </div>
      <div class="forum-text">${isReply ? forumReplyIcon : ""}${entry.text}</div>

}

function resetResearchScene() {

  researchPhase = "read";
  researchRead.clear();

  const scene = document.getElementById("researchScene");
  scene.classList.remove("show");
  scene.classList.add("hidden");

  document.getElementById("researchList").innerHTML = "";
  document.getElementById("researchQuestion").classList.remove("show");
  document.getElementById("researchMessage").textContent = "";

  // Επαναφορά των στοιχείων του γραφείου
  deskElements.forEach(id => {
    document.getElementById(id).classList.remove("desk-fade");
  });
}

function showResearchScene() {

  const t = researchText();

  // Σβήνουν γραφείο, hint, γρίφος και φράση
  deskElements.forEach(id => {
    document.getElementById(id).classList.add("desk-fade");
  });

  eventTimeout(() => {

    deskElements.forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });

    document.getElementById("researchDate").textContent = t.date;
    document.getElementById("notebookTitle").textContent = t.title;
    document.getElementById("researchQuestion").textContent = t.question;

    document.getElementById("researchList").innerHTML = t.paths.map(p => `
      <div class="research-entry" id="entry-${p.id}" onclick="tapResearchEntry('${p.id}')">
        <div class="entry-name">${p.name}</div>
        <div class="entry-note">${p.note}</div>
      </div>
    `).join("");

    const scene = document.getElementById("researchScene");
    scene.classList.remove("hidden");

    eventTimeout(() => {
      scene.classList.add("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }, 50);

  }, 1500);
}

function tapResearchEntry(id) {

  const t = researchText();
  const entry = document.getElementById("entry-" + id);
  const message = document.getElementById("researchMessage");

  // ΦΑΣΗ 1: Ο παίκτης διαβάζει τις σημειώσεις
  if (researchPhase === "read") {

    entry.classList.add("revealed");
    researchRead.add(id);

    if (researchRead.size === t.paths.length) {

      researchPhase = "choose";

      eventTimeout(() => {
        const q = document.getElementById("researchQuestion");
        q.classList.add("show");
        q.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 1200);
    }

    return;
  }

  // ΦΑΣΗ 2: Ο παίκτης επιλέγει το ανοιχτό μονοπάτι
  if (researchPhase === "choose") {

    if (id === "nola") {

      researchPhase = "done";
      entry.classList.add("circled");

      message.style.color = "#5fa873";
      message.textContent = t.correct;

      // Όλα τα άλλα διαγράφονται
      t.paths.forEach(p => {
        if (p.id !== "nola") {
          document.getElementById("entry-" + p.id).classList.add("struck");
        }
      });

      eventTimeout(onResearch1Solved, 4500);

    } else {

      entry.classList.add("struck");
      message.style.color = "#b83232";
      message.textContent = t.wrong;
    }
  }
}

function onResearch1Solved() {
  // Εδώ θα μπουν αργότερα τα στάδια 2–5 της έρευνας.
  // Προς το παρόν πάμε κατευθείαν στην τελική σκηνή (υπολογιστής / forum).
  showFinalForumScene();

// EVENT 05 - ΑΙΜΑ (ρεαλιστικές σταγόνες σε canvas)
// =========================================

let bloodFrame = null;

function stopBloodEffect() {

  if (bloodFrame) cancelAnimationFrame(bloodFrame);
  bloodFrame = null;

  const canvas = document.getElementById("bloodCanvas");
  const ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.classList.add("hidden");
}

function startBloodEffect(duration) {

  const canvas = document.getElementById("bloodCanvas");
  const ctx = canvas.getContext("2d");

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth;
  const H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.classList.remove("hidden");

  // Σταγόνες: διαφορετικό πάχος, ταχύτητα και στιγμή που ξεκινούν
  const count = Math.max(10, Math.round(W / 20));
  const drips = [];

  for (let i = 0; i < count; i++) {
    const thick = Math.random() < 0.2;
    drips.push({
      x: (i + 0.15 + Math.random() * 0.7) * (W / count),
      w: thick ? 9 + Math.random() * 7 : 3 + Math.random() * 6,
      len: 0,
      delay: Math.random() * duration * 0.35,
      speed: 18 + Math.random() * 45,
      phase: Math.random() * 10,
      shade: Math.floor(Math.random() * 25)
    });
  }

  const FLOOD_START = duration * 0.5;
  const start = performance.now();
  let last = start;

  function wave(x, t, amp) {
    return amp * (Math.sin(x * 0.021 + t * 1.2) * 0.6 + Math.sin(x * 0.063 + 2.1 + t * 0.7) * 0.4);
  }

  function drawDrip(d, top, tipY) {

    const w = d.w;
    const r = w * 0.62;
    const neck = w * 0.42;

    // Σώμα της σταγόνας
    const g = ctx.createLinearGradient(0, 0, 0, tipY);
    g.addColorStop(0, `rgb(${58 + d.shade},3,6)`);
    g.addColorStop(0.7, `rgb(${112 + d.shade},9,13)`);
    g.addColorStop(1, `rgb(${138 + d.shade},12,17)`);

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(d.x - w * 1.4, 0);
    ctx.bezierCurveTo(d.x - w * 0.9, top + 4, d.x - neck, top + 10, d.x - neck, tipY - r);
    ctx.arc(d.x, tipY - r, r, Math.PI, 0, true);
    ctx.bezierCurveTo(d.x + neck, top + 10, d.x + w * 0.9, top + 4, d.x + w * 1.4, 0);
    ctx.closePath();
    ctx.fill();

    // Γυαλάδα (το φως πάνω στο υγρό)
    ctx.strokeStyle = "rgba(255,150,150,.16)";
    ctx.lineWidth = Math.max(1, w * 0.14);
    ctx.beginPath();
    ctx.moveTo(d.x - w * 0.18, top + 6);
    ctx.lineTo(d.x - w * 0.18, tipY - r * 1.2);
    ctx.stroke();

    ctx.fillStyle = "rgba(255,210,210,.28)";
    ctx.beginPath();
    ctx.ellipse(d.x - r * 0.35, tipY - r * 1.15, r * 0.22, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function frame(now) {

    const t = (now - start) / 1000;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    ctx.clearRect(0, 0, W, H);

    // Το αίμα μαζεύεται σιγά σιγά στο πάνω μέρος
    const poolH = Math.min(1, t / (duration * 0.3)) * 16;

    // Πλημμύρα: στο δεύτερο μισό κατεβαίνει όλο και πιο γρήγορα
    let floodY = 0;
    if (t > FLOOD_START) {
      const k = Math.min(1, (t - FLOOD_START) / (duration - FLOOD_START));
      floodY = k * k * k * (H + 90);
    }

    // Σταγόνες που τρέχουν: σταματούν και ξεκινούν, βαραίνουν όσο μακραίνουν
    for (const d of drips) {

      if (t < d.delay) continue;

      const stickSlip = 0.2 + 0.8 * Math.max(0, Math.sin(t * 1.6 + d.phase));
      const heavier = 1 + (d.len / H) * 2;
      d.len += d.speed * stickSlip * heavier * dt;

      const tipY = poolH + 4 + d.len;
      if (tipY < floodY + 10) continue;

      drawDrip(d, poolH, tipY);
    }

    // Η λίμνη αίματος στο πάνω μέρος
    const pool = ctx.createLinearGradient(0, 0, 0, poolH + 6);
    pool.addColorStop(0, "#3a0003");
    pool.addColorStop(1, "#6e080c");
    ctx.fillStyle = pool;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(W, 0);
    for (let x = W; x >= 0; x -= 8) ctx.lineTo(x, poolH + wave(x, t, 3));
    ctx.closePath();
    ctx.fill();

    // Το κύμα που καλύπτει όλη την οθόνη
    if (floodY > 0) {
      const flood = ctx.createLinearGradient(0, 0, 0, floodY + 20);
      flood.addColorStop(0, "#240002");
      flood.addColorStop(0.8, "#5c0609");
      flood.addColorStop(1, "#7e0b10");
      ctx.fillStyle = flood;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(W, 0);
      for (let x = W; x >= 0; x -= 6) ctx.lineTo(x, floodY + wave(x, t, 16));
      ctx.closePath();
      ctx.fill();

      // Σταγόνες που κρέμονται από την άκρη του κύματος
      for (const d of drips) {
        const extra = 8 + ((d.phase * 37) % 45) * (0.6 + 0.4 * Math.sin(t * 1.3 + d.phase));
        ctx.save();
        ctx.translate(0, floodY + wave(d.x, t, 16) - 6);
        drawDrip(d, 4, extra);
        ctx.restore();
      }
    }

    if (t < duration) {
      bloodFrame = requestAnimationFrame(frame);
    } else {
      ctx.fillStyle = "#240002";
      ctx.fillRect(0, 0, W, H);
      bloodFrame = null;
    }
  }

  bloodFrame = requestAnimationFrame(frame);
}
