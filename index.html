<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSESSED</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=GFS+Didot&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #eee;
}

body {
  font-family: "Noto Serif", serif;
}

.screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px 22px;
}

.hidden {
  display: none !important;
}


/* =========================
   ΠΡΩΤΗ ΟΘΟΝΗ
========================= */

#languageScreen {
  overflow: hidden;

  background-image:
    linear-gradient(
      rgba(0,0,0,.18),
      rgba(0,0,0,.32)
    ),
    url("file_00000000a95081f4ad0a889b8883d67c.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

#languageScreen::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,.22) 60%,
      rgba(0,0,0,.75) 100%
    );

  pointer-events: none;
}

.language-content {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 430px;

  display: flex;
  flex-direction: column;
  align-items: center;

  transform: translateY(90px);
}


/* LANGUAGE BUTTONS */

.language-button {
  width: 290px;
  max-width: 90%;

  margin: 8px 0;
  padding: 17px 20px;

  background: rgba(3,3,3,.76);

  border: 1px solid rgba(130,20,20,.8);

  color: #e3dfd8;

  font-family: "Cinzel", serif;
  font-size: 15px;
  font-weight: 500;

  letter-spacing: 2px;

  cursor: pointer;

  backdrop-filter: blur(3px);

  transition:
    background .25s,
    border-color .25s,
    transform .15s;
}

.language-button:active {
  transform: scale(.98);

  background: rgba(80,0,0,.35);

  border-color: #b32828;
}

.flag {
  margin-right: 13px;
  font-size: 21px;
}


/* =========================
   LANGUAGE SWITCHER
========================= */

#languageSwitcher {
  position: fixed;

  top: 14px;
  right: 14px;

  z-index: 1000;

  display: flex;

  gap: 2px;

  padding: 4px;

  background: rgba(0,0,0,.72);

  border: 1px solid rgba(120,20,20,.4);

  border-radius: 4px;
}

#languageSwitcher button {
  border: 0;

  background: transparent;

  padding: 4px 6px;

  font-size: 19px;

  cursor: pointer;

  opacity: .4;
}

#languageSwitcher button.active {
  opacity: 1;
}

/* =========================
   VIDEO / INTRO
========================= */

#videoScreen {
  background:
    radial-gradient(
      circle at center,
      #140707 0%,
      #050303 45%,
      #000 100%
    );
}

.video-frame {
  position: relative;

  width: min(100%, 400px);

  aspect-ratio: 9 / 16;

  max-height: 62vh;

  background: #050505;

  border: 1px solid #351010;

  overflow: hidden;

  box-shadow:
    0 0 45px rgba(80,0,0,.18),
    inset 0 0 50px #000;
}

.placeholder {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Cinzel", serif;

  color: #5d5555;

  font-size: 12px;

  letter-spacing: 4px;
}


/* ΚΕΙΜΕΝΟ ΔΕΥΤΕΡΗΣ ΟΘΟΝΗΣ */

.quote {
  max-width: 520px;

  margin: 30px auto;

  color: #e0dcd5;

  font-family: "GFS Didot", serif;

  font-size: 19px;
  font-weight: 400;
  font-style: italic;

  line-height: 1.75;

  letter-spacing: .2px;

  text-shadow:
    0 1px 2px rgba(0,0,0,.8);
}


/* START BUTTON */

.start-button {
  width: 300px;

  max-width: 90%;

  padding: 16px;

  background: rgba(0,0,0,.5);

  color: #ddd8d0;

  border: 1px solid #651313;

  font-family: "Cinzel", serif;

  font-size: 13px;

  letter-spacing: 1.5px;

  cursor: pointer;
}

.start-button:active {
  background: rgba(90,0,0,.3);
}
/* =========================
   NAVIGATION ARROWS
========================= */

#navigationArrows {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 1000;

  display: flex;
  gap: 8px;
}

#navigationArrows button {
  width: 42px;
  height: 42px;

  border: none;
  background: transparent;
  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 25px;

  cursor: pointer;
  opacity: .75;
}

#navigationArrows button:active {
  background: transparent;
  color: #ffffff;
  opacity: 1;
}

#navigationArrows button:disabled {
  opacity: .2;
  cursor: default;
}
#navigationArrows button:active {
  background: rgba(90,0,0,.3);
  border-color: #a00000;
}

#navigationArrows button:disabled {
  opacity: .2;
  cursor: default;
}
  
</style>
</head>

<body>


<!-- ΠΡΩΤΗ ΟΘΟΝΗ -->

<div id="languageScreen" class="screen">

  <div class="language-content">

    <button
      class="language-button"
      onclick="enterExperience('gr')">

      <span class="flag">🇬🇷</span>
      ΕΛΛΗΝΙΚΑ

    </button>

    <button
      class="language-button"
      onclick="enterExperience('en')">

      <span class="flag">🇬🇧</span>
      ENGLISH

    </button>

  </div>

</div>


<!-- ΜΟΝΙΜΗ ΑΛΛΑΓΗ ΓΛΩΣΣΑΣ -->

<div id="languageSwitcher" class="hidden">

  <button
    id="grButton"
    onclick="changeLanguage('gr')">
    🇬🇷
  </button>

  <button
    id="enButton"
    onclick="changeLanguage('en')">
    🇬🇧
  </button>

</div>

<!-- NAVIGATION ARROWS -->

<div id="navigationArrows" class="hidden">

  <button id="backArrow" onclick="previousScreen()">
    ←
  </button>

  <button id="nextArrow" onclick="nextScreen()">
    →
  </button>

</div>
<!-- INTRO VIDEO -->

<div id="videoScreen" class="screen hidden">

  <div class="video-frame">

    <div class="placeholder">
      INTRO VIDEO
    </div>

  </div>


  <div
    id="introText"
    class="quote">
  </div>

<button
  id="startButton"
  class="start-button"
  onclick="nextScreen()">
</button>

</div>

<!-- ΠΡΩΤΗ ΔΙΑΔΡΑΣΤΙΚΗ ΟΘΟΝΗ -->

<div id="storyScreen1" class="screen hidden">

  <div id="storyText1" class="quote"></div>

</div>
<script>

let selectedLanguage = "gr";


function enterExperience(language) {

  selectedLanguage = language;

  document
    .getElementById("languageScreen")
    .classList.add("hidden");

  document
    .getElementById("videoScreen")
    .classList.remove("hidden");

  document
    .getElementById("languageSwitcher")
    .classList.remove("hidden");

  document
  .getElementById("navigationArrows")
  .classList.remove("hidden");

  updateLanguage();
}

function previousScreen() {

  const storyScreen1 =
    document.getElementById("storyScreen1");

  const videoScreen =
    document.getElementById("videoScreen");

  const languageScreen =
    document.getElementById("languageScreen");


  // Αν είμαστε στην 3η οθόνη → επιστροφή στο Intro
  if (!storyScreen1.classList.contains("hidden")) {

    storyScreen1.classList.add("hidden");
    videoScreen.classList.remove("hidden");

    return;
  }


  // Αν είμαστε στο Intro → επιστροφή στην επιλογή γλώσσας
  if (!videoScreen.classList.contains("hidden")) {

    videoScreen.classList.add("hidden");

    document
      .getElementById("languageSwitcher")
      .classList.add("hidden");

    document
      .getElementById("navigationArrows")
      .classList.add("hidden");

    languageScreen.classList.remove("hidden");

    return;
  }

}


function nextScreen() {

  document
    .getElementById("videoScreen")
    .classList.add("hidden");

  document
    .getElementById("storyScreen1")
    .classList.remove("hidden");

  updateLanguage();
}
  
function changeLanguage(language) {

  selectedLanguage = language;

  updateLanguage();
}


function updateLanguage() {

  const introText =
    document.getElementById("introText");

  const startButton =
    document.getElementById("startButton");

  const storyText1 =
  document.getElementById("storyText1");

  const grButton =
    document.getElementById("grButton");

  const enButton =
    document.getElementById("enButton");


  if (selectedLanguage === "gr") {

    document.documentElement.lang = "el";

    introText.innerText =
      "Όταν η αγάπη γίνεται εμμονή και δεν βλέπεις το κακό που έρχεται, η κατάσταση αρχίζει να γίνεται πολύ επικίνδυνη.";

    startButton.innerText =
      "Η ΕΜΜΟΝΗ ΞΕΚΙΝΑΕΙ";

    storyText1.innerText =
  "Κάποιες ιστορίες δεν ξεκινούν όταν συμβαίνει κάτι τρομακτικό. Ξεκινούν πολύ νωρίτερα... από κάτι που μοιάζει με αγάπη.";

    grButton.classList.add("active");

    enButton.classList.remove("active");

  }


  if (selectedLanguage === "en") {

    document.documentElement.lang = "en";

    introText.innerText =
      "When love becomes an obsession and you cannot see the evil that is coming, the situation begins to become very dangerous.";

    startButton.innerText =
      "THE OBSESSION BEGINS";

    storyText1.innerText =
  "Some stories do not begin when something frightening happens. They begin much earlier... when something looks like love.";

    enButton.classList.add("active");

    grButton.classList.remove("active");

  }

}

</script>

</body>
</html>
