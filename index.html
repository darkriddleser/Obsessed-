<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSESSED</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .screen {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      color: #8b0000;
      font-size: 46px;
      letter-spacing: 6px;
      margin: 0 0 45px;
    }

    /* ΑΡΧΙΚΗ ΕΠΙΛΟΓΗ ΓΛΩΣΣΑΣ */

    .language-button {
      width: 260px;
      max-width: 90%;
      margin: 8px;
      padding: 17px 20px;
      background: transparent;
      color: #fff;
      border: 1px solid #8b0000;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .flag {
      margin-right: 10px;
      font-size: 21px;
    }

    /* ΜΙΚΡΗ ΕΠΙΛΟΓΗ ΠΑΝΩ ΔΕΞΙΑ */

    #languageSwitcher {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
      display: flex;
      gap: 5px;
      padding: 5px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #333;
      border-radius: 5px;
    }

    #languageSwitcher button {
      border: none;
      background: transparent;
      padding: 4px 6px;
      font-size: 21px;
      cursor: pointer;
      opacity: 0.55;
    }

    #languageSwitcher button.active {
      opacity: 1;
    }

    /* INTRO */

    .quote {
      max-width: 500px;
      font-size: 19px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .start-button {
      width: 280px;
      max-width: 90%;
      padding: 17px 20px;
      background: transparent;
      color: #fff;
      border: 1px solid #8b0000;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:active {
      background: #8b0000;
    }
  </style>
</head>

<body>

  <!-- ΑΡΧΙΚΗ ΟΘΟΝΗ -->

  <div id="languageScreen" class="screen">

    <h1>OBSESSED</h1>

    <button class="language-button" onclick="enterExperience('gr')">
      <span class="flag">🇬🇷</span> ΕΛΛΗΝΙΚΑ
    </button>

    <button class="language-button" onclick="enterExperience('en')">
      <span class="flag">🇬🇧</span> ENGLISH
    </button>

  </div>


  <!-- ΜΟΝΙΜΗ ΑΛΛΑΓΗ ΓΛΩΣΣΑΣ -->

  <div id="languageSwitcher" class="hidden">

    <button id="grButton" onclick="changeLanguage('gr')">
      🇬🇷
    </button>

    <button id="enButton" onclick="changeLanguage('en')">
      🇬🇧
    </button>

  </div>


  <!-- INTRO -->

  <div id="introScreen" class="screen hidden">

    <h1>OBSESSED</h1>

    <div id="introText" class="quote"></div>

    <button id="startButton" class="start-button">
    </button>

  </div>


  <script>

    let selectedLanguage = "gr";


    function enterExperience(language) {

      selectedLanguage = language;

      document
        .getElementById("languageScreen")
        .classList.add("hidden");

      document
        .getElementById("introScreen")
        .classList.remove("hidden");

      document
        .getElementById("languageSwitcher")
        .classList.remove("hidden");

      updateLanguage();
    }


    function changeLanguage(language) {

      selectedLanguage = language;

      updateLanguage();
    }


    function updateLanguage() {

      const introText =
        document.getElementById("introText");

      const startButton =
        document.getElementById("startButton");

      const grButton =
        document.getElementById("grButton");

      const enButton =
        document.getElementById("enButton");


      if (selectedLanguage === "gr") {

        document.documentElement.lang = "el";

        introText.innerText =
          "Όταν η αγάπη γίνεται εμμονή και δεν βλέπεις το κακό που έρχεται, η κατάσταση αρχίζει να γίνεται πολύ επικίνδυνη.";

        startButton.innerText =
          "Η ΕΜΜΟΝΗ ΞΕΚΙΝΑΕΙ";

        grButton.classList.add("active");
        enButton.classList.remove("active");

      }


      if (selectedLanguage === "en") {

        document.documentElement.lang = "en";

        introText.innerText =
          "When love becomes an obsession and you cannot see the evil that is coming, the situation begins to become very dangerous.";

        startButton.innerText =
          "THE OBSESSION BEGINS";

        enButton.classList.add("active");
        grButton.classList.remove("active");

      }

    }

  </script>

</body>
</html>
