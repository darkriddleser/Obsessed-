function stopBloodPool() {

  if (poolFrame) cancelAnimationFrame(poolFrame);
  poolFrame = null;

  const canvas = document.getElementById("poolCanvas");
  const ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function startBloodPool(duration) {

  const scene = document.getElementById("poolScene");
  const canvas = document.getElementById("poolCanvas");
  const ctx = canvas.getContext("2d");

  const rect = scene.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cx = W * POOL_ORIGIN.x;
  const cy = H * POOL_ORIGIN.y;
  const Rmax = Math.hypot(W, H) * 0.5;

  // Ακανόνιστο σχήμα: κάθε σημείο της άκρης έχει δική του "τύχη"
  const N = 80;
  const seedA = Math.random() * 10;
  const seedB = Math.random() * 10;

  // "Γλώσσες" αίματος που τρέχουν πιο μακριά προς κάποιες κατευθύνσεις
  const lobes = Array.from({ length: 6 }, () => ({
    ang: Math.random() * Math.PI * 2,
    amp: 0.15 + Math.random() * 0.4,
    width: 0.25 + Math.random() * 0.35,
    delay: Math.random() * 0.45
  }));

  const start = performance.now();

  function edgePoints(R, k, t) {

    const pts = [];

    for (let i = 0; i < N; i++) {

      const ang = (i / N) * Math.PI * 2;

      let r = 1
        + 0.08 * Math.sin(ang * 3 + seedA)
        + 0.05 * Math.sin(ang * 7 + seedB + t * 0.3)
        + 0.03 * Math.sin(ang * 13 + seedA * 2);

      for (const lobe of lobes) {
        const diff = Math.atan2(Math.sin(ang - lobe.ang), Math.cos(ang - lobe.ang));
        const grow = Math.max(0, Math.min(1, (k - lobe.delay) / 0.5));
        r += lobe.amp * grow * Math.exp(-((diff / lobe.width) ** 2));
      }

      pts.push({
        x: cx + Math.cos(ang) * R * r,
        y: cy + Math.sin(ang) * R * r * POOL_FLATTEN
      });
    }

    return pts;
  }

  function tracePath(pts) {
    ctx.beginPath();
    const last = pts[pts.length - 1];
    ctx.moveTo((last.x + pts[0].x) / 2, (last.y + pts[0].y) / 2);
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const n = pts[(i + 1) % pts.length];
      ctx.quadraticCurveTo(p.x, p.y, (p.x + n.x) / 2, (p.y + n.y) / 2);
    }
    ctx.closePath();
  }

  function frame(now) {

    const t = (now - start) / 1000;
    const k = Math.min(1, t / duration);

    // Αρχίζει σαν λίγο αίμα που βγαίνει, μετά απλώνεται και στο τέλος σέρνεται αργά
    const grow = k < 0.15
      ? Math.pow(k / 0.15, 2) * 0.04
      : 0.04 + Math.pow((k - 0.15) / 0.85, 1.15) * 0.96;

    const R = Math.max(2, Rmax * grow);

    ctx.clearRect(0, 0, W, H);

    const pts = edgePoints(R, k, t);

    // Το αίμα (το canvas ανακατεύεται με τη φωτογραφία σε "multiply")
    const fill = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.1);
    fill.addColorStop(0, "#4a0306");
    fill.addColorStop(0.5, "#7a0a10");
    fill.addColorStop(1, "#b5141c");

    tracePath(pts);
    ctx.fillStyle = fill;
    ctx.fill();

    // Πιο σκούρα άκρη, όπως στο αληθινό υγρό
    ctx.strokeStyle = "rgba(60,0,4,.6)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Το αίμα σβήνει απαλά προς τα πάνω, για να μένει στο πάτωμα
    const floorFade = ctx.createLinearGradient(0, H * POOL_FLOOR_TOP, 0, H * (POOL_FLOOR_TOP + 0.14));
    floorFade.addColorStop(0, "rgba(0,0,0,0)");
    floorFade.addColorStop(1, "rgba(0,0,0,1)");
    ctx.globalCompositeOperation = "destination-in";
    ctx.fillStyle = floorFade;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";

    if (t < duration + 2) {
      poolFrame = requestAnimationFrame(frame);
    } else {
      poolFrame = null;
    }
  }

  poolFrame = requestAnimationFrame(frame);
}

}

function moveEvidenceLight(clientX, clientY) {

  const evidence = document.getElementById("hiddenEvidence");
  const darkness = document.getElementById("evidenceDarkness");

  const rect = evidence.getBoundingClientRect();

  const x = clientX - rect.left;
  const y = clientY - rect.top;

  const xPercent = (x / rect.width) * 100;
  const yPercent = (y / rect.height) * 100;

  // Ο φακός ακολουθεί το δάχτυλο
  darkness.style.setProperty("--x", x + "px");
  darkness.style.setProperty("--y", y + "px");

  if (evidenceFound) return;

  // Μόλις κουνήσει τον φακό για πρώτη φορά: να τον κρατήσει πάνω σε ό,τι βρει
  if (!evidenceMoved) {
    evidenceMoved = true;
    eventTimeout(() => {
      if (!evidenceFound) setEvidenceHint("hold");
    }, 1500);
  }

  if (isOnHotspot(xPercent, yPercent)) {

    // Ξεκινά η μέτρηση μόνο αν δεν τρέχει ήδη
    if (!hotspotTimer) {

      hotspotTimer = eventTimeout(() => {

        hotspotTimer = null;
        evidenceFound = true;

        // Φωτίζεται ολόκληρη η φωτογραφία
        darkness.classList.add("found");
        setEvidenceHint(null);

        // Μένει ορατή 5 δευτερόλεπτα και πάμε στο Event 04
        eventTimeout(() => {
          goToEvent4();
        }, 5000);

      }, 3000);
    }

  } else {
    // Έφυγε από το σημείο πριν περάσουν τα 3 δευτερόλεπτα
    cancelHotspotTimer();
  }
}

const hiddenEvidenceEl = document.getElementById("hiddenEvidence");

// Κινητό: άγγιγμα. Το preventDefault σταματά το κινητό από το να θεωρήσει
// το παρατεταμένο άγγιγμα "κράτημα εικόνας" και να ακυρώσει τον φακό.
function onEvidenceTouch(event) {
  event.preventDefault();
  const touch = event.touches[0];
  if (touch) moveEvidenceLight(touch.clientX, touch.clientY);
}

hiddenEvidenceEl.addEventListener("touchstart", onEvidenceTouch, { passive: false });
hiddenEvidenceEl.addEventListener("touchmove", onEvidenceTouch, { passive: false });
hiddenEvidenceEl.addEventListener("touchend", event => {
  event.preventDefault();
  cancelHotspotTimer();
}, { passive: false });

// Υπολογιστής: ποντίκι
hiddenEvidenceEl.addEventListener("mousedown", e => moveEvidenceLight(e.clientX, e.clientY));
hiddenEvidenceEl.addEventListener("mousemove", e => moveEvidenceLight(e.clientX, e.clientY));
hiddenEvidenceEl.addEventListener("mouseleave", cancelHotspotTimer);

// Χωρίς μενού με δεξί κλικ / παρατεταμένο άγγιγμα

// ΗΧΟΙ ΥΠΟΒΑΘΡΟΥ
// Παίζουν σε λούπα χωρίς κενό και αλλάζουν ομαλά από event σε event.
// =========================================

const BG_VOLUME = 0.45;

// loopAt: λίγο πριν σβήσει το τέλος του αρχείου ξεκινά ξανά από την αρχή
// με crossfade, ώστε να μην υπάρχει ποτέ σιωπή
const BG_TRACKS = {
  // Πρώτη οθόνη (επιλογή γλώσσας)
  start:   { src: "0_4.mp3", loopAt: 72.5 },
  // Από την επιλογή γλώσσας μέχρι το Event 1: δύο κομμάτια μαζί
  intro:   { layers: [ { src: "0.mp3",   loopAt: 100.3 },
                       { src: "0_1.mp3", loopAt: 21.5, gain: 0.55 } ] },
  event1:  { src: "1.mp3",   loopAt: 77 },
  event2:  { src: "2.mp3",   loopAt: 39.5 },
  event3:  { src: "3.mp3",   loopAt: 78.5 },
  event4:  { src: "4.mp3",   loopAt: 56.5 },   // όσο περνούν οι μέρες στο ημερολόγιο
  event4b: { src: "4_2.mp3", loopAt: 55 }      // από τη στιγμή που σταματά το ημερολόγιο
};

// Ποια υπόβαθρα επιτρέπονται σε κάθε οθόνη (το πρώτο είναι αυτό που ξεκινά)
const SCREEN_BACKGROUNDS = {
  languageScreen: ["start"],
  videoScreen:  ["intro"],
  storyScreen1: ["event1"],
  storyScreen2: ["event2"],
  storyScreen3: ["event3"],
  storyScreen4: ["event4", "event4b"]
};

// Ποιοι ήχοι χρειάζονται σε κάθε οθόνη (για να φορτώνουν έγκαιρα)
const SCREEN_SOUNDS = {
  storyScreen2: ["ecgAudio", "babyCry"],
  storyScreen3: ["fireAudio"],
  storyScreen5: ["cricketsAudio", "footstepsAudio", "knockAudio", "doorAudio"]
};

const SCREEN_ORDER = ["languageScreen", "videoScreen", "storyScreen1", "storyScreen2",
                      "storyScreen3", "storyScreen4", "storyScreen5"];

// Πόσο διαρκεί η μετάβαση από το υπόβαθρο ενός event στο επόμενο
const BG_CHANGE_FADE = 1200;

// Πόσο διαρκεί το crossfade στο σημείο που ξαναξεκινά η λούπα
const BG_LOOP_FADE = 2.5;

// Τα αρχεία ενός υποβάθρου (ένα ή περισσότερα που παίζουν μαζί)
function bgLayers(name) {
  const track = BG_TRACKS[name];
  return track.layers || [track];
}

let currentBg = null;
let currentBgState = null;

function visibleScreen() {
  return SCREEN_ORDER.find(id => !document.getElementById(id).classList.contains("hidden"));
}

// Φορτώνει τους ήχους της τρέχουσας και των επόμενων οθονών
// και αφήνει ελεύθερη τη μνήμη από οθόνες που πέρασαν
function preloadSounds() {

  if (!audioCtx) return;

  const idx = Math.max(0, SCREEN_ORDER.indexOf(visibleScreen()));
  const needed = new Set();

  SCREEN_ORDER.slice(Math.max(0, idx - 1), idx + 3).forEach(screen => {
    (SCREEN_BACKGROUNDS[screen] || []).forEach(name => bgLayers(name).forEach(l => needed.add(l.src)));
    (SCREEN_SOUNDS[screen] || []).forEach(id => needed.add(soundSources(id).join("|")));
  });

  needed.forEach(key => loadBuffer(key.split("|")));

  Object.keys(audioBuffers).forEach(key => {
    if (!needed.has(key)) delete audioBuffers[key];
  });
}

// ---- Web Audio: ένα κομμάτι της λούπας, με crossfade στο επόμενο ----
function scheduleBgSegment(state, buffer, startAt, fadeIn, layerLoopAt, layerGain = 1) {

  const loopAt = Math.min(layerLoopAt, buffer.duration);

  const gain = audioCtx.createGain();
  gain.gain.value = layerGain;
  gain.connect(state.bus);

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(gain);

  if (fadeIn) {
    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(layerGain, startAt + BG_LOOP_FADE);
  }

  source.start(startAt);

  const next = startAt + loopAt - BG_LOOP_FADE;
  gain.gain.setValueAtTime(layerGain, next);
  gain.gain.linearRampToValueAtTime(0, next + BG_LOOP_FADE);
  source.stop(next + BG_LOOP_FADE + 0.1);

  state.sources.push(source);
  source.onended = () => { state.sources = state.sources.filter(s => s !== source); };

  state.timers.push(setTimeout(() => {
    if (state.playing) scheduleBgSegment(state, buffer, next, true, layerLoopAt, layerGain);
  }, Math.max(0, next - audioCtx.currentTime - 2) * 1000));
}

function stopBgState(state, fade) {

  state.playing = false;
  state.timers.forEach(clearTimeout);

  if (USE_WEBAUDIO) {
    if (!audioCtx) return;
    rampParam(state.bus.gain, 0, fade);
    setTimeout(() => {
      state.sources.forEach(s => { try { s.stop(); } catch (e) {} });
      state.bus.disconnect();
    }, fade + 150);
  } else if (state.els) {
    state.els.forEach(el => rampElement(el, 0, fade, () => {
      el.pause();
      el.currentTime = 0;
    }));
  }
}

// Αλλάζει υπόβαθρο με ομαλή μετάβαση (null = κανένα)
function setBackground(name, volume = BG_VOLUME, fade = BG_CHANGE_FADE) {

  if (name === currentBg) {
    if (name) setBackgroundVolume(name, volume, fade);
    return;
  }

  // Το προηγούμενο σβήνει σιγά σιγά
  if (currentBgState) stopBgState(currentBgState, fade);

  currentBg = name;
  currentBgState = null;
  if (!name) return;

  const state = { name, target: volume, playing: true, started: false, sources: [], timers: [] };
  currentBgState = state;

  // Χωρίς Web Audio: απλό <audio> σε λούπα
  if (!USE_WEBAUDIO) {
    state.els = bgLayers(name)
      .map((l, i) => document.getElementById("bg-" + name + "-" + i))
      .filter(Boolean);
    state.els.forEach(el => {
      el.currentTime = 0;
      el.volume = 0;
      el.muted = false;
      el.play().catch(error => audioErrors.push("Υπόβαθρο: " + name + " " + error.message));
      rampElement(el, volume * el.layerGain, fade);
    });
    return;
  }

  if (!audioCtx) return;

  state.bus = audioCtx.createGain();
  state.bus.gain.value = 0;
  state.bus.connect(masterGain);

  // Όλα τα κομμάτια ξεκινούν μαζί, όταν φορτώσουν
  const layers = bgLayers(name);
  Promise.all(layers.map(l => loadBuffer([l.src]))).then(buffers => {
    if (!state.playing || !buffers.some(Boolean)) return;
    state.started = true;
    rampParam(state.bus.gain, state.target, fade);
    const startAt = audioCtx.currentTime + 0.05;
    buffers.forEach((buffer, i) => {
      if (buffer) scheduleBgSegment(state, buffer, startAt, false, layers[i].loopAt, layers[i].gain ?? 1);
    });
  });
}

// Χαμηλώνει / δυναμώνει το υπόβαθρο που παίζει (π.χ. όταν ακούγονται άλλοι ήχοι)
function setBackgroundVolume(name, volume, duration) {

  const state = currentBgState;
  if (!state || state.name !== name) return;

  state.target = volume;

  if (!USE_WEBAUDIO) {
    (state.els || []).forEach(el => rampElement(el, volume * el.layerGain, duration));
    return;
  }

  if (state.started) rampParam(state.bus.gain, volume, duration);
}

// Βρίσκει ποια οθόνη φαίνεται και βάζει το σωστό υπόβαθρο
function syncBackground() {

  preloadSounds();

  const allowed = SCREEN_BACKGROUNDS[visibleScreen()] || [];

  // Αν παίζει ήδη ένα από τα επιτρεπτά της οθόνης, το αφήνουμε
  if (currentBg && allowed.includes(currentBg)) return;

  setBackground(allowed[0] || null);
}

// Χωρίς Web Audio χρειάζονται <audio> για τα υπόβαθρα
if (!USE_WEBAUDIO) {
  Object.keys(BG_TRACKS).forEach(name => {
    bgLayers(name).forEach((layer, i) => {
      const audio = document.createElement("audio");
      audio.id = "bg-" + name + "-" + i;
      audio.className = "bg-audio";
      audio.src = layer.src;
      audio.layerGain = layer.gain ?? 1;
      audio.loop = true;
      audio.preload = "auto";
      document.body.appendChild(audio);
    });
  });
}

// Κάθε φορά που αλλάζει οθόνη, αλλάζει και το υπόβαθρο
const bgObserver = new MutationObserver(() => syncBackground());

document.querySelectorAll(".screen").forEach(screen => {
  bgObserver.observe(screen, { attributes: true, attributeFilter: ["class"] });
});

  setInterval(() => {

    const lines = [];

    lines.push("Τρόπος: " + (USE_WEBAUDIO ? "Web Audio" : "<audio> (" + location.protocol + ")"));
    if (USE_WEBAUDIO) lines.push("Ήχος: " + (audioCtx ? audioCtx.state : "δεν ξεκίνησε ακόμα (πάτα γλώσσα)"));
    lines.push("Φορτωμένα: " + Object.keys(audioBuffers).length);
    lines.push("Υπόβαθρο: " + (currentBg || "κανένα") +
      (currentBgState && currentBgState.bus ? "  ένταση " + currentBgState.bus.gain.value.toFixed(2) : "") +
      (currentBgState && USE_WEBAUDIO && !currentBgState.started ? "  (φορτώνει...)" : ""));

    if (USE_WEBAUDIO) {
      Object.keys(voices).forEach(id => {
        const v = soundVolume(id);
        lines.push("  ▶ " + id + " ένταση " + (v == null ? "-" : v.toFixed(2)) +
                   (voices[id].pending ? " (φορτώνει...)" : ""));
      });
    } else {
      document.querySelectorAll("audio").forEach(a => {
        if (!a.paused) lines.push("  ▶ " + a.id + " ένταση " + a.volume.toFixed(2));
      });
    }

    audioErrors.slice(-6).forEach(e => lines.push("⚠ " + e));

    panel.textContent = lines.join("\n");

  }, 500);
}

</script>
