<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSESSED</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .screen {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .hidden {
      display: none;
    }

    h1 {
      color: #8b0000;
      font-size: 46px;
      letter-spacing: 6px;
      margin-bottom: 40px;
    }

    .language-title {
      font-size: 16px;
      letter-spacing: 3px;
      margin-bottom: 30px;
      color: #aaa;
    }

    .language-button,
    .start-button {
      width: 260px;
      max-width: 90%;
      margin: 8px;
      padding: 17px 20px;

      background: transparent;
      color: white;

      border: 1px solid #8b0000;

      font-size: 16px;
      letter-spacing: 2px;

      cursor: pointer;
    }

    .language-button:active,
    .start-button:active {
      background: #8b0000;
    }

    .quote {
      max-width: 500px;
      font-size: 19px;
      line-height: 1.7;
      margin-bottom: 35px;
    }
  </style>
</head>

<body>

  <!-- LANGUAGE SELECTION -->

  <div id="languageScreen" class="screen">

    <h1>OBSESSED</h1>

    <div class="language-title">
      ΕΠΙΛΕΞΤΕ ΓΛΩΣΣΑ<br><br>
      SELECT LANGUAGE
    </div>

    <button class="language-button" onclick="selectLanguage('gr')">
      ΕΛΛΗΝΙΚΑ
    </button>

    <button class="language-button" onclick="selectLanguage('en')">
      ENGLISH
    </button>

  </div>


  <!-- OBSESSED INTRO -->

  <div id="introScreen" class="screen hidden">

    <h1>OBSESSED</h1>

    <div id="introText" class="quote"></div>

    <button id="startButton" class="start-button"></button>

  </div>


  <script>

    let selectedLanguage = "";

    function selectLanguage(language) {

      selectedLanguage = language;

      document.getElementById("languageScreen").classList.add("hidden");
      document.getElementById("introScreen").classList.remove("hidden");

      if (language === "gr") {

        document.getElementById("introText").innerText =
        "Όταν η αγάπη γίνεται εμμονή και δεν βλέπεις το κακό που έρχεται, η κατάσταση αρχίζει να γίνεται πολύ επικίνδυνη.";

        document.getElementById("startButton").innerText =
        "Η ΕΜΜΟΝΗ ΞΕΚΙΝΑΕΙ";

      }

      if (language === "en") {

        document.getElementById("introText").innerText =
        "When love becomes an obsession and you cannot see the evil that is coming, the situation begins to become very dangerous.";

        document.getElementById("startButton").innerText =
        "THE OBSESSION BEGINS";

      }

    }

  </script>

</body>
</html>
