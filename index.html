<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSESSED</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=GFS+Didot&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #eee;
}

body {
  font-family: "Noto Serif", serif;
}

.screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 80px 24px 90px;

  overflow-x: hidden;
}

.hidden {
  display: none !important;
}


/* =========================
   ΠΡΩΤΗ ΟΘΟΝΗ
========================= */

#languageScreen {
  overflow: hidden;

  background-image:
    linear-gradient(
      rgba(0,0,0,.18),
      rgba(0,0,0,.32)
    ),
    url("file_00000000a95081f4ad0a889b8883d67c.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

#languageScreen::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,.22) 60%,
      rgba(0,0,0,.75) 100%
    );

  pointer-events: none;
}

.language-content {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 430px;

  display: flex;
  flex-direction: column;
  align-items: center;

  transform: translateY(90px);
}


/* LANGUAGE BUTTONS */

.language-button {
  width: 290px;
  max-width: 90%;

  margin: 8px 0;
  padding: 17px 20px;

  background: rgba(3,3,3,.76);
  border: 1px solid rgba(130,20,20,.8);

  color: #e3dfd8;

  font-family: "Cinzel", serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 2px;

  cursor: pointer;

  backdrop-filter: blur(3px);

  transition:
    background .25s,
    border-color .25s,
    transform .15s;
}

.language-button:active {
  transform: scale(.98);
  background: rgba(80,0,0,.35);
  border-color: #b32828;
}

.flag {
  margin-right: 13px;
  font-size: 21px;
}


/* =========================
   LANGUAGE SWITCHER
========================= */

#languageSwitcher {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;
  box-sizing: border-box;

  height: 55px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 3px;

  padding: 0 18px;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.95),
    rgba(0,0,0,.70),
    transparent
  );

  pointer-events: none;
}

#languageSwitcher button {
  border: 0;
  background: transparent;

  padding: 5px 6px;

  font-size: 19px;
  cursor: pointer;

  opacity: .4;

  pointer-events: auto;
}

#languageSwitcher button.active {
  opacity: 1;
}


/* =========================
   VIDEO / INTRO
========================= */

#videoScreen {
  background:
    radial-gradient(
      circle at center,
      #140707 0%,
      #050303 45%,
      #000 100%
    );

  padding-top: 35px;
  padding-bottom: 100px;
  justify-content: flex-start;
}

.video-frame {
  position: relative;

  width: min(100%, 360px);
  aspect-ratio: 9 / 16;
  max-height: 48vh;

  background: #050505;
  border: 1px solid #351010;

  overflow: hidden;

  box-shadow:
    0 0 45px rgba(80,0,0,.18),
    inset 0 0 50px #000;

  flex-shrink: 1;
}


/* =========================
   STORY CHAPTER 01
========================= */

.story-chapter {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}

.chapter-number {
  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: #7d1b1b;
  margin-bottom: 6px;
}

.story-title {
  font-family: "Cinzel", serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 3px;
  margin: 0 0 20px;
  color: #eee9e2;
}


/* FLIP PHOTO */

.memory-photo {
  width: 100%;
  aspect-ratio: 2 / 3;
  margin-bottom: 22px;

  perspective: 1200px;
  cursor: pointer;

  background: transparent;
  border: none;
  overflow: visible;
}

.memory-card {
  position: relative;
  width: 100%;
  height: 100%;

  transition: transform .8s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.memory-card.flipped {
  transform: rotateY(180deg);
}

.memory-card-face {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.memory-card-back {
  transform: rotateY(180deg);
}

.memory-card-face img {
  width: 100%;
  height: 100%;
  object-fit: cover;

  display: block;

  user-select: none;
  -webkit-user-drag: none;
}


/* STORY TEXT */

.story-text {
  font-family: "GFS Didot", serif;
  font-size: 18px;
  line-height: 1.65;
  color: #d8d3cc;
  margin-bottom: 25px;
}


/* RIDDLE */

.riddle-box {
  width: 100%;
  padding-top: 20px;
  border-top: 1px solid #301010;
}

.riddle-text {
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 17px;
  line-height: 1.6;
  color: #c9c3bc;
  margin-bottom: 18px;
}

.riddle-input {
  width: 100%;
  box-sizing: border-box;

  padding: 13px 14px;

  background: rgba(0,0,0,.55);
  border: 1px solid #4a1818;

  color: #eee9e2;
  text-align: center;

  font-family: "GFS Didot", serif;
  font-size: 17px;

  outline: none;
}

.riddle-input:focus {
  border-color: #8b2525;
}

.riddle-button {
  margin-top: 12px;
  padding: 11px 24px;

  border: 1px solid #651c1c;
  background: transparent;

  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 2px;

  cursor: pointer;
}

.riddle-message {
  min-height: 22px;
  margin-top: 12px;

  font-family: "GFS Didot", serif;
  font-size: 15px;
}


/* =========================
   INTRO TEXT
========================= */

.placeholder {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Cinzel", serif;
  color: #5d5555;

  font-size: 12px;
  letter-spacing: 4px;
}

.quote {
  max-width: 520px;

  margin: 30px auto;

  color: #e0dcd5;

  font-family: "GFS Didot", serif;
  font-size: 19px;
  font-weight: 400;
  font-style: italic;

  line-height: 1.75;
  letter-spacing: .2px;

  text-shadow:
    0 1px 2px rgba(0,0,0,.8);
}


/* START BUTTON */

.start-button {
  width: 300px;
  max-width: 90%;

  padding: 16px;

  background: rgba(0,0,0,.5);

  color: #ddd8d0;

  border: 1px solid #651313;

  font-family: "Cinzel", serif;
  font-size: 13px;
  letter-spacing: 1.5px;

  cursor: pointer;
}

.start-button:active {
  background: rgba(90,0,0,.3);
}


/* =========================
   NAVIGATION ARROWS
========================= */

#navigationArrows {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  min-height: 65px;

  padding:
    8px
    18px
    max(12px, env(safe-area-inset-bottom));

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;

  background: linear-gradient(
    to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.65),
    transparent
  );

  pointer-events: none;
}

#navigationArrows button {
  width: 42px;
  height: 42px;

  border: none;
  background: transparent;
  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 25px;

  cursor: pointer;
  opacity: .75;
  pointer-events: auto;
}

#navigationArrows button:active {
  background: transparent;
  color: #ffffff;
  opacity: 1;
}

#navigationArrows button:disabled {
  opacity: .2;
  cursor: default;
}


/* =========================
   DESKTOP
========================= */

  .heart-monitor {
  width: 100%;
  margin: 35px 0;
  padding: 18px 0;
  background: #020403;
  overflow: hidden;
  box-shadow: inset 0 0 30px rgba(0, 255, 100, 0.05);
}

.monitor-line {
  width: 100%;
  height: 120px;
  overflow: hidden;
}

.monitor-line svg {
  width: 200%;
  height: 100%;
  animation: ecgMove 3s linear infinite;
}

.ecg-line {
  fill: none;
  stroke: #39ff78;
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 5px #39ff78);
}

@keyframes ecgMove {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-50%);
  }
}

@media (min-width: 768px) {

  .video-frame {
    width: 280px;
    max-height: 52vh;
  }

  .quote {
    max-width: 650px;
  }

  #languageScreen {
    background-size: auto 100%;
    background-position: center;
    background-color: #000;
  }
}

</style>
</head>

<body>


<!-- ΠΡΩΤΗ ΟΘΟΝΗ -->

<div id="languageScreen" class="screen">

  <div class="language-content">

    <button
      class="language-button"
      onclick="enterExperience('gr')">

      <span class="flag">🇬🇷</span>
      ΕΛΛΗΝΙΚΑ

    </button>

    <button
      class="language-button"
      onclick="enterExperience('en')">

      <span class="flag">🇬🇧</span>
      ENGLISH

    </button>

  </div>

</div>

<!-- ΔΕΥΤΕΡΟ ΓΕΓΟΝΟΣ -->

<div id="storyScreen2" class="screen hidden">

  <div class="story-chapter">

    <div class="chapter-number">02</div>

    <h2 id="storyTitle2" class="story-title">
      Η ΜΕΡΑ ΠΟΥ ΕΣΒΗΣΑΝ ΟΛΑ
    </h2>

    <div id="storyText2" class="story-text"></div>

    <div class="heart-monitor">

  <div class="monitor-line">
    <svg viewBox="0 0 600 120" preserveAspectRatio="none">
      <polyline
        class="ecg-line"
        points="
        0,60 60,60
        75,60 85,50 95,70 108,15 120,100 135,60
        195,60
        210,60 220,50 230,70 243,15 255,100 270,60
        330,60
        345,60 355,50 365,70 378,15 390,100 405,60
        465,60
        480,60 490,50 500,70 513,15 525,100 540,60
        600,60"
      />
    </svg>
  </div>

</div>

  </div>

</div>
<!-- NAVIGATION ARROWS -->

<div id="navigationArrows" class="hidden">

  <button id="backArrow" onclick="previousScreen()">
    ←
  </button>

</div>
<!-- INTRO VIDEO -->

<div id="videoScreen" class="screen hidden">

  <div class="video-frame">

    <div class="placeholder">
      INTRO VIDEO
    </div>

  </div>


  <div
    id="introText"
    class="quote">
  </div>

<button
  id="startButton"
  class="start-button"
  onclick="nextScreen()">
</button>

</div>

<!-- ΠΡΩΤΗ ΔΙΑΔΡΑΣΤΙΚΗ ΟΘΟΝΗ -->

<div id="storyScreen1" class="screen hidden">

  <div class="story-chapter">

    <div class="chapter-number">01</div>

    <h2 id="storyTitle1" class="story-title">
      ΠΡΙΝ ΑΠΟ ΟΛΑ
    </h2>

<div class="memory-photo" onclick="flipMemoryPhoto()">

  <div id="memoryCard" class="memory-card">

    <div class="memory-card-face memory-card-front">
      <img src="front.png" alt="Karen and Henry">
    </div>

    <div class="memory-card-face memory-card-back">
      <img id="memoryBackImage" src="back1.png" alt="Henry's note">
    </div>

  </div>

</div>

    <div id="storyText1" class="story-text"></div>

    <div class="riddle-box">

      <div id="riddleText1" class="riddle-text"></div>

      <input
        id="riddleAnswer1"
        class="riddle-input"
        type="text"
        autocomplete="off"
        placeholder="..."
      >

      <button
        id="riddleButton1"
        class="riddle-button"
        onclick="checkRiddle1()">
        ΑΠΑΝΤΗΣΗ
      </button>

      <div id="riddleMessage1" class="riddle-message"></div>

    </div>

  </div>

</div>
<script>

let selectedLanguage = "gr";


function enterExperience(language) {

  selectedLanguage = language;

  document
    .getElementById("languageScreen")
    .classList.add("hidden");

  document
    .getElementById("videoScreen")
    .classList.remove("hidden");

  document
    .getElementById("navigationArrows")
    .classList.remove("hidden");

  updateLanguage();
}

function previousScreen() {

  const storyScreen1 =
    document.getElementById("storyScreen1");

  const videoScreen =
    document.getElementById("videoScreen");

  const languageScreen =
    document.getElementById("languageScreen");


  // Αν είμαστε στην 3η οθόνη → επιστροφή στο Intro
  if (!storyScreen1.classList.contains("hidden")) {

    storyScreen1.classList.add("hidden");
    videoScreen.classList.remove("hidden");

    return;
  }


  // Αν είμαστε στο Intro → επιστροφή στην επιλογή γλώσσας
  if (!videoScreen.classList.contains("hidden")) {

    videoScreen.classList.add("hidden");

    document
      .getElementById("navigationArrows")
      .classList.add("hidden");

    languageScreen.classList.remove("hidden");

    return;
  }

}

function checkRiddle1() {

  const input = document.getElementById("riddleAnswer1");
  const message = document.getElementById("riddleMessage1");

  const answer = input.value
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "")
    .toLowerCase();

if (
  answer === "κοκκινοτριανταφυλλο" ||
  answer === "κοκκινατριανταφυλλα" ||
  answer === "redrose" ||
  answer === "redroses"
) {

    input.style.borderColor = "#2f7d45";
    message.style.color = "#5fa873";

    message.textContent =
      selectedLanguage === "gr"
        ? "Σωστά."
        : "Correct.";
  setTimeout(() => {
  nextEvent();
}, 1200);

  } else {

    input.style.borderColor = "#9b1c1c";
    message.style.color = "#b83232";

    message.textContent =
      selectedLanguage === "gr"
        ? "Λάθος απάντηση."
        : "Wrong answer.";
  }
}
  
  function flipMemoryPhoto() {
  const card = document.getElementById("memoryCard");

  if (card) {
    card.classList.toggle("flipped");
  }
}

function nextScreen() {

  document
    .getElementById("videoScreen")
    .classList.add("hidden");

  document
    .getElementById("storyScreen1")
    .classList.remove("hidden");

  updateLanguage();
}

function nextEvent() {

  document
    .getElementById("storyScreen1")
    .classList.add("hidden");

  document
    .getElementById("storyScreen2")
    .classList.remove("hidden");

  updateLanguage();
}
  
function changeLanguage(language) {

  selectedLanguage = language;

  updateLanguage();
}


function updateLanguage() {

  const introText =
    document.getElementById("introText");

  const startButton =
    document.getElementById("startButton");

  const storyText1 =
  document.getElementById("storyText1");

const storyTitle1 = document.getElementById("storyTitle1");
const storyTitle2 = document.getElementById("storyTitle2");
const storyText2 = document.getElementById("storyText2");
const riddleText1 = document.getElementById("riddleText1");
const riddleButton1 = document.getElementById("riddleButton1");
const riddleAnswer1 = document.getElementById("riddleAnswer1");


  if (selectedLanguage === "gr") {

    document.documentElement.lang = "el";
    document.getElementById("memoryBackImage").src = "back1.png";

    introText.innerText =
      "Όταν η αγάπη γίνεται εμμονή και δεν βλέπεις το κακό που έρχεται, η κατάσταση αρχίζει να γίνεται πολύ επικίνδυνη.";

    startButton.innerText =
      "Η ΕΜΜΟΝΗ ΞΕΚΙΝΑΕΙ";

storyTitle1.textContent = "ΠΡΙΝ ΑΠΟ ΟΛΑ";
    
    storyText1.innerHTML =
  "Ήταν από εκείνες τις μέρες που αργότερα θα ευχόταν να μπορούσε να ζήσει ξανά.<br><br>" +
  "Εκείνη χαμογελούσε περισσότερο τελευταία. Σε λίγους μήνες θα γίνονταν τρεις.";

    riddleText1.innerHTML =
  "<strong>Τι ήταν αυτό που έκανε πάντα την Κάρεν να χαμογελά;</strong>";

riddleButton1.textContent = "ΑΠΑΝΤΗΣΗ";
riddleAnswer1.placeholder = "Γράψε την απάντηση...";

//-------------------------- chapter 2 -----------------------------//

  storyTitle2.textContent = "Η ΜΕΡΑ ΠΟΥ ΕΣΒΗΣΑΝ ΟΛΑ";

storyText2.innerHTML =
  "Οι μήνες πέρασαν.<br><br>" +
  "Η μέρα που περίμεναν τόσο καιρό είχε επιτέλους φτάσει.<br><br>" +
  "Όμως ο Χένρι δεν επέστρεψε ποτέ στο σπίτι μαζί με την Κάρεν.";


  }


  if (selectedLanguage === "en") {

    document.documentElement.lang = "en";
    document.getElementById("memoryBackImage").src = "back2.png";

    introText.innerText =
      "When love becomes an obsession and you cannot see the evil that is coming, the situation begins to become very dangerous.";

    startButton.innerText =
      "THE OBSESSION BEGINS";

    storyTitle1.textContent = "BEFORE EVERYTHING";

   storyText1.innerHTML =
  "She had been smiling more lately. In a few months, there would be three of them.";

    riddleText1.innerHTML =
   "<strong>What was it that always made Karen smile?</strong>";

riddleButton1.textContent = "ANSWER";
riddleAnswer1.placeholder = "Enter your answer...";

    //-------------------------- chapter 2 -----------------------------//

    storyTitle2.textContent = "THE DAY EVERYTHING FADED";

storyText2.innerHTML =
  "The months passed.<br><br>" +
  "The day they had been waiting for so long had finally arrived.<br><br>" +
  "But Henry never returned home with Karen.";


  }

}

</script>

</body>
</html>
