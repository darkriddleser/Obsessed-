<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSESSED</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=GFS+Didot&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #eee;
}

body {
  font-family: "Noto Serif", serif;
}

.screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 80px 24px 90px;

  overflow-x: hidden;
}

.hidden {
  display: none !important;
}


/* =========================
   ΠΡΩΤΗ ΟΘΟΝΗ
========================= */

#languageScreen {
  overflow: hidden;

  background-image:
    linear-gradient(
      rgba(0,0,0,.18),
      rgba(0,0,0,.32)
    ),
    url("file_00000000a95081f4ad0a889b8883d67c.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

#languageScreen::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,.22) 60%,
      rgba(0,0,0,.75) 100%
    );

  pointer-events: none;
}

.language-content {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 430px;

  display: flex;
  flex-direction: column;
  align-items: center;

  transform: translateY(90px);
}


/* LANGUAGE BUTTONS */

.language-button {
  width: 290px;
  max-width: 90%;

  margin: 8px 0;
  padding: 17px 20px;

  background: rgba(3,3,3,.76);
  border: 1px solid rgba(130,20,20,.8);

  color: #e3dfd8;

  font-family: "Cinzel", serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 2px;

  cursor: pointer;

  backdrop-filter: blur(3px);

  transition:
    background .25s,
    border-color .25s,
    transform .15s;
}

.language-button:active {
  transform: scale(.98);
  background: rgba(80,0,0,.35);
  border-color: #b32828;
}

.flag {
  margin-right: 13px;
  font-size: 21px;
}


/* =========================
   LANGUAGE SWITCHER
========================= */

#languageSwitcher {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;
  box-sizing: border-box;

  height: 55px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 3px;

  padding: 0 18px;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.95),
    rgba(0,0,0,.70),
    transparent
  );

  pointer-events: none;
}

#languageSwitcher button {
  border: 0;
  background: transparent;

  padding: 5px 6px;

  font-size: 19px;
  cursor: pointer;

  opacity: .4;

  pointer-events: auto;
}

#languageSwitcher button.active {
  opacity: 1;
}


/* =========================
   VIDEO / INTRO
========================= */

#videoScreen {
  background:
    radial-gradient(
      circle at center,
      #140707 0%,
      #050303 45%,
      #000 100%
    );

  padding-top: 35px;
  padding-bottom: 100px;
  justify-content: flex-start;
}

.video-frame {
  position: relative;

  width: min(100%, 360px);
  aspect-ratio: 9 / 16;
  max-height: 48vh;

  background: #050505;
  border: 1px solid #351010;

  overflow: hidden;

  box-shadow:
    0 0 45px rgba(80,0,0,.18),
    inset 0 0 50px #000;

  flex-shrink: 1;
}


/* =========================
   STORY CHAPTER 01
========================= */

.story-chapter {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}

.chapter-number {
  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: #7d1b1b;
  margin-bottom: 6px;
}

.story-title {
  font-family: "Cinzel", serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 3px;
  margin: 0 0 20px;
  color: #eee9e2;
}


/* FLIP PHOTO */

.memory-photo {
  width: 100%;
  aspect-ratio: 2 / 3;
  margin-bottom: 22px;

  perspective: 1200px;
  cursor: pointer;

  background: transparent;
  border: none;
  overflow: visible;
}

.memory-card {
  position: relative;
  width: 100%;
  height: 100%;

  transition: transform .8s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.memory-card.flipped {
  transform: rotateY(180deg);
}

.memory-card-face {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.memory-card-back {
  transform: rotateY(180deg);
}

.memory-card-face img {
  width: 100%;
  height: 100%;
  object-fit: cover;

  display: block;

  user-select: none;
  -webkit-user-drag: none;
}


/* STORY TEXT */

.story-text {
  font-family: "GFS Didot", serif;
  font-size: 18px;
  line-height: 1.65;
  color: #d8d3cc;
  margin-bottom: 25px;
}


/* RIDDLE */

.riddle-box {
  width: 100%;
  padding-top: 20px;
  border-top: 1px solid #301010;
}

.riddle-text {
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 17px;
  line-height: 1.6;
  color: #c9c3bc;
  margin-bottom: 18px;
}

.riddle-input {
  width: 100%;
  box-sizing: border-box;

  padding: 13px 14px;

  background: rgba(0,0,0,.55);
  border: 1px solid #4a1818;

  color: #eee9e2;
  text-align: center;

  font-family: "GFS Didot", serif;
  font-size: 17px;

  outline: none;
}

.riddle-input:focus {
  border-color: #8b2525;
}

.riddle-button {
  margin-top: 12px;
  padding: 11px 24px;

  border: 1px solid #651c1c;
  background: transparent;

  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 2px;

  cursor: pointer;
}

.riddle-message {
  min-height: 22px;
  margin-top: 12px;

  font-family: "GFS Didot", serif;
  font-size: 15px;
}


/* =========================
   INTRO TEXT
========================= */

.placeholder {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Cinzel", serif;
  color: #5d5555;

  font-size: 12px;
  letter-spacing: 4px;
}

.quote {
  max-width: 520px;

  margin: 30px auto;

  color: #e0dcd5;

  font-family: "GFS Didot", serif;
  font-size: 19px;
  font-weight: 400;
  font-style: italic;

  line-height: 1.75;
  letter-spacing: .2px;

  text-shadow:
    0 1px 2px rgba(0,0,0,.8);
}


/* START BUTTON */

.start-button {
  width: 300px;
  max-width: 90%;

  padding: 16px;

  background: rgba(0,0,0,.5);

  color: #ddd8d0;

  border: 1px solid #651313;

  font-family: "Cinzel", serif;
  font-size: 13px;
  letter-spacing: 1.5px;

  cursor: pointer;
}

.start-button:active {
  background: rgba(90,0,0,.3);
}


/* =========================
   NAVIGATION ARROWS
========================= */

#navigationArrows {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  min-height: 65px;

  padding:
    8px
    18px
    max(12px, env(safe-area-inset-bottom));

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;

  background: linear-gradient(
    to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.65),
    transparent
  );

  pointer-events: none;
}

#navigationArrows button {
  width: 42px;
  height: 42px;

  border: none;
  background: transparent;
  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 25px;

  cursor: pointer;
  opacity: .75;
  pointer-events: auto;
}

#navigationArrows button:active {
  background: transparent;
  color: #ffffff;
  opacity: 1;
}

#navigationArrows button:disabled {
  opacity: .2;
  cursor: default;
}


/* =========================
   EVENT 01 / 02
========================= */

#storyScreen1,
#storyScreen2 {
  justify-content: flex-start;
  padding-top: 35px;
}

#storyScreen2 {
  transform: none;
}

#storyScreen2 .heart-monitor {
  margin-top: 22vh;
}

.heart-monitor {
  width: 100%;
  margin: 35px 0;
  padding: 18px 0;
  background: #020403;
  overflow: hidden;
  box-shadow: inset 0 0 30px rgba(0, 255, 100, 0.05);
}

.heart-monitor.fade-out {
  opacity: 0;
  transition: opacity 2s ease;
}

.monitor-line {
  width: 100%;
  height: 120px;
  overflow: hidden;
}

.monitor-line svg {
  width: 300%;
  height: 100%;
  animation: ecgCollapse 10s linear forwards;
}

.ecg-line {
  fill: none;
  stroke: #39ff78;
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 5px #39ff78);
}

@keyframes ecgCollapse {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-60%);
  }
}

@media (min-width: 768px) {

  .video-frame {
    width: 280px;
    max-height: 52vh;
  }

  .quote {
    max-width: 650px;
  }

  #languageScreen {
    background-size: auto 100%;
    background-position: center;
    background-color: #000;
  }
}

.hospital-document {
  opacity: 0;
  transition: opacity 3s ease;
  width: 100%;
  max-width: 390px;
  margin: 25px auto 40px;
  padding: 28px 24px;

  background:
    linear-gradient(
      rgba(255,255,255,.04),
      rgba(0,0,0,.05)
    ),
    #d8d0ba;

  color: #171512;

  text-align: left;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.55;

  border: 1px solid #8e8775;

  box-shadow:
    0 8px 30px rgba(0,0,0,.8),
    inset 0 0 35px rgba(70,55,30,.12);

  transform: rotate(-0.4deg);
}

.hospital-document.show {
  opacity: 1;
}

#hospitalName {
  text-align: center;
  font-weight: bold;
  font-size: 16px;
  letter-spacing: 1px;
}

#hospitalRecordTitle {
  text-align: center;
  font-weight: bold;
  font-size: 12px;
  margin-top: 5px;
  letter-spacing: .8px;
}

.hospital-document hr {
  border: 0;
  border-top: 1px solid rgba(30,25,20,.45);
  margin: 17px 0;
}

#hospitalTimeline {
  line-height: 1.8;
}

#hospitalMotherStatus {
  margin-top: 4px;
  font-weight: bold;
}

#incidentTimeInput {
  width: 55%;
  padding: 10px;

  background: rgba(255,255,255,.35);
  border: 1px solid #625c50;

  color: #171512;
  text-align: center;

  font-family: "Courier New", monospace;
  font-size: 16px;
}

#incidentTimeButton {
  width: 43%;
  padding: 10px 4px;

  background: #24211c;
  border: 1px solid #24211c;

  color: #ddd5c1;

  font-family: "Courier New", monospace;
  font-size: 11px;

  cursor: pointer;
}


/* =========================
   EVENT 03
========================= */

.henry-anger {
  height: 150px;
  overflow: hidden;
  margin-top: 35px;
  text-align: center;
  position: relative;
  font-size: 19px;
  line-height: 1.6;

  opacity: 1;
  transition: opacity 2s ease;
}

/* EVENT 03 - Smooth κίνηση λόγων Henry */
.henry-line {
  position: absolute;
  left: 0;
  top: 120px;
  width: 100%;

  opacity: 0;

  transition:
    top 9s linear,
    opacity 1s ease;
}

.henry-line.show {
  top: -40px;
  opacity: 1;
}

.henry-line.fade-away {
  top: 0;
  opacity: 0;
}

#storyScreen3 {
  justify-content: flex-start;
  padding-top: 35px;
}

#storyScreen3 .story-chapter {
  width: 100%;
}

#storyScreen3 .henry-anger {
  margin-top: 22vh;
}

/* EVENT 03 - ΣΚΗΝΗ ΦΩΤΙΑΣ */
.fire-scene {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 100%;

  transform: translate(-50%, -50%);
  opacity: 0;

  transition: opacity 2s ease;
}

.fire-scene.show {
  opacity: 1;
}

.fire-scene video {
  width: 100%;
  max-height: 55vh;
  object-fit: cover;
  display: block;
}

/* EVENT 03 - ΕΠΙΣΗΜΗ ΚΑΤΑΘΕΣΗ HENRY */
.henry-statement {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 40px);
  max-width: 390px;

  margin: 30px auto;
  padding: 26px 22px;

  background:
    linear-gradient(
      rgba(25, 18, 14, .18),
      rgba(0, 0, 0, .12)
    ),
    #aaa18c;

  color: #18130f;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.65;
  text-align: left;

  border: 1px solid #8e8775;

  box-shadow:
    0 12px 35px rgba(0,0,0,.95),
    inset 0 0 45px rgba(45,20,8,.28),
    inset 0 0 8px rgba(0,0,0,.35);

  opacity: 0;
  transition: opacity 3s ease;
}

.henry-statement.show {
  opacity: 1;
}

/* EVENT 03 - ΑΝΑΦΟΡΑ ΠΥΡΟΣΒΕΣΤΙΚΗΣ / ΑΣΤΥΝΟΜΙΑΣ */
.fire-report {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 40px);
  max-width: 390px;

  margin: 30px auto;
  padding: 26px 22px;

  background:
    linear-gradient(
      rgba(25, 18, 14, .20),
      rgba(0, 0, 0, .14)
    ),
    #9f9785;

  color: #17120f;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.65;
  text-align: left;

  border: 1px solid #77736a;

  box-shadow:
    0 12px 35px rgba(0,0,0,.95),
    inset 0 0 45px rgba(45,20,8,.30),
    inset 0 0 8px rgba(0,0,0,.38);

  opacity: 0;

  transition: opacity 1.5s ease;
}

.fire-report.show {
  opacity: 1;
}

/* EVENT 03 - ΚΡΥΜΜΕΝΟ ΣΤΟΙΧΕΙΟ */
.hidden-evidence {
  position: absolute;
  top: 50%;
  left: 50%;

  width: calc(100% - 30px);
  max-width: 420px;
  aspect-ratio: 3 / 4;

  transform: translate(-50%, -50%);

  background: #020202;

  overflow: hidden;

  opacity: 0;
  transition: opacity 2s ease;

  box-shadow: 0 10px 40px rgba(0,0,0,.95);
  touch-action: none;
}

.hidden-evidence.show {
  opacity: 1;
}

.hidden-evidence img {
  filter: brightness(1.35) contrast(1.05);
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;

  user-select: none;
  -webkit-user-drag: none;
}

.evidence-darkness {
  position: absolute;
  inset: 0;

  background: rgba(0, 0, 0, 0.97);

  -webkit-mask-image: radial-gradient(
    circle 65px at var(--x, 100%) var(--y, 100%),
    transparent 0,
    transparent 45px,
    black 75px
  );

  mask-image: radial-gradient(
    circle 65px at var(--x, 100%) var(--y, 100%),
    transparent 0,
    transparent 45px,
    black 75px
  );

  pointer-events: none;
  z-index: 2;
  transition: opacity 2s ease;
}

.evidence-darkness.found {
  opacity: 0;
}


/* =========================
   EVENT 04 - ΗΜΕΡΟΛΟΓΙΟ
========================= */

#storyScreen4 {
  justify-content: flex-start;
  padding-top: 35px;

  background:
    radial-gradient(
      circle at 50% 38%,
      #140b07 0%,
      #060403 45%,
      #000 100%
    );
}

.calendar-scene {
  position: relative;
  z-index: 2;

  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 6vh;

  transition: opacity 1.5s ease;
}

.calendar-scene.fade-out {
  opacity: 0;
}

.old-calendar {
  position: relative;

  width: 230px;
  height: 290px;

  display: flex;
  flex-direction: column;

  background: #c9bea4;
  color: #1c1712;

  font-family: "Courier New", monospace;

  /* Κρεμασμένο στον τοίχο, ελαφρώς στραβό */
  transform: rotate(-1.2deg);

  /* Πάχος στοίβας σελίδων + σκιά */
  box-shadow:
    0 2px 0 #b4a98f,
    0 4px 0 #a69b81,
    0 6px 0 #978c73,
    0 7px 0 #6e6553,
    0 20px 45px rgba(0,0,0,.95);

  transition:
    filter 1.8s ease,
    transform 2.2s ease;
}

/* Γέρνει και κρεμάει στις πένθιμες μέρες */
.old-calendar.grieving {
  transform: rotate(-3.5deg) translateY(8px);
}

/* Μεταλλικοί κρίκοι */
.old-calendar::before,
.old-calendar::after {
  content: "";
  position: absolute;
  top: -10px;
  z-index: 5;

  width: 9px;
  height: 22px;

  border: 3px solid #77726a;
  border-radius: 6px;

  box-shadow:
    inset 0 0 2px rgba(0,0,0,.7),
    0 2px 3px rgba(0,0,0,.8);
}

.old-calendar::before { left: 27%; }
.old-calendar::after  { right: 27%; }

.calendar-top {
  flex-shrink: 0;

  padding: 17px 10px 11px;

  background: linear-gradient(#30241d, #1b1410);
  color: #b7aa91;

  font-family: "Cinzel", serif;
  font-size: 11px;
  letter-spacing: 4px;

  box-shadow: 0 2px 4px rgba(0,0,0,.45);
  position: relative;
  z-index: 4;
}

/* Στοίβα σελίδων */
.calendar-pages {
  position: relative;
  flex: 1;
}

.calendar-page,
.calendar-stub {
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at 25% 15%,
      rgba(255,248,230,.28),
      transparent 60%
    ),
    linear-gradient(
      rgba(70,45,25,.05),
      rgba(40,22,10,.24)
    ),
    #cbbfa3;
}

.calendar-page {
  display: flex;
  flex-direction: column;
  align-items: center;

  box-shadow: inset 0 0 28px rgba(60,35,15,.28);
}

.calendar-month {
  margin-top: 20px;
  font-size: 15px;
  letter-spacing: 4px;
}

.calendar-day {
  margin-top: 4px;

  font-family: "GFS Didot", serif;
  font-size: 96px;
  line-height: 1;
}

.calendar-weekday {
  margin-top: 4px;

  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 16px;
}

.calendar-year {
  margin-top: 12px;

  font-size: 13px;
  letter-spacing: 6px;
  opacity: .75;
}

/* Κυριακές με κόκκινο */
.calendar-page.sunday .calendar-day,
.calendar-page.sunday .calendar-weekday {
  color: #8b1d1d;
}

/* Υπόλειμμα χαρτιού στην κορυφή */
.calendar-stub {
  z-index: 2;
  pointer-events: none;
  filter: brightness(.86);
  clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
}

/* Η σελίδα που σκίζεται και πέφτει */
.torn-sheet {
  z-index: 3;
  transform-origin: top left;
  will-change: transform, clip-path, opacity;
  filter: brightness(1.03);
}

/* Κόκκινος κύκλος στην ημερομηνία */
.calendar-mark {
  position: absolute;
  left: 50%;
  top: 30px;
  width: 150px;
  height: 120px;
  transform: translateX(-50%) rotate(-5deg);
  z-index: 4;
  pointer-events: none;
  overflow: visible;
  opacity: 0;
}

.calendar-mark path {
  fill: none;
  stroke: #8b1414;
  stroke-width: 3.5;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
}

.calendar-mark.draw {
  opacity: .9;
}

.calendar-mark.draw path {
  animation: drawMark 1.6s ease-out forwards;
}

@keyframes drawMark {
  to { stroke-dashoffset: 0; }
}

/* Μαρασμός: λεκέδες υγρασίας + σκοτάδι στις άκρες */
.calendar-wither {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;

  background:
    radial-gradient(ellipse at 28% 72%, rgba(70,40,15,.5), transparent 35%),
    radial-gradient(ellipse at 76% 30%, rgba(60,35,12,.4), transparent 30%),
    radial-gradient(ellipse at 60% 90%, rgba(50,30,10,.35), transparent 25%),
    radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.8) 100%);

  opacity: 0;
  transition: opacity 1.8s ease;
}

/* Ο κόσμος γύρω σκοτεινιάζει */
#storyScreen4::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;

  min-height: 380px;

.desk-item {
  position: absolute;

}

  transform: rotate(4deg);
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: sepia(.4) brightness(.85);
}

/* Εφημερίδα (μικρή) */

  top: 10%;

  color: #1a1510;

  font-family: "Times New Roman", serif;
  transform: rotate(-6deg);
}

.clip-masthead {
  font-size: 9px;
  letter-spacing: 2px;

  padding-bottom: 4px;
}

.clip-headline {
  margin-top: 6px;
  font-weight: bold;
  font-size: 13px;
  line-height: 1.2;
}

.clip-lines {
  margin-top: 8px;
  height: 46px;
  background: repeating-linear-gradient(
    to bottom,
    rgba(26,21,16,.4) 0 2px,
    transparent 2px 7px

}

/* Ξερά τριαντάφυλλα */
.dead-roses {
  left: 10%;
  top: 52%;
  font-size: 44px;
  box-shadow: none;
  filter: grayscale(.6) sepia(.5) brightness(.7);
  transform: rotate(-25deg);
}

/* Φυλλάδιο (μικρό) */
.medium-flyer {
  right: 8%;
  top: 40%;
  width: 36%;
  aspect-ratio: 2 / 3;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #3b1414, #150606);
  border: 1px solid #6b5426;
  color: #d8c48f;
  font-family: "Cinzel", serif;
  transform: rotate(7deg);
}

.flyer-symbol { font-size: 28px; }
.flyer-title  { margin-top: 8px; font-size: 8px; letter-spacing: 1.5px; }
.flyer-name   { margin-top: 8px; font-size: 9px; letter-spacing: 1px; }

/* Φάκελοι */
.envelopes {
  left: 7%;
  bottom: 6%;
  width: 42%;
  height: 52px;
  box-shadow: none;
}

.envelopes span {
  position: absolute;
  inset: 0;
  background: #cfc5ad;
  border: 1px solid #9c917a;
  box-shadow: 0 4px 10px rgba(0,0,0,.6);
}

.envelopes span:nth-child(1) { transform: rotate(-8deg) translate(-6px, 4px); }
.envelopes span:nth-child(2) { transform: rotate(5deg) translate(4px, -3px); }
.envelopes span:nth-child(3) {
  transform: rotate(-2deg);
  background:
    linear-gradient(35deg, transparent 49%, rgba(0,0,0,.2) 50%, transparent 51%),
    linear-gradient(-35deg, transparent 49%, rgba(0,0,0,.2) 50%, transparent 51%),
    #d8cfb8;
}

/* Λεκές από ποτήρι */
.glass-stain {
  position: absolute;
  right: 30%;
  bottom: 5%;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 3px solid rgba(120,70,25,.35);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* Hint κάτω από το γραφείο */
.desk-hint {
  min-height: 52px;
  margin-top: 14px;
  padding: 0 10px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.55;
  color: rgba(230,215,190,.55);
  transition: color .6s ease;
}

.desk-hint.grief-active { color: rgba(240,228,205,.92); }

/* Μεγεθυμένη προβολή */
.desk-viewer {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0,0,0,.88);
  opacity: 0;
  transition: opacity .6s ease;
}

.desk-viewer.show { opacity: 1; }

.desk-viewer-content {
  width: 100%;
  max-width: 370px;
}

.viewer-tip {
  margin-top: 16px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 14px;
  color: rgba(230,215,190,.55);
}

.viewer-newspaper {
  padding: 22px 20px;
  background: #dcd6c4;
  color: #16120d;
  text-align: left;
  font-family: "Times New Roman", serif;
  transform: rotate(-1deg);
  box-shadow:
    0 12px 40px rgba(0,0,0,.9),
    inset 0 0 40px rgba(90,70,40,.18);
}

.viewer-newspaper .masthead {
  text-align: center;
  font-family: "Cinzel", serif;
  font-size: 15px;
  letter-spacing: 3px;
  border-bottom: 2px solid #16120d;
  padding-bottom: 6px;
}

.viewer-newspaper .dateline {
  text-align: center;
  font-size: 10px;
  letter-spacing: 1px;
  margin: 5px 0 12px;
}

.viewer-newspaper h3 {
  margin: 0 0 10px;
  font-size: 19px;
  line-height: 1.2;
}

.viewer-newspaper p {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
}

.henry-circle {
  position: relative;
  white-space: nowrap;
}

.henry-circle::after {
  content: "";
  position: absolute;
  inset: -5px -8px;
  border: 2px solid rgba(140,20,20,.85);
  border-radius: 50%;
  transform: rotate(-3deg);
}

/* Φυλλάδιο (μεγάλο, γυρίζει) */
.flyer-card {
  width: min(100%, 46vh);
  aspect-ratio: 2 / 3;
  margin: 0 auto;
  perspective: 1200px;
  cursor: pointer;
}

.flyer-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .8s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.flyer-inner.flipped { transform: rotateY(180deg); }

.flyer-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 26px 22px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
}

.flyer-front {
  background: radial-gradient(circle at 50% 30%, #3d1515, #140505 75%);
  border: 1px solid #6b5426;
  color: #d9c48c;
  font-family: "Cinzel", serif;
  text-align: center;
}

.f-title   { font-size: 14px; letter-spacing: 3px; }
.f-symbol  { font-size: 46px; margin: 16px 0; }
.f-name    { font-size: 17px; letter-spacing: 1px; }
.f-quote   { margin: 16px 0; font-family: "GFS Didot", serif; font-style: italic; font-size: 15px; color: #e8dcc0; }
.f-details { font-size: 11px; letter-spacing: 1.5px; line-height: 1.9; }

.flyer-back {
  transform: rotateY(180deg);
  align-items: flex-start;
  background: #d6cdb6;
  color: #1d2233;
  text-align: left;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 16px;
  line-height: 1.55;
}

.smudge {
  color: transparent;
  background: rgba(29,34,51,.55);
  filter: blur(2px);
  border-radius: 3px;
}

.desk-riddle {
  margin-top: 22px;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.desk-riddle.show { opacity: 1; }

.henry-hope {
  min-height: 30px;
  margin-top: 22px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 21px;
  color: #e6ddcf;
  opacity: 0;
  transition: opacity 3s ease;
}

.henry-hope.show { opacity: 1; }


/* Σύμβολο που αντέγραψε ο Henry στο πίσω μέρος */
.flyer-symbol-copy {
  width: 72px;
  height: 72px;
  margin: 10px auto 0;
  color: #1d2233;
}

.vodou-symbol {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}


/* =========================
   EVENT 04 - ΓΡΑΦΕΙΟ: ΦΑΣΗ VODOU
========================= */

/* Τα αντικείμενα του πένθους σβήνουν */
.grief-obj {
  transition: opacity 2s ease, filter .5s ease;
}

.desk-scene.vodou-phase .grief-obj {
  opacity: 0;
  pointer-events: none;
}

/* Τα αντικείμενα του Vodou εμφανίζονται */
.vodou-obj {
  opacity: 0;
  pointer-events: none;
  transition: opacity 2.5s ease 1.2s, filter .5s ease;
}

.desk-scene.vodou-phase .vodou-obj {
  opacity: 1;
  pointer-events: auto;
}

/* Το φως της λάμπας γίνεται κόκκινο */
.desk-scene::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    ellipse at 50% 55%,
    rgba(140,20,10,.28),
    rgba(40,0,0,.38) 70%
  );
  opacity: 0;
  transition: opacity 3s ease;
}

.desk-scene.vodou-phase::after { opacity: 1; }

/* Σύμβολο με κιμωλία πάνω στο ξύλο */
.chalk-veve {
  left: 6%;
  top: 44%;
  width: 34%;
  aspect-ratio: 1;
  box-shadow: none;
  color: rgba(235,228,210,.55);
  transform: rotate(-8deg);
}

.chalk-veve .vodou-symbol {
  stroke-width: 3;
  stroke-dasharray: 7 3;
}

/* Μαύρο κερί */
.candle {
  left: 46%;
  bottom: 8%;
  width: 22px;
  height: 58px;
  border-radius: 3px 3px 2px 2px;
  background: linear-gradient(90deg, #0c0a0a, #2a2222 45%, #0c0a0a);
  box-shadow: 0 6px 12px rgba(0,0,0,.7);
}

.candle::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -22px;
  width: 12px;
  height: 22px;
  margin-left: -6px;
  border-radius: 50% 50% 45% 45%;
  background: radial-gradient(
    ellipse at 50% 70%,
    #fff4c8 0%,
    #ffb347 40%,
    rgba(255,90,20,.6) 70%,
    transparent 75%
  );
  box-shadow: 0 0 18px 6px rgba(255,150,60,.35);
  transform-origin: 50% 100%;
  animation: candleFlicker 1.8s infinite alternate ease-in-out;
}

@keyframes candleFlicker {
  0%   { transform: scale(1) rotate(-2deg); opacity: .95; }
  50%  { transform: scale(1.08, .94) rotate(2deg); opacity: 1; }
  100% { transform: scale(.94, 1.06) rotate(-1deg); opacity: .85; }
}

@media (prefers-reduced-motion: reduce) {
  .candle::before { animation: none; }
}

/* Μπουκάλι ρούμι */
.rum-bottle {
  right: 5%;
  bottom: 4%;
  width: 34px;
  height: 78px;
  border-radius: 8px 8px 5px 5px;
  background: linear-gradient(90deg, #2a1204, #6b3410 40%, #3a1a06);
  box-shadow: 0 8px 14px rgba(0,0,0,.7);
}

.rum-bottle::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -20px;
  width: 12px;
  height: 22px;
  margin-left: -6px;
  border-radius: 3px 3px 0 0;
  background: linear-gradient(90deg, #2a1204, #5a2c0d, #2a1204);
}

.rum-bottle::after {
  content: "";
  position: absolute;
  left: 4px;
  right: 4px;
  top: 26px;
  height: 26px;
  background: #d8cba8;
}

/* Κάρτα του Βαρόνου (μικρή) */

  top: 28%;

========================= */

}

}

  position: relative;

  color: #1d2233;

    linear-gradient(to right,
      transparent 32px,
      rgba(170,40,40,.45) 32px 34px,
      transparent 34px),
    repeating-linear-gradient(to bottom,
      transparent 0 27px,
      rgba(60,90,140,.22) 27px 28px),
    #e2dac6;
  box-shadow:
    0 12px 35px rgba(0,0,0,.9),
    inset 0 0 40px rgba(90,70,40,.22);

}

.notebook-title {

}

.research-entry {

}

  position: relative;

}

.entry-note {

}

/* Διαγραφή με μελάνι */
.entry-name::after {
  content: "";
  position: absolute;
  left: -4px;
  top: 55%;
  width: 0;
  height: 2px;
  background: #1d2233;
  transform: rotate(-1.5deg);
  transition: width .6s ease;
}

.research-entry.struck .entry-name::after { width: calc(100% + 8px); }
.research-entry.struck { opacity: .6; }

/* Κόκκινος κύκλος στο σωστό */
.entry-name::before {
  content: "";
  position: absolute;
  inset: -6px -12px;
  border: 2px solid rgba(140,20,20,.85);
  border-radius: 50%;
  opacity: 0;
  transform: rotate(-2deg) scale(.6);
  transition: opacity .8s ease, transform .8s ease;
}

.research-entry.circled .entry-name::before {
  opacity: 1;
  transform: rotate(-2deg) scale(1);
}

.research-question {

  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 17px;
  color: #c9c3bc;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.research-question.show { opacity: 1; }
</style>

function enterExperience(language) {

    audio.muted = true;

    const playPromise = audio.play();

    if (playPromise !== undefined) {
      playPromise.then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
      }).catch(() => {
        audio.muted = false;
      });
    }
  });

  document
    .getElementById("languageScreen")
    .classList.add("hidden");

  document
    .getElementById("videoScreen")
    .classList.remove("hidden");

    .getElementById("navigationArrows")
    .classList.remove("hidden");

// ΕΛΕΓΧΟΣ ACTIVE EVENT / TIMERS
// ==========================================

let eventTimers = [];
let eventIntervals = [];

function eventTimeout(callback, delay) {

  const timer = setTimeout(callback, delay);

  eventTimers.push(timer);

  return timer;
}

function eventInterval(callback, delay) {

  const interval = setInterval(callback, delay);

  eventIntervals.push(interval);

  return interval;
}

function clearEventTimers() {

  eventTimers.forEach(timer => clearTimeout(timer));
  eventIntervals.forEach(interval => clearInterval(interval));

  eventTimers = [];
  eventIntervals = [];
}


// RESET ΟΛΩΝ ΤΩΝ ΗΧΩΝ ΚΑΙ VIDEO
function resetMedia() {

  document.querySelectorAll("audio, video").forEach(media => {

    media.pause();

    try {
      media.currentTime = 0;
    } catch (e) {}

    if (media.tagName === "AUDIO") {
      media.volume = 1;
    }

  });

}

function checkRiddle1() {

  const input = document.getElementById("riddleAnswer1");
  const message = document.getElementById("riddleMessage1");

  const answer = input.value
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "")
    .toLowerCase();

  if (
    answer === "κοκκινοτριανταφυλλο" ||
    answer === "κοκκινατριανταφυλλα" ||
    answer === "redrose" ||
    answer === "redroses"
  ) {
    input.style.borderColor = "#2f7d45";
    message.style.color = "#5fa873";

    message.textContent =
      selectedLanguage === "gr"
        ? "Σωστά."
        : "Correct.";

    eventTimeout(() => {
      nextEvent();
    }, 1200);

  } else {

    input.style.borderColor = "#9b1c1c";
    message.style.color = "#b83232";

    message.textContent =
      selectedLanguage === "gr"
        ? "Λάθος απάντηση."

function playHenryAnger() {

  const container = document.getElementById("storyText3");

  const lines = selectedLanguage === "gr"
    ? [
        "Τη σκότωσες.",
        "Αν δεν υπήρχες εσύ, θα ήταν ακόμα εδώ.",
        "Μου την πήρες.",
        "Εσύ έπρεπε να είχες πεθάνει.",
        "Όχι εκείνη.",
        "Έπρεπε να είσαι εσύ. Θα το διορθώσω."
      ]
    : [
        "You killed her.",
        "If it weren't for you, she would still be here.",
        "You took her from me.",
        "You should have died.",
        "Not her.",
        "It should have been you. I'll fix it."
      ];

  container.innerHTML = "";

  lines.forEach((line, index) => {

    eventTimeout(() => {

      // Αν φύγαμε από το EVENT 03, σταματά εδώ
      if (document.getElementById("storyScreen3").classList.contains("hidden")) {
        return;
      }

      const newLine = document.createElement("div");

      newLine.className = "henry-line";
      newLine.textContent = line;

      container.appendChild(newLine);

      eventTimeout(() => {

        newLine.classList.add("show");

        eventTimeout(() => {
          newLine.style.opacity = "0";

          eventTimeout(() => {
            newLine.remove();
          }, 1000);

        }, 8000);

      }, 50);

    }, index * 3000);

  });

  // Μετά τα λόγια του Henry ξεκινά η φωτιά
  eventTimeout(() => {

    const screen3 = document.getElementById("storyScreen3");

    if (screen3.classList.contains("hidden")) {
      return;
    }

    // Σβήνουν ομαλά τα λόγια του Henry
    container.style.opacity = "0";

    eventTimeout(() => {

      if (screen3.classList.contains("hidden")) {
        return;
      }

      const fireScene = document.getElementById("fireScene");
      const fireVideo = document.getElementById("fireVideo");
      const fireAudio = document.getElementById("fireAudio");

      fireScene.classList.remove("hidden");

      eventTimeout(() => {
        fireScene.classList.add("show");
      }, 50);

      fireVideo.currentTime = 0;
      fireVideo.play();

      fireAudio.currentTime = 0;
      fireAudio.volume = 1;
      fireAudio.play();

    }, 1500);

  }, 24000);

  // Μετά τη φωτιά εμφανίζεται η κατάθεση του Henry
  eventTimeout(() => {

    const screen3 = document.getElementById("storyScreen3");

    if (screen3.classList.contains("hidden")) {
      return;
    }

    const fireScene = document.getElementById("fireScene");
    const fireVideo = document.getElementById("fireVideo");
    const fireAudio = document.getElementById("fireAudio");
    const statement = document.getElementById("henryStatement");

    // Σβήνει η φωτιά
    fireScene.classList.remove("show");

    // Σταματούν video και ήχος
    fireVideo.pause();
    fireAudio.pause();

    eventTimeout(() => {

      if (screen3.classList.contains("hidden")) {
        return;
      }

      fireScene.classList.add("hidden");

      statement.classList.remove("hidden");

      eventTimeout(() => {
        statement.classList.add("show");
      }, 50);

    }, 2000);

  }, 38000);

}

// Τυχαία σκισμένη άκρη - διαφορετική σε κάθε σελίδα
function makeTornEdge() {
  const count = 16;
  const points = [];
  for (let i = 0; i < count; i++) {
    points.push({
      x: (i / (count - 1)) * 100,
      y: 2 + Math.random() * 6        // 2%–8% από την κορυφή
    });
  }
  return points;
}

function tearOffSheet(nextDate) {

  const page = document.getElementById("calendarPage");
  const stub = document.getElementById("calendarStub");

  // 1. Αντίγραφο της τρέχουσας σελίδας -> αυτό θα σκιστεί
  const sheet = page.cloneNode(true);
  sheet.removeAttribute("id");
  sheet.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
  sheet.classList.add("torn-sheet");
  page.parentElement.appendChild(sheet);

  // 2. Από κάτω εμφανίζεται ήδη η επόμενη μέρα
  setCalendarDate(nextDate);

  // 3. Σχήματα σκισίματος
  const edge = makeTornEdge();
  const poly = pts =>
    `polygon(${pts.map(p => `${p.x}% ${p.y}%`).join(", ")}, 100% 100%, 0% 100%)`;

  const intact  = poly(edge.map(p => ({ x: p.x, y: 0 })));
  const halfway = poly(edge.map(p => ({ x: p.x, y: p.x > 55 ? p.y : 0 }))); // σκίζεται από δεξιά
  const torn    = poly(edge);

  const drift = -20 + Math.random() * 40;
  const spin  = 6 + Math.random() * 10;

  const anim = sheet.animate([
    { offset: 0,   clipPath: intact,  transform: "translate(0,0) rotate(0deg)",   opacity: 1 },
    { offset: 0.2, clipPath: halfway, transform: "translate(0,2px) rotate(1.5deg)", opacity: 1 },
    { offset: 0.4, clipPath: torn,    transform: "translate(0,6px) rotate(3deg)",   opacity: 1 },
    { offset: 1,   clipPath: torn,    transform: `translate(${drift}px,190px) rotate(${spin}deg)`, opacity: 0 }
  ], { duration: 700, easing: "ease-in", fill: "forwards" });

  // 4. Τη στιγμή που αποκολλάται, μένει το σκισμένο κομμάτι πάνω
  eventTimeout(() => {
    stub.style.clipPath =
      `polygon(0% 0%, 100% 0%, ${[...edge].reverse().map(p => `${p.x}% ${p.y}%`).join(", ")})`;
  }, 280);

  anim.onfinish = () => sheet.remove();
}

  const wither = document.getElementById("calendarWither");

  // Φθορά από τον χρόνο + από τα πένθιμα γεγονότα
  let brightness = 1 - progress * 0.25 - griefLoss * 0.5;
  let saturation = 1 - progress * 0.5 - griefLoss;
  let sepia = Math.min(0.3, griefLoss);
  let witherOpacity = griefLoss * 1.5;

  // Τη στιγμή του πένθους: μαρασμός
  if (grieving) {
    brightness -= 0.3;
    saturation -= 0.45;
    sepia = 0.4;
    witherOpacity = 1;
  }

  calendar.style.filter =
    `brightness(${Math.max(0.3, brightness)}) ` +
    `saturate(${Math.max(0, saturation)}) ` +
    `sepia(${sepia})`;

  wither.style.opacity = Math.min(1, witherOpacity);

  calendar.classList.toggle("grieving", grieving);
  document.getElementById("storyScreen4").classList.toggle("mourning", grieving);
}

function startEvent4Calendar() {

  const current = new Date(CALENDAR_START);
  const totalDays = Math.round((CALENDAR_END - CALENDAR_START) / 86400000);
  let delay = 900;

  // Καθαρή εκκίνηση
  document.querySelectorAll(".torn-sheet").forEach(s => s.remove());
  document.getElementById("calendarStub").style.clipPath = "";
  document.getElementById("calendarMark").classList.remove("draw");
  document.getElementById("griefLine").classList.remove("show");
  griefLoss = 0;
  applyCalendarLife(0, false);
  resetDeskScene();
  resetResearchScene();
  setCalendarDate(current);

  function tick() {

    if (document.getElementById("storyScreen4").classList.contains("hidden")) return;

    const remaining = Math.round((CALENDAR_END - current) / 86400000);

    if (remaining <= 0) {
      onCalendarFinished();
      return;
    }

    let step = 1;

    if (remaining <= 10) {
      delay = Math.min(delay * 1.3, 1200);   // φρενάρει στις τελευταίες μέρες
    } else {
      delay = Math.max(delay * 0.88, 90);    // επιταχύνει
      if (delay <= 100) step = 4;            // στη μέγιστη ταχύτητα, 4 μέρες τη φορά
    }

    step = Math.min(step, remaining);

    // Να μην προσπεράσει ποτέ πένθιμη μέρα
    const nextMoment = calendarMoments.find(m => m.date > current);
    if (nextMoment) {
      const toMoment = Math.round((nextMoment.date - current) / 86400000);
      step = Math.min(step, toMoment);
    }

    current.setDate(current.getDate() + step);
    tearOffSheet(current);

    // Πόσος χρόνος έχει περάσει (0 → 1)
    const progress =
      1 - Math.round((CALENDAR_END - current) / 86400000) / totalDays;

    const moment = calendarMoments.find(m => sameDay(m.date, current));

    // ===== ΠΕΝΘΙΜΗ ΜΕΡΑ =====
    if (moment) {

      // Το ημερολόγιο μαραζώνει, ο κόσμος σκοτεινιάζει
      applyCalendarLife(progress, true);

      eventTimeout(() => {
        showGriefLine(selectedLanguage === "gr" ? moment.gr : moment.en, 4200);
      }, 900);

      // Συνέρχεται λίγο, αλλά κρατά μόνιμη φθορά
      eventTimeout(() => {
        griefLoss += 0.06;
        applyCalendarLife(progress, false);
      }, 5400);

      delay = 400;
      eventTimeout(tick, 6800);
      return;
    }

    // ===== ΚΑΝΟΝΙΚΗ ΜΕΡΑ =====
    applyCalendarLife(progress, false);

    eventTimeout(tick, delay);
  }

  eventTimeout(tick, 1200); // μικρή παύση πριν αρχίσει
}

function onCalendarFinished() {

  // Στιγμή σιωπής και μετά ο κόκκινος κύκλος
  eventTimeout(() => {
    document.getElementById("calendarMark").classList.add("draw");
  }, 1200);

  eventTimeout(() => {
    showGriefLine(
      selectedLanguage === "gr"
        ? "Εκείνο το πρωί, κάτι άλλαξε."

    );
  }, 3200);

  eventTimeout(showDeskScene, 7800);
}

          document.getElementById("entry-" + p.id).classList.add("struck");
        }
      });

      eventTimeout(onResearch1Solved, 4500);

    } else {

      entry.classList.add("struck");
      message.style.color = "#b83232";
      message.textContent = t.wrong;
    }
  }
}

// EVENT 03 - ΦΑΚΟΣ / ΚΡΥΜΜΕΝΟ ΣΤΟΙΧΕΙΟ
// =========================================

let evidenceFound = false;
let hotspotTimer = null;

// Η περιοχή όπου βρίσκεται ο Henry με το μωρό
function isOnHotspot(xPercent, yPercent) {
  return (
    xPercent > 42 && xPercent < 58 &&
    yPercent > 28 && yPercent < 48
  );
}

// Ακυρώνει τη μέτρηση αν ο φακός φύγει από το σημείο
function cancelHotspotTimer() {
  if (hotspotTimer) {
    clearTimeout(hotspotTimer);
    hotspotTimer = null;
  }
}

function moveEvidenceLight(event) {

  const evidence = document.getElementById("hiddenEvidence");
  const darkness = document.getElementById("evidenceDarkness");

  const rect = evidence.getBoundingClientRect();

  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

  const xPercent = (x / rect.width) * 100;
  const yPercent = (y / rect.height) * 100;

  // Ο φακός ακολουθεί το δάχτυλο
  darkness.style.setProperty("--x", x + "px");
  darkness.style.setProperty("--y", y + "px");

  if (evidenceFound) return;

  if (isOnHotspot(xPercent, yPercent)) {

    // Ξεκινά η μέτρηση μόνο αν δεν τρέχει ήδη
    if (!hotspotTimer) {

      hotspotTimer = eventTimeout(() => {

        hotspotTimer = null;
        evidenceFound = true;

        // Φωτίζεται ολόκληρη η φωτογραφία
        darkness.classList.add("found");

        // Μένει ορατή 5 δευτερόλεπτα και πάμε στο Event 04
        eventTimeout(() => {
          goToEvent4();
        }, 5000);

      }, 3000);
    }

  } else {
    // Έφυγε από το σημείο πριν περάσουν τα 3 δευτερόλεπτα
    cancelHotspotTimer();
  }
}

const hiddenEvidenceEl = document.getElementById("hiddenEvidence");

hiddenEvidenceEl.addEventListener("pointerdown", moveEvidenceLight);
hiddenEvidenceEl.addEventListener("pointermove", moveEvidenceLight);

// Αν σηκώσει το δάχτυλο ή βγει από τη φωτογραφία, η μέτρηση μηδενίζει
hiddenEvidenceEl.addEventListener("pointerup", cancelHotspotTimer);
hiddenEvidenceEl.addEventListener("pointerleave", cancelHotspotTimer);
hiddenEvidenceEl.addEventListener("pointercancel", cancelHotspotTimer);

function nextEvent() {

  const monitor = document.getElementById("heartMonitor");
  const hospitalDocument = document.getElementById("hospitalDocument");

  monitor.classList.remove("hidden", "fade-out");
  hospitalDocument.classList.remove("show");
  hospitalDocument.classList.add("hidden");

  document
    .getElementById("storyScreen1")
    .classList.add("hidden");

  document
    .getElementById("storyScreen2")
    .classList.remove("hidden");

  updateLanguage();

  // Λίγο μετά το τέλος του ECG, το monitor χάνεται στο σκοτάδι
  eventTimeout(() => {

    const monitor = document.getElementById("heartMonitor");

    if (monitor) {
      monitor.classList.add("fade-out");

      eventTimeout(() => {
        monitor.classList.add("hidden");
      }, 2000);
    }

  }, 10000);

  // Μετά το σκοτάδι ακούγεται το κλάμα του νεογέννητου
  eventTimeout(() => {

    const babyCry = document.getElementById("babyCry");

    if (babyCry) {
      babyCry.currentTime = 0;
      babyCry.loop = false;
      babyCry.volume = 1;
      babyCry.play().catch(error => {
        console.log("Baby cry error:", error);
      });

      eventTimeout(() => {

        const fadeOut = eventInterval(() => {

          if (babyCry.volume > 0.05) {
            babyCry.volume = Math.max(0, babyCry.volume - 0.05);
          } else {
            clearInterval(fadeOut);
            babyCry.pause();
            babyCry.currentTime = 0;
            babyCry.volume = 1;
          }

        }, 100);

      }, 13000);
    }

  }, 6000);

  // Μετά το κλάμα εμφανίζεται το νοσοκομειακό έγγραφο
  eventTimeout(() => {

    const hospitalDocument =
      document.getElementById("hospitalDocument");

    if (hospitalDocument) {
      hospitalDocument.classList.remove("hidden");

      eventTimeout(() => {
        hospitalDocument.classList.add("show");
      }, 50);
    }

  }, 12500);
}


function checkIncidentTime() {

  const input = document.getElementById("incidentTimeInput");
  const message = document.getElementById("incidentTimeMessage");

  const answer = input.value.trim();

  if (answer === "02:21") {

    const babyCry = document.getElementById("babyCry");

    if (babyCry) {
      babyCry.pause();
      babyCry.currentTime = 0;
      babyCry.volume = 1;
    }

    const motherStatus = document.getElementById("hospitalMotherStatus");

    motherStatus.textContent =
      selectedLanguage === "gr"
        ? "ΚΑΤΑΣΤΑΣΗ ΜΗΤΕΡΑΣ: ΑΠΕΒΙΩΣΕ"
        : "MOTHER STATUS: DECEASED";

    input.style.borderColor = "#2f7d45";

    message.style.color = "#2f7d45";
    message.textContent =
      selectedLanguage === "gr"
        ? "Σωστά."
        : "Correct.";

    eventTimeout(() => {

      document
        .getElementById("storyScreen2")
        .classList.add("hidden");

      document
        .getElementById("storyScreen3")
        .classList.remove("hidden");

      resetEvent3();
      playHenryAnger();

    }, 2000);

  } else {

    input.style.borderColor = "#9b1c1c";

    message.style.color = "#9b1c1c";
    message.textContent =
      selectedLanguage === "gr"
        ? "Λάθος ώρα."
        : "Wrong time.";
  }
}
