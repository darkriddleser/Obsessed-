<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSESSED</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=GFS+Didot&family=Manrope:wght@400;500;700;800&family=Caveat:wght@500&family=Homemade+Apple&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #eee;
}

body {
  font-family: "Noto Serif", serif;
}

.screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 80px 24px 90px;

  overflow-x: hidden;
}

.hidden {
  display: none !important;
}


/* =========================
   ΠΡΩΤΗ ΟΘΟΝΗ
========================= */

#languageScreen {
  overflow: hidden;
  background: #000;
}

/* Θολό φόντο για τα πλαϊνά σε μεγάλες οθόνες */
#languageScreen::before {
  content: "";
  position: absolute;
  inset: -80px;
  background: url("start.png") center / cover no-repeat, url("start.jpg") center / cover no-repeat;
  filter: blur(30px) brightness(.28);
  pointer-events: none;
}

#languageScreen::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;

  background:
    radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(0,0,0,.35) 80%,
      rgba(0,0,0,.7) 100%
    );

  pointer-events: none;
}

.language-content {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 430px;

  display: flex;
  flex-direction: column;
  align-items: center;

  transform: translateY(90px);
}


/* LANGUAGE BUTTONS */

.language-button {
  width: 290px;
  max-width: 90%;

  margin: 8px 0;
  padding: 17px 20px;

  background: rgba(3,3,3,.76);
  border: 1px solid rgba(130,20,20,.8);

  color: #e3dfd8;

  font-family: "Cinzel", serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 2px;

  cursor: pointer;

  backdrop-filter: blur(3px);

  transition:
    background .25s,
    border-color .25s,
    transform .15s;
}

.language-button:active {
  transform: scale(.98);
  background: rgba(80,0,0,.35);
  border-color: #b32828;
}

.flag {
  display: inline-block;
  width: 21px;
  height: 14px;
  margin-right: 12px;
  vertical-align: -2px;
  border-radius: 2px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.12),
    0 1px 3px rgba(0,0,0,.8);
  opacity: .9;
}

.flag svg {
  display: block;
  width: 100%;
  height: 100%;
}


/* =========================
   LANGUAGE SWITCHER
========================= */

#languageSwitcher {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;
  box-sizing: border-box;

  height: 55px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 3px;

  padding: 0 18px;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.95),
    rgba(0,0,0,.70),
    transparent
  );

  pointer-events: none;
}

#languageSwitcher button {
  border: 0;
  background: transparent;

  padding: 5px 6px;

  font-size: 19px;
  cursor: pointer;

  opacity: .4;

  pointer-events: auto;
}

#languageSwitcher button.active {
  opacity: 1;
}


/* =========================
   VIDEO / INTRO
========================= */

#videoScreen {
  background:
    radial-gradient(
      circle at center,
      #140707 0%,
      #050303 45%,
      #000 100%
    );

  padding-top: 35px;
  padding-bottom: 100px;
  justify-content: flex-start;
}

.video-frame {
  position: relative;

  width: min(100%, 360px);
  aspect-ratio: 9 / 16;
  max-height: 48vh;

  background: #050505;
  border: 1px solid #351010;

  overflow: hidden;

  box-shadow:
    0 0 45px rgba(80,0,0,.18),
    inset 0 0 50px #000;

  flex-shrink: 1;
}


/* =========================
   STORY CHAPTER 01
========================= */

.story-chapter {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}

.chapter-number {
  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: #7d1b1b;
  margin-bottom: 6px;
}

.story-title {
  font-family: "Cinzel", serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 3px;
  margin: 0 0 20px;
  color: #eee9e2;
}


/* FLIP PHOTO */

.memory-photo {
  width: 100%;
  aspect-ratio: 2 / 3;
  margin-bottom: 22px;

  perspective: 1200px;
  cursor: pointer;

  background: transparent;
  border: none;
  overflow: visible;
}

.memory-card {
  position: relative;
  width: 100%;
  height: 100%;

  transition: transform .8s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.memory-card.flipped {
  transform: rotateY(180deg);
}

.memory-card-face {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.memory-card-back {
  transform: rotateY(180deg);
}

.memory-card-face img {
  width: 100%;
  height: 100%;
  object-fit: cover;

  display: block;

  user-select: none;
  -webkit-user-drag: none;
}


/* STORY TEXT */

.story-text {
  font-family: "GFS Didot", serif;
  font-size: 18px;
  line-height: 1.65;
  color: #d8d3cc;
  margin-bottom: 25px;
}


/* RIDDLE */

.riddle-box {
  width: 100%;
  padding-top: 20px;
  border-top: 1px solid #301010;
}

.riddle-text {
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 17px;
  line-height: 1.6;
  color: #c9c3bc;
  margin-bottom: 18px;
}

.riddle-input {
  width: 100%;
  box-sizing: border-box;

  padding: 13px 14px;

  background: rgba(0,0,0,.55);
  border: 1px solid #4a1818;

  color: #eee9e2;
  text-align: center;

  font-family: "GFS Didot", serif;
  font-size: 17px;

  outline: none;
}

.riddle-input:focus {
  border-color: #8b2525;
}

.riddle-button {
  margin-top: 12px;
  padding: 11px 24px;

  border: 1px solid #651c1c;
  background: transparent;

  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 2px;

  cursor: pointer;
}

.riddle-message {
  min-height: 22px;
  margin-top: 12px;

  font-family: "GFS Didot", serif;
  font-size: 15px;
}


/* =========================
   INTRO TEXT
========================= */

.placeholder {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Cinzel", serif;
  color: #5d5555;

  font-size: 12px;
  letter-spacing: 4px;
}

.quote {
  max-width: 520px;

  margin: 30px auto;

  color: #e0dcd5;

  font-family: "GFS Didot", serif;
  font-size: 19px;
  font-weight: 400;
  font-style: italic;

  line-height: 1.75;
  letter-spacing: .2px;

  text-shadow:
    0 1px 2px rgba(0,0,0,.8);
}


/* START BUTTON */

.start-button {
  width: 300px;
  max-width: 90%;

  padding: 16px;

  background: rgba(0,0,0,.5);

  color: #ddd8d0;

  border: 1px solid #651313;

  font-family: "Cinzel", serif;
  font-size: 13px;
  letter-spacing: 1.5px;

  cursor: pointer;
}

.start-button:active {
  background: rgba(90,0,0,.3);
}


/* =========================
   NAVIGATION ARROWS
========================= */

#navigationArrows {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  min-height: 65px;

  padding:
    8px
    18px
    max(12px, env(safe-area-inset-bottom));

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;

  background: linear-gradient(
    to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.65),
    transparent
  );

  pointer-events: none;
}

#navigationArrows button {
  width: 42px;
  height: 42px;

  border: none;
  background: transparent;
  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 25px;

  cursor: pointer;
  opacity: .75;
  pointer-events: auto;
}

#navigationArrows button:active {
  background: transparent;
  color: #ffffff;
  opacity: 1;
}

#navigationArrows button:disabled {
  opacity: .2;
  cursor: default;
}


/* =========================
   EVENT 01 / 02
========================= */

#storyScreen1,
#storyScreen2 {
  justify-content: flex-start;
  padding-top: 35px;
}

#storyScreen2 {
  transform: none;
}

#storyScreen2 .heart-monitor {
  margin-top: 22vh;
}

.heart-monitor {
  width: 100%;
  margin: 35px 0;
  padding: 18px 0;
  background: #020403;
  overflow: hidden;
  box-shadow: inset 0 0 30px rgba(0, 255, 100, 0.05);
}

.heart-monitor.fade-out {
  opacity: 0;
  transition: opacity 2s ease;
}

.monitor-line {
  width: 100%;
  height: 120px;
  overflow: hidden;
}

.monitor-line svg {
  width: 825.0%;
  height: 100%;
  animation: ecgCollapse 29s linear forwards;
}

.ecg-line {
  fill: none;
  stroke: #39ff78;
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 5px #39ff78);
}

@keyframes ecgCollapse {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-87.88%);
  }
}

@media (min-width: 768px) {

  .video-frame {
    width: 280px;
    max-height: 52vh;
  }

  .quote {
    max-width: 650px;
  }


}

.hospital-document {
  opacity: 0;
  transition: opacity 3s ease;
  width: 100%;
  max-width: 390px;
  margin: 25px auto 40px;
  padding: 28px 24px;

  background:
    linear-gradient(
      rgba(255,255,255,.04),
      rgba(0,0,0,.05)
    ),
    #d8d0ba;

  color: #171512;

  text-align: left;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.55;

  border: 1px solid #8e8775;

  box-shadow:
    0 8px 30px rgba(0,0,0,.8),
    inset 0 0 35px rgba(70,55,30,.12);

  transform: rotate(-0.4deg);
}

.hospital-document.show {
  opacity: 1;
}

#hospitalName {
  text-align: center;
  font-weight: bold;
  font-size: 16px;
  letter-spacing: 1px;
}

#hospitalRecordTitle {
  text-align: center;
  font-weight: bold;
  font-size: 12px;
  margin-top: 5px;
  letter-spacing: .8px;
}

.hospital-document hr {
  border: 0;
  border-top: 1px solid rgba(30,25,20,.45);
  margin: 17px 0;
}

#hospitalTimeline {
  line-height: 1.8;
}

#hospitalMotherStatus {
  margin-top: 4px;
  font-weight: bold;
}

#incidentTimeInput {
  width: 55%;
  padding: 10px;

  background: rgba(255,255,255,.35);
  border: 1px solid #625c50;

  color: #171512;
  text-align: center;

  font-family: "Courier New", monospace;
  font-size: 16px;
}

#incidentTimeButton {
  width: 43%;
  padding: 10px 4px;

  background: #24211c;
  border: 1px solid #24211c;

  color: #ddd5c1;

  font-family: "Courier New", monospace;
  font-size: 11px;

  cursor: pointer;
}


/* =========================
   EVENT 03
========================= */

.henry-anger {
  height: 150px;
  overflow: hidden;
  margin-top: 35px;
  text-align: center;
  position: relative;
  font-size: 19px;
  line-height: 1.6;

  opacity: 1;
  transition: opacity 2s ease;
}

/* EVENT 03 - Smooth κίνηση λόγων Henry */
.henry-line {
  position: absolute;
  left: 0;
  top: 120px;
  width: 100%;

  opacity: 0;

  transition:
    top 9s linear,
    opacity 1s ease;
}

.henry-line.show {
  top: -40px;
  opacity: 1;
}

.henry-line.fade-away {
  top: 0;
  opacity: 0;
}

#storyScreen3 {
  justify-content: flex-start;
  padding-top: 35px;
}

#storyScreen3 .story-chapter {
  width: 100%;
}

#storyScreen3 .henry-anger {
  margin-top: 22vh;
}

/* EVENT 03 - ΣΚΗΝΗ ΦΩΤΙΑΣ */
.fire-scene {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 100%;

  transform: translate(-50%, -50%);
  opacity: 0;

  transition: opacity 2s ease;
}

.fire-scene.show {
  opacity: 1;
}

.fire-scene video {
  width: 100%;
  max-height: 55vh;
  object-fit: cover;
  display: block;
}

/* EVENT 03 - ΕΠΙΣΗΜΗ ΚΑΤΑΘΕΣΗ HENRY */
.henry-statement {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 40px);
  max-width: 390px;

  margin: 30px auto;
  padding: 26px 22px;

  background:
    linear-gradient(
      rgba(25, 18, 14, .18),
      rgba(0, 0, 0, .12)
    ),
    #aaa18c;

  color: #18130f;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.65;
  text-align: left;

  border: 1px solid #8e8775;

  box-shadow:
    0 12px 35px rgba(0,0,0,.95),
    inset 0 0 45px rgba(45,20,8,.28),
    inset 0 0 8px rgba(0,0,0,.35);

  opacity: 0;
  transition: opacity 3s ease;
}

.henry-statement.show {
  opacity: 1;
}

/* EVENT 03 - ΑΝΑΦΟΡΑ ΠΥΡΟΣΒΕΣΤΙΚΗΣ / ΑΣΤΥΝΟΜΙΑΣ */
.fire-report {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 40px);
  max-width: 390px;

  margin: 30px auto;
  padding: 26px 22px;

  background:
    linear-gradient(
      rgba(25, 18, 14, .20),
      rgba(0, 0, 0, .14)
    ),
    #9f9785;

  color: #17120f;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.65;
  text-align: left;

  border: 1px solid #77736a;

  box-shadow:
    0 12px 35px rgba(0,0,0,.95),
    inset 0 0 45px rgba(45,20,8,.30),
    inset 0 0 8px rgba(0,0,0,.38);

  opacity: 0;

  transition: opacity 1.5s ease;
}

.fire-report.show {
  opacity: 1;
}

/* EVENT 03 - ΚΡΥΜΜΕΝΟ ΣΤΟΙΧΕΙΟ */
.hidden-evidence {
  position: absolute;
  top: 50%;
  left: 50%;

  width: calc(100% - 30px);
  max-width: 420px;
  aspect-ratio: 3 / 4;

  transform: translate(-50%, -50%);

  background: #020202;

  overflow: hidden;

  opacity: 0;
  transition: opacity 2s ease;

  box-shadow: 0 10px 40px rgba(0,0,0,.95);
  touch-action: none;

  /* Το παρατεταμένο άγγιγμα να μην ανοίγει μενού / επιλογή στο κινητό */
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

.hidden-evidence.show {
  opacity: 1;
}

.hidden-evidence img {
  pointer-events: none;
  -webkit-touch-callout: none;
  filter: brightness(1.35) contrast(1.05);
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;

  user-select: none;
  -webkit-user-drag: none;
}

.evidence-darkness {
  position: absolute;
  inset: 0;

  background: rgba(0, 0, 0, 0.97);

  -webkit-mask-image: radial-gradient(
    circle 65px at var(--x, 100%) var(--y, 100%),
    transparent 0,
    transparent 45px,
    black 75px
  );

  mask-image: radial-gradient(
    circle 65px at var(--x, 100%) var(--y, 100%),
    transparent 0,
    transparent 45px,
    black 75px
  );

  pointer-events: none;
  z-index: 2;
  transition: opacity 2s ease;
}

.evidence-darkness.found {
  opacity: 0;
}


/* =========================
   EVENT 04 - ΗΜΕΡΟΛΟΓΙΟ
========================= */

#storyScreen4 {
  justify-content: flex-start;
  padding-top: 35px;

  background:
    radial-gradient(
      circle at 50% 38%,
      #140b07 0%,
      #060403 45%,
      #000 100%
    );
}

.calendar-scene {
  position: relative;
  z-index: 2;

  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 6vh;

  transition: opacity 1.5s ease;
}

.calendar-scene.fade-out {
  opacity: 0;
}

.old-calendar {
  position: relative;

  width: 230px;
  height: 290px;

  display: flex;
  flex-direction: column;

  background: #c9bea4;
  color: #1c1712;

  font-family: "Courier New", monospace;

  /* Κρεμασμένο στον τοίχο, ελαφρώς στραβό */
  transform: rotate(-1.2deg);

  /* Πάχος στοίβας σελίδων + σκιά */
  box-shadow:
    0 2px 0 #b4a98f,
    0 4px 0 #a69b81,
    0 6px 0 #978c73,
    0 7px 0 #6e6553,
    0 20px 45px rgba(0,0,0,.95);

  transition:
    filter 1.8s ease,
    transform 2.2s ease;
}

/* Γέρνει και κρεμάει στις πένθιμες μέρες */
.old-calendar.grieving {
  transform: rotate(-3.5deg) translateY(8px);
}

/* Μεταλλικοί κρίκοι */
.old-calendar::before,
.old-calendar::after {
  content: "";
  position: absolute;
  top: -10px;
  z-index: 5;

  width: 9px;
  height: 22px;

  border: 3px solid #77726a;
  border-radius: 6px;

  box-shadow:
    inset 0 0 2px rgba(0,0,0,.7),
    0 2px 3px rgba(0,0,0,.8);
}

.old-calendar::before { left: 27%; }
.old-calendar::after  { right: 27%; }

.calendar-top {
  flex-shrink: 0;

  padding: 17px 10px 11px;

  background: linear-gradient(#30241d, #1b1410);
  color: #b7aa91;

  font-family: "Cinzel", serif;
  font-size: 11px;
  letter-spacing: 4px;

  box-shadow: 0 2px 4px rgba(0,0,0,.45);
  position: relative;
  z-index: 4;
}

/* Στοίβα σελίδων */
.calendar-pages {
  position: relative;
  flex: 1;
}

.calendar-page,
.calendar-stub {
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at 25% 15%,
      rgba(255,248,230,.28),
      transparent 60%
    ),
    linear-gradient(
      rgba(70,45,25,.05),
      rgba(40,22,10,.24)
    ),
    #cbbfa3;
}

.calendar-page {
  display: flex;
  flex-direction: column;
  align-items: center;

  box-shadow: inset 0 0 28px rgba(60,35,15,.28);
}

.calendar-month {
  margin-top: 20px;
  font-size: 15px;
  letter-spacing: 4px;
}

.calendar-day {
  margin-top: 4px;

  font-family: "GFS Didot", serif;
  font-size: 96px;
  line-height: 1;
}

.calendar-weekday {
  margin-top: 4px;

  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 16px;
}

.calendar-year {
  margin-top: 12px;

  font-size: 13px;
  letter-spacing: 6px;
  opacity: .75;
}

/* Κυριακές με κόκκινο */
.calendar-page.sunday .calendar-day,
.calendar-page.sunday .calendar-weekday {
  color: #8b1d1d;
}

/* Υπόλειμμα χαρτιού στην κορυφή */
.calendar-stub {
  z-index: 2;
  pointer-events: none;
  filter: brightness(.86);
  clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
}

/* Η σελίδα που σκίζεται και πέφτει */
.torn-sheet {
  z-index: 3;
  transform-origin: top left;
  will-change: transform, clip-path, opacity;
  filter: brightness(1.03);
}

/* Κόκκινος κύκλος στην ημερομηνία */
.calendar-mark {
  position: absolute;
  left: 50%;
  top: 30px;
  width: 150px;
  height: 120px;
  transform: translateX(-50%) rotate(-5deg);
  z-index: 4;
  pointer-events: none;
  overflow: visible;
  opacity: 0;
}

.calendar-mark path {
  fill: none;
  stroke: #8b1414;
  stroke-width: 3.5;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
}

.calendar-mark.draw {
  opacity: .9;
}

.calendar-mark.draw path {
  animation: drawMark 1.6s ease-out forwards;
}

@keyframes drawMark {
  to { stroke-dashoffset: 0; }
}

/* Μαρασμός: λεκέδες υγρασίας + σκοτάδι στις άκρες */
.calendar-wither {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;

  background:
    radial-gradient(ellipse at 28% 72%, rgba(70,40,15,.5), transparent 35%),
    radial-gradient(ellipse at 76% 30%, rgba(60,35,12,.4), transparent 30%),
    radial-gradient(ellipse at 60% 90%, rgba(50,30,10,.35), transparent 25%),
    radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.8) 100%);

  opacity: 0;
  transition: opacity 1.8s ease;
}

/* Ο κόσμος γύρω σκοτεινιάζει */
#storyScreen4::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;

  background: radial-gradient(
    ellipse at 50% 40%,
    rgba(0,0,0,.15) 0%,
    rgba(0,0,0,.94) 70%
  );

  opacity: 0;
  transition: opacity 2s ease;
}

#storyScreen4.mourning::after {
  opacity: 1;
}

/* Φράσεις πένθους */
.grief-line {
  min-height: 60px;
  max-width: 320px;
  margin-top: 34px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 17px;
  line-height: 1.6;
  color: #cfc6b8;
  opacity: 0;
  transition: opacity 1.2s ease;
}

.grief-line.show { opacity: 1; }


/* =========================
   EVENT 04 - ΓΡΑΦΕΙΟ HENRY (δωμάτιο)
========================= */

.desk-scene {
  position: relative;
  width: 100%;
  aspect-ratio: 400 / 340;
  margin-top: 3vh;
  overflow: hidden;
  border-radius: 4px;
  opacity: 0;
  transition: opacity 2s ease;
}

.desk-scene.show { opacity: 1; }

/* Σκοτάδι στις άκρες του δωματίου */
.desk-scene::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background: radial-gradient(
    ellipse at 48% 48%,
    transparent 35%,
    rgba(0,0,0,.75) 100%
  );
}

.room-svg,
.light-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.light-svg {
  z-index: 5;
  pointer-events: none;
}

/* Η ταλαιπωρημένη λάμπα τρεμοπαίζει */
.lamp-beam,
.lamp-glow,
.lamp-bulb {
  animation: lampFlicker 7s infinite;
}

@keyframes lampFlicker {
  0%, 60%, 66%, 100% { opacity: 1; }
  61%  { opacity: .35; }
  62%  { opacity: .9; }
  64%  { opacity: .25; }
  65%  { opacity: .85; }
}

@media (prefers-reduced-motion: reduce) {
  .lamp-beam, .lamp-glow, .lamp-bulb { animation: none; }
}

/* Κοινά για όλα τα αντικείμενα */
.desk-item {
  position: absolute;
  z-index: 2;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: filter .5s ease;
}

.desk-item.seen { filter: brightness(.65); }

/* Αντικείμενα ξαπλωμένα πάνω στο γραφείο (προοπτική) */
.flat {
  transform:
    translate(-50%, -50%)
    matrix(1, 0, -0.55, 0.45, 0, 0)
    rotate(var(--r, 0deg));
  transform-origin: center;
  box-shadow: 2px 3px 5px rgba(0,0,0,.55);
}

/* Αντικείμενα όρθια πάνω στο γραφείο */
.upright {
  transform: translateX(-50%);
}

/* --- Σημειώσεις Henry --- */
.desk-notes {
  left: 32%;
  top: 47%;
  width: 17%;
  aspect-ratio: 3 / 4;
  --r: 6deg;
  background:
    repeating-linear-gradient(to bottom,
      transparent 0 6px,
      rgba(60,90,140,.35) 6px 7px),
    #e2dac6;
  box-shadow:
    2px 2px 0 #cfc5ad,
    4px 4px 0 #b9ae93,
    5px 7px 8px rgba(0,0,0,.6);
}

/* Σύμβολο σκαριφημένο πάνω στις σημειώσεις */
.desk-notes .vodou-symbol {
  position: absolute;
  right: 8%;
  bottom: 8%;
  width: 45%;
  height: auto;
  color: #7a1414;
  stroke-width: 6;
}

/* --- Εφημερίδα / μαρτυρία --- */
.newspaper-clip {
  left: 51%;
  top: 54%;
  width: 24%;
  aspect-ratio: 4 / 3;
  --r: -4deg;
  padding: 5% 6%;
  background: #d9d3c1;
  color: #1a1510;
  font-family: "Times New Roman", serif;
  overflow: hidden;
}

.clip-masthead {
  font-size: 6px;
  letter-spacing: 1px;
  text-align: center;
  border-bottom: 1px solid #1a1510;
  padding-bottom: 2px;
}

.clip-lines {
  margin-top: 5px;
  height: 70%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(26,21,16,.45) 0 1.5px,
    transparent 1.5px 5px
  );
}

/* --- Φυλλάδιο μέντιουμ --- */
.medium-flyer {
  left: 73%;
  top: 52%;
  width: 12%;
  aspect-ratio: 2 / 3;
  --r: 12deg;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #3b1414, #150606);
  border: 1px solid #6b5426;
  color: #d8c48f;
  font-family: "Cinzel", serif;
}

.flyer-symbol { font-size: 16px; line-height: 1; }
.flyer-name   { margin-top: 3px; font-size: 5px; letter-spacing: .5px; }

/* --- Φάκελοι λογαριασμών --- */
.envelopes {
  left: 14%;
  top: 55%;
  width: 16%;
  aspect-ratio: 3 / 2;
  --r: -10deg;
  box-shadow: none;
}

.envelopes span {
  position: absolute;
  inset: 0;
  background: #cfc5ad;
  border: 1px solid #9c917a;
  box-shadow: 2px 3px 5px rgba(0,0,0,.55);
}

.envelopes span:nth-child(1) { transform: rotate(-9deg) translate(-4px, 3px); }
.envelopes span:nth-child(2) { transform: rotate(6deg) translate(3px, -2px); }
.envelopes span:nth-child(3) {
  transform: rotate(-2deg);
  background:
    linear-gradient(35deg, transparent 49%, rgba(0,0,0,.25) 50%, transparent 51%),
    linear-gradient(-35deg, transparent 49%, rgba(0,0,0,.25) 50%, transparent 51%),
    #d8cfb8;
}

/* Κόκκινη σφραγίδα "ΑΠΛΗΡΩΤΟ" στον πάνω φάκελο */
.envelopes span:nth-child(3)::after {
  content: "";
  position: absolute;
  right: 10%;
  top: 14%;
  width: 26%;
  height: 22%;
  border: 1.5px solid rgba(150,20,20,.8);
}

/* --- Κλειστός υπολογιστής --- */
.laptop {
  left: 54%;
  top: 41%;
  width: 26%;
  aspect-ratio: 3 / 2;
  --r: -3deg;
  border-radius: 4px;
  background:
    linear-gradient(135deg,
      rgba(255,255,255,.14) 0%,
      transparent 35%),
    linear-gradient(#34363b, #1c1d20);
  border: 1px solid #0c0c0e;
  box-shadow:
    0 2px 0 #0e0e10,
    3px 5px 8px rgba(0,0,0,.7);
}

/* Μικρό φωτάκι λειτουργίας */
.laptop::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 6%;
  width: 4px;
  height: 4px;
  margin-left: -2px;
  border-radius: 50%;
  background: #6bd08a;
  box-shadow: 0 0 5px #6bd08a;
  animation: laptopPulse 3s infinite ease-in-out;
}

@keyframes laptopPulse {
  0%, 100% { opacity: .25; }
  50%      { opacity: 1; }
}

/* --- Κάδρο Karen (όρθιο) --- */
.photo-frame {
  left: 86%;
  bottom: 61%;
  width: 11%;
  aspect-ratio: 3 / 4;
  padding: 3px;
  background: #2a1c12;
  border: 2px solid #6d5230;
  box-shadow: 3px 4px 6px rgba(0,0,0,.7);
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: sepia(.4) brightness(.85);
}

/* --- Μπουκάλι κρασί (όρθιο) --- */
.wine-bottle {
  left: 79%;
  bottom: 58%;
  width: 5.5%;
  aspect-ratio: 1 / 4;
}

.wine-bottle::before {             /* σώμα */
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 66%;
  border-radius: 7px 7px 3px 3px;
  background: linear-gradient(90deg, #0d1a0e, #2f4d2e 40%, #0d1a0e);
  box-shadow: 3px 4px 6px rgba(0,0,0,.7);
}

.wine-bottle::after {              /* λαιμός */
  content: "";
  position: absolute;
  left: 33%;
  right: 33%;
  top: 0;
  height: 38%;
  border-radius: 2px 2px 0 0;
  background: linear-gradient(90deg, #0d1a0e, #2a4429, #0d1a0e);
}

.wine-label {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 18%;
  height: 20%;
  z-index: 1;
  background: #d8cba8;
}

/* --- Ποτήρια (όρθια) --- */
.glasses {
  left: 67%;
  bottom: 56%;
  width: 11%;
  aspect-ratio: 2 / 1.5;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.glass {
  position: relative;
  width: 40%;
  height: 100%;
}

.glass .bowl {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 55%;
  border: 1px solid rgba(230,225,215,.55);
  border-top: none;
  border-radius: 0 0 50% 50% / 0 0 70% 70%;
  background: rgba(255,255,255,.06);
}

.glass.wine .bowl {
  background: linear-gradient(transparent 55%, rgba(110,10,20,.8) 55%);
}

.glass::before {                   /* πόδι */
  content: "";
  position: absolute;
  left: 50%;
  top: 55%;
  width: 1.5px;
  height: 40%;
  margin-left: -.75px;
  background: rgba(230,225,215,.55);
}

.glass::after {                    /* βάση */
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  bottom: 0;
  height: 2px;
  border-radius: 50%;
  background: rgba(230,225,215,.55);
}

/* Hint κάτω από το γραφείο */
.desk-hint {
  min-height: 52px;
  margin-top: 14px;
  padding: 0 10px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.55;
  color: rgba(230,215,190,.55);
  transition: color .6s ease;
}

.desk-hint.grief-active { color: rgba(240,228,205,.92); }

/* =========================
   EVENT 04 - ΜΕΓΕΘΥΜΕΝΗ ΠΡΟΒΟΛΗ
========================= */

.desk-viewer {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0,0,0,.88);
  opacity: 0;
  transition: opacity .6s ease;
}

.desk-viewer.show { opacity: 1; }

.desk-viewer-content {
  width: 100%;
  max-width: 370px;
  max-height: 100%;
  padding: 6px;
  overflow-x: hidden;
  overflow-y: auto;
}

.viewer-tip {
  margin-top: 16px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 14px;
  color: rgba(230,215,190,.55);
}

/* Εφημερίδα */
.viewer-newspaper {
  padding: 22px 20px;
  background: #dcd6c4;
  color: #16120d;
  text-align: left;
  font-family: "Times New Roman", serif;
  transform: rotate(-1deg);
  box-shadow:
    0 12px 40px rgba(0,0,0,.9),
    inset 0 0 40px rgba(90,70,40,.18);
}

.viewer-newspaper .masthead {
  text-align: center;
  font-family: "Cinzel", serif;
  font-size: 15px;
  letter-spacing: 3px;
  border-bottom: 2px solid #16120d;
  padding-bottom: 6px;
}

.viewer-newspaper .dateline {
  text-align: center;
  font-size: 10px;
  letter-spacing: 1px;
  margin: 5px 0 12px;
}

.viewer-newspaper h3 {
  margin: 0 0 10px;
  font-size: 19px;
  line-height: 1.2;
}

.viewer-newspaper p {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
}

.henry-circle {
  position: relative;
  white-space: nowrap;
}

.henry-circle::after {
  content: "";
  position: absolute;
  inset: -5px -8px;
  border: 2px solid rgba(140,20,20,.85);
  border-radius: 50%;
  transform: rotate(-3deg);
}

/* Σημειώσεις Henry (μεγάλες) */
.viewer-notes {
  padding: 14px 14px 16px 36px;
  text-align: left;
  color: #1d2233;
  background:
    linear-gradient(to right,
      transparent 24px,
      rgba(170,40,40,.45) 24px 26px,
      transparent 26px),
    repeating-linear-gradient(to bottom,
      transparent 0 20px,
      rgba(60,90,140,.22) 20px 21px),
    #e2dac6;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
  transform: rotate(1deg);
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 14px;
  line-height: 1.45;
}

.notes-title {
  font-size: 17px;
  margin-bottom: 4px;
}

.notes-symbols {
  display: flex;
  gap: 8px;
  margin: 6px 0;
  color: #7a1414;
}

.notes-symbols .vodou-symbol {
  width: 32px;
  height: 32px;
}

.viewer-notes .henry-ink { font-size: 16px; }

.notes-symbols .vodou-symbol:nth-child(2) { transform: rotate(-8deg); opacity: .8; }
.notes-symbols .vodou-symbol:nth-child(3) { transform: rotate(6deg); opacity: .6; }

/* Οθόνη υπολογιστή */
.laptop-screen {
  aspect-ratio: 16 / 10;
  padding: 14px;
  border: 10px solid #1c1d20;
  border-radius: 10px;
  background: #050607;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6f7a70;
  font-family: "Courier New", monospace;
  font-size: 13px;
}

.laptop-cursor {
  display: inline-block;
  width: 8px;
  height: 15px;
  margin-left: 4px;
  vertical-align: middle;
  background: #6f7a70;
  animation: laptopPulse 1s infinite steps(1);
}

/* Φυλλάδιο (μεγάλο, γυρίζει) */
.flyer-card {
  width: min(100%, 46vh);
  aspect-ratio: 2 / 3;
  margin: 0 auto;
  perspective: 1200px;
  cursor: pointer;
}

.flyer-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .8s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.flyer-inner.flipped { transform: rotateY(180deg); }

.flyer-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 26px 22px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
}

.flyer-front {
  background: radial-gradient(circle at 50% 30%, #3d1515, #140505 75%);
  border: 1px solid #6b5426;
  color: #d9c48c;
  font-family: "Cinzel", serif;
  text-align: center;
}

.f-title   { font-size: 14px; letter-spacing: 3px; }
.f-symbol  { font-size: 46px; margin: 16px 0; }
.f-name    { font-size: 17px; letter-spacing: 1px; }
.f-quote   { margin: 16px 0; font-family: "GFS Didot", serif; font-style: italic; font-size: 15px; color: #e8dcc0; }
.f-details { font-size: 11px; letter-spacing: 1.5px; line-height: 1.9; }

.flyer-back {
  transform: rotateY(180deg);
  align-items: flex-start;
  background: #d6cdb6;
  color: #1d2233;
  text-align: left;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 16px;
  line-height: 1.55;
}

.flyer-symbol-copy {
  width: 72px;
  height: 72px;
  margin: 10px auto 0;
  color: #1d2233;
}

.vodou-symbol {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Τα λόγια του Henry με κόκκινο μελάνι */
.henry-ink {
  color: #8b1414;
  font-size: 18px;
}

.henry-hope {
  min-height: 30px;
  margin-top: 22px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 21px;
  color: #e6ddcf;
  opacity: 0;
  transition: opacity 3s ease;
}

.henry-hope.show { opacity: 1; }


/* =========================
   EVENT 04 - ΥΠΟΛΟΓΙΣΤΗΣ: CURIOSITY LUST
========================= */

.desk-viewer-content.wide {
  max-width: 760px;
}

.laptop-frame {
  border: 10px solid #1c1d20;
  border-bottom-width: 14px;
  border-radius: 10px;
  background: #000;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
  overflow: hidden;
  cursor: default;
}

.browser {
  display: flex;
  flex-direction: column;
  height: min(74vh, 620px);
  background: #333;
  color: #f2f2f2;
  text-align: left;
  font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
}

/* Καρτέλες */
.browser-tabs {
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 6px 10px 0;
  background: #000;
}

.browser-dot {
  align-self: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #6e1a33;
}

.browser-tab {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 12px;
  border-radius: 7px 7px 0 0;
  background: #333;
  font-size: 12px;
}

.tab-x   { color: #777; font-size: 13px; }
.tab-plus { align-self: center; font-size: 20px; line-height: 1; padding-bottom: 4px; }

/* Γραμμή διεύθυνσης */
.browser-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
}

.browser-nav {
  color: #ccc;
  font-size: 14px;
  letter-spacing: 4px;
  white-space: nowrap;
}

.browser-url {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  padding: 5px 12px;
  border-radius: 20px;
  background: #c4c5c7;
  color: #555;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.browser-url svg {
  flex-shrink: 0;
  width: 13px;
  height: 13px;
  fill: none;
  stroke: #222;
  stroke-width: 2.5;
}

/* Η σελίδα του forum */
.site {
  flex: 1;
  overflow-y: auto;
  padding: 10px 16px 24px;
  -webkit-overflow-scrolling: touch;
}

.site::-webkit-scrollbar { width: 8px; }
.site::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }

.site-nav {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 13px;
  font-weight: 800;
  color: #0e6282;
}

.site-nav span { padding: 3px 9px; }

.site-nav .active {
  border: 1.5px solid #cfcfcf;
  border-radius: 20px;
}

.site-logo {
  margin: 4px 0 14px;
  font-size: clamp(30px, 9vw, 56px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1px;
  color: #0e6282;
}

.forum-topic {
  margin: 0 0 14px;
  font-size: clamp(19px, 5vw, 28px);
  font-weight: 500;
  line-height: 1.25;
}

.comments-title {
  margin: 20px 0 10px;
  font-size: 16px;
}

.forum-entry {
  margin-bottom: 14px;
}

.forum-entry.reply {
  margin: 10px 0 0 26px;
}

.forum-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: #bdbdbd;
}

.forum-avatar {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  color: #e8e8e8;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.2;
}

.forum-user.bold {
  font-weight: 700;
  color: #cfcfcf;
}

.forum-text {
  margin: 4px 0 0 29px;
  font-size: 15px;
  line-height: 1.5;
}

.forum-reply-icon {
  width: 16px;
  height: 16px;
  margin-right: 5px;
  vertical-align: -3px;
  fill: none;
  stroke: #0e6282;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}


/* =========================
   EVENT 04 - ΚΛΕΙΔΩΜΑ ΥΠΟΛΟΓΙΣΤΗ (σύμβολο)
========================= */

.lock-screen {
  height: min(74vh, 620px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;

.lock-user {

/* =========================
   EVENT 04 → 05 - ΚΟΥΜΠΙ "Η ΑΡΧΗ ΤΟΥ ΤΕΛΟΥΣ"
========================= */

.end-begin-button {
  margin-top: 18px;
  opacity: 0;
  transition: opacity 2s ease;
}

.end-begin-button.show { opacity: 1; }


/* =========================
   EVENT 05 - ΤΟ ΣΠΙΤΙ ΣΤΟ ΔΑΣΟΣ
========================= */

#storyScreen5 {
  justify-content: flex-start;
  padding-top: 35px;
  background: #000;
}

.cabin-scene {
  width: calc(100% + 48px);
  aspect-ratio: 4 / 3;
  margin: 5vh -24px 0;
  overflow: hidden;
  border-radius: 0;
  opacity: 0;
  transition: opacity 2.5s ease;
}

.cabin-scene.show { opacity: 1; }

.cabin-scene {
  position: relative;
}

.cabin-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Η εικόνα και τα εφέ της κινούνται μαζί (ζουμ) */
.cabin-zoom {
  position: absolute;
  inset: 0;
}

/* Φωτογραφία 1: αργό ζουμ προς την πόρτα καθώς πλησιάζει */
.cabin-zoom-1 {
  transform-origin: 52% 56%;
  transition: transform 10s ease-in-out, opacity 1.4s ease;
}

.cabin-scene.approach .cabin-zoom-1 {
  transform: scale(1.6);
}

/* Χτυπάει την πόρτα: η πρώτη φωτογραφία σβήνει */
.cabin-scene.at-door .cabin-zoom-1 {
  opacity: 0;
}

/* Φωτογραφία 2: η πόρτα άνοιξε, ο Henry και ο Bennett */
.cabin-zoom-2 {
  opacity: 0;
  transform: scale(1.12);
  transform-origin: 45% 55%;
  transition: opacity 2s ease, transform 14s ease-out;
}

.cabin-scene.door-open .cabin-zoom-2 {
  opacity: 1;
  transform: scale(1);
}

.cabin-photo,
.cabin-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.cabin-photo {
  object-fit: cover;
}

.window-flicker {
  opacity: 0;
  animation: windowFlicker 6s infinite;
}

@keyframes windowFlicker {
  0%, 55%, 61%, 100% { opacity: 0; }
  56% { opacity: .45; }
  58% { opacity: .1; }
  59% { opacity: .55; }
}

.door-spill {
  mix-blend-mode: screen;
}

/* Ο Bennett λίγο θολός, για να δένει με τη φωτογραφία */
.cabin-overlay .bennett-figure {
  filter: blur(1.2px);
}

/* Κόκκος φιλμ και σκοτάδι στις άκρες για πιο κινηματογραφική εικόνα */
.cabin-scene::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(0,0,0,.7) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
  opacity: .35;
  mix-blend-mode: overlay;
}

/* Το φως στο παράθυρο τρεμοπαίζει */
.window-flicker {
  animation-name: windowFlicker;
}

@keyframes cabinFlicker {
  0%, 40%, 46%, 100% { opacity: 1; }
  42% { opacity: .55; }
  44% { opacity: .9; }
  45% { opacity: .4; }
}

/* Η ομίχλη κινείται αργά */
.cabin-fog {
  animation: fogDrift 18s linear infinite alternate;
}

@keyframes fogDrift {
  from { transform: translateX(0); }
  to   { transform: translateX(160px); }
}

@media (prefers-reduced-motion: reduce) {
  .window-flicker { animation: none; }
}

.cabin-caption {
  min-height: 48px;
  margin-top: 14px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.55;
  color: rgba(230,215,190,.75);
  opacity: 0;
  transition: opacity 2s ease;
}

.cabin-caption.show { opacity: 1; }


/* Η πόρτα ανοίγει */
.door-light,
.door-spill,
.bennett-figure {
  opacity: 0;
  transition: opacity 1.6s ease;
}

.cabin-scene.door-open .door-light,
.cabin-scene.door-open .door-spill,
.cabin-scene.door-open .bennett-figure {
  opacity: 1;
}

/* Διάλογος */
.cabin-dialogue {
  min-height: 56px;
  margin-top: 6px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 19px;
  line-height: 1.5;
  color: #e6ddcf;
  opacity: 0;
  transition: opacity 1s ease;
}

.cabin-dialogue.show { opacity: 1; }
.cabin-dialogue.henry { color: #d98c8c; }

/* Το υπόγειο: σκοτάδι, κεριά, φως */
.pool-dark {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #000;
  opacity: .94;
  pointer-events: none;
  transition: opacity 1.8s ease;
}

.pool-glow {
  position: absolute;
  z-index: 2;
  width: 95%;
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -62%);
  background: radial-gradient(circle,
    rgba(255,179,92,.45) 0%,
    rgba(255,179,92,.15) 35%,
    rgba(255,179,92,0) 65%);
  mix-blend-mode: screen;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.2s ease;
}

.pool-glow.lit {
  opacity: 1;
  animation: candleGlowPulse 2.4s infinite alternate ease-in-out;
}

.pool-canvas {
  z-index: 2;
  /* Το αίμα "βάφει" τη φωτογραφία, κρατώντας την υφή του πατώματος */
  mix-blend-mode: multiply;
}

.pool-candle {
  position: absolute;
  z-index: 3;
  width: 46px;
  height: 72px;
  transform: translate(-50%, -100%);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.pool-candle .wax {
  position: relative;
  width: 10px;
  height: 26px;
  border-radius: 2px;
  background: linear-gradient(90deg, #b9b09a, #e0d8c4 45%, #b9b09a);
  opacity: .5;
  transition: opacity 1s ease;
}

/* Φυτίλι */
.pool-candle .wax::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -5px;
  width: 1.6px;
  height: 5px;
  margin-left: -.8px;
  background: #111;
}

.pool-candle .flame {
  position: absolute;
  left: 50%;
  bottom: 30px;
  width: 9px;
  height: 17px;
  margin-left: -4.5px;
  border-radius: 50% 50% 45% 45%;
  background: radial-gradient(ellipse at 50% 70%,
    #fff6d6 0%, #ffb347 50%, rgba(255,90,20,0) 75%);
  box-shadow: 0 0 14px 4px rgba(255,160,70,.35);
  transform-origin: 50% 100%;
  opacity: 0;
  transition: opacity .8s ease;
}

.pool-candle.lit .wax { opacity: 1; }

.pool-candle.lit .flame {
  opacity: 1;
  animation: candleFlame 1.6s infinite alternate ease-in-out;
}

@keyframes candleFlame {
  0%   { transform: scale(1, 1) rotate(-3deg); }
  50%  { transform: scale(1.08, .92) rotate(2deg); }
  100% { transform: scale(.94, 1.08) rotate(-1deg); }
}

@keyframes candleGlowPulse {
  from { opacity: .85; }
  to   { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .pool-candle.lit .flame, .pool-glow.lit { animation: none; }
}

/* Η εικόνα OBSESSED */
.obsessed-image {
  display: block;
  width: 100%;
  max-height: 80vh;
  object-fit: contain;
  margin: 3vh auto 0;
  opacity: 0;
  transition: opacity 3s ease;
}

.obsessed-image.show { opacity: 1; }

/* Η φωτογραφία με τη λίμνη αίματος */
.pool-scene {

  aspect-ratio: 4 / 3;
  margin: 5vh -24px 0;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 70%, #1c1511, #060403 75%);
  opacity: 0;
  transition: opacity 1.8s ease;
}

.pool-scene.show { opacity: 1; }

.pool-photo,
.pool-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.pool-photo { object-fit: cover; }

.blackout {

/* =========================
   EVENT 04 - ΣΤΑΔΙΟ 1: ΕΡΕΥΝΑ
========================= */

.desk-fade {
  opacity: 0 !important;
  transition: opacity 1.5s ease !important;
}

.research-scene {
  width: 100%;
  margin-top: 3vh;
  opacity: 0;
  transition: opacity 2s ease;
}

.research-scene.show { opacity: 1; }

.research-date {
  margin-bottom: 14px;
  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: #8a7a62;
}

.notebook-page {
  position: relative;
  padding: 22px 18px 24px 46px;
  text-align: left;
  color: #1d2233;
  background:
    linear-gradient(to right,
      transparent 32px,
      rgba(170,40,40,.45) 32px 34px,
      transparent 34px),
    repeating-linear-gradient(to bottom,
      transparent 0 27px,
      rgba(60,90,140,.22) 27px 28px),
    #e2dac6;
  box-shadow:
    0 12px 35px rgba(0,0,0,.9),
    inset 0 0 40px rgba(90,70,40,.22);
  transform: rotate(.6deg);
  font-family: "GFS Didot", serif;
  font-style: italic;
}

.notebook-title {
  font-size: 20px;
  margin-bottom: 10px;
}

.research-entry {
  padding: 7px 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.entry-name {
  position: relative;
  display: inline-block;
  font-size: 17px;
}

.entry-note {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  font-size: 15px;
  color: #3a3f55;
  transition: max-height .8s ease, opacity .8s ease, margin .8s ease;
}

.research-entry.revealed .entry-note {
  max-height: 90px;
  opacity: 1;
  margin-top: 3px;
}

/* Διαγραφή με μελάνι */
.entry-name::after {
  content: "";
  position: absolute;
  left: -4px;
  top: 55%;
  width: 0;
  height: 2px;
  background: #1d2233;
  transform: rotate(-1.5deg);
  transition: width .6s ease;
}

.research-entry.struck .entry-name::after { width: calc(100% + 8px); }
.research-entry.struck { opacity: .6; }

/* Κόκκινος κύκλος στο σωστό */
.entry-name::before {
  content: "";
  position: absolute;
  inset: -6px -12px;
  border: 2px solid rgba(140,20,20,.85);
  border-radius: 50%;
  opacity: 0;
  transform: rotate(-2deg) scale(.6);
  transition: opacity .8s ease, transform .8s ease;
}

.research-entry.circled .entry-name::before {
  opacity: 1;
  transform: rotate(-2deg) scale(1);
}

.research-question {
  margin-top: 24px;
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 17px;
  color: #c9c3bc;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.research-question.show { opacity: 1; }

/* =========================
   EVENT 03 - ΡΕΑΛΙΣΤΙΚΑ ΕΓΓΡΑΦΑ (κατάθεση & αναφορά)
========================= */

.henry-statement,
.fire-report {
  width: calc(100% - 24px);
  max-width: 380px;
  margin: 0;
  padding: 0;
  border: none;
  background: none;
  box-shadow: none;
  color: #1c1a16;
  font-family: "Courier New", Courier, monospace;
  font-size: 11px;
  line-height: 1.45;
  text-align: left;
}

.henry-statement { transform: translate(-50%, -50%) rotate(-1.2deg); }
.fire-report     { transform: translate(-50%, -50%) rotate(.9deg); cursor: pointer; -webkit-tap-highlight-color: transparent; }

.doc-paper {
  position: relative;
  padding: 16px 16px 14px;
  background:
    /* λεκές από καφέ */
    radial-gradient(circle at 84% 86%, transparent 17px, rgba(120,80,30,.16) 18px, rgba(120,80,30,.07) 21px, transparent 23px),
    /* τσάκιση στη μέση */
    linear-gradient(to bottom, transparent 49.6%, rgba(0,0,0,.09) 50%, rgba(255,255,255,.25) 50.4%, transparent 51%),
    /* κιτρίνισμα στις άκρες */
    radial-gradient(ellipse at center, rgba(255,250,235,.0) 55%, rgba(120,90,40,.22) 100%),
    #e9e2cf;
  box-shadow:
    0 14px 38px rgba(0,0,0,.9),
    0 2px 4px rgba(0,0,0,.5);
}

.fire-report .doc-paper { background-color: #e4ddc8; }

/* Συρραπτικό */
.doc-staple {
  position: absolute;
  top: 9px;
  left: 14px;
  width: 22px;
  height: 3px;
  border-radius: 1px;
  background: linear-gradient(#bbb, #777);
  transform: rotate(-32deg);
  box-shadow: 0 1px 1px rgba(0,0,0,.4);
}

.doc-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 7px;
  border-bottom: 2px solid #1c1a16;
}

.doc-seal {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  color: #1c1a16;
}

.doc-agency {
  flex: 1;
  text-align: center;
  font-family: "Times New Roman", serif;
  font-weight: bold;
  font-size: 12px;
  letter-spacing: .6px;
  line-height: 1.25;
}

.doc-agency small {
  display: block;
  font-weight: normal;
  font-size: 9px;
  letter-spacing: 1.2px;
}

.doc-title {
  margin: 8px 0 6px;
  text-align: center;
  font-weight: bold;
  font-size: 12px;
  letter-spacing: 2px;
}

.doc-formno {
  float: right;
  font-size: 8px;
  letter-spacing: .5px;
  opacity: .7;
}

/* Πεδία φόρμας */
.doc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid #1c1a16;
  border-bottom: none;
  border-right: none;
}

.doc-cell {

  border-right: 1px solid #1c1a16;
  border-bottom: 1px solid #1c1a16;
  min-width: 0;
}

.doc-cell.wide { grid-column: 1 / -1; }

.doc-label {
  display: block;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 7px;
  letter-spacing: .5px;
  text-transform: uppercase;
  opacity: .7;
}

.doc-value {

  font-size: 11px;

}

.doc-section {

}

/* Κείμενο γραμμένο με γραφομηχανή πάνω σε γραμμές */

.doc-body .ink-fade { opacity: .8; }

}

.doc-sign {

}

.doc-sign .sig {

.doc-sign .line {

.stamp-received {

.evidence-hint.show { opacity: 1; }


/* =========================
   ΑΡΧΙΚΗ ΕΙΚΟΝΑ OBSESSED + ΚΙΝΟΥΜΕΝΟ ΑΙΜΑ
========================= */

.splash-art {
  position: absolute;
  left: 50%;
  top: 50%;
  /* Γεμίζει την οθόνη, αλλά χωρίς να κόβεται ο τίτλος στα πλάγια */
  width: max(100%, min(56.28svh, 112vw));
  aspect-ratio: 941 / 1672;
  transform: translate(-50%, -50%);
  pointer-events: none;
  animation: splashBreath 24s ease-in-out infinite alternate;
}

@keyframes splashBreath {
  from { transform: translate(-50%, -50%) scale(1); }
  to   { transform: translate(-50%, -50%) scale(1.035); }
}

.splash-art img {
  display: block;
  -webkit-mask-image: linear-gradient(transparent 0, #000 6%, #000 94%, transparent 100%);
  mask-image: linear-gradient(transparent 0, #000 6%, #000 94%, transparent 100%);
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-drag: none;
}

/* Η κόκκινη λάμψη πίσω από τον τίτλο πάλλεται σαν καρδιά */
.splash-glow {
  position: absolute;
  left: 50.4%;
  top: 34.6%;
  width: 70%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255,40,40,.55) 0%, rgba(200,0,0,.18) 22%, transparent 55%);
  mix-blend-mode: screen;
  animation: splashPulse 6s ease-in-out infinite;
}

@keyframes splashPulse {
  0%, 100% { opacity: .3; }
  50%      { opacity: .45; }
}

/* Η κάθετη ακτίνα τρεμοπαίζει */
.splash-beam {
  position: absolute;
  left: 50.3%;
  top: 0;
  width: .7%;
  height: 78%;
  transform: translateX(-50%);
  background: linear-gradient(transparent, rgba(255,70,70,.9) 44%, rgba(255,70,70,.9) 47%, transparent);
  filter: blur(1.5px);
  mix-blend-mode: screen;
  animation: beamFlicker 7s ease-in-out infinite;
}

@keyframes beamFlicker {
  0%, 100% { opacity: .22; }
  50%      { opacity: .32; }
}

/* Αίμα που κυλάει μέσα στα ρυάκια */
.blood-flow {
  position: absolute;
  width: .9%;
  transform: translateX(-50%);
  border-radius: 40%;
  background: linear-gradient(to bottom,
    transparent 0%,
    rgba(255,60,60,.0) 30%,
    rgba(255,70,70,.85) 45%,
    rgba(170,0,0,.0) 60%,
    transparent 100%);
  background-size: 100% 300%;
  mix-blend-mode: screen;
  filter: blur(.6px);
  animation: bloodFlow var(--d, 5s) linear infinite;
  animation-delay: var(--delay, 0s);
}

@keyframes bloodFlow {
  from { background-position: 0 100%; }
  to   { background-position: 0 0%; }
}

/* Σταγόνα που φουσκώνει στην άκρη και πέφτει */
.blood-drop {
  position: absolute;
  width: .5%;
  aspect-ratio: 1 / 2;
  margin-left: -.25%;
  border-radius: 50% 50% 50% 50% / 38% 38% 62% 62%;
  background: radial-gradient(circle at 35% 60%, #ff5b5b 0%, #b30000 35%, #4a0000 100%);
  box-shadow: 0 0 2px rgba(255,0,0,.35);
  transform-origin: 50% 0;
  opacity: 0;
  animation: bloodDrop var(--d, 6s) cubic-bezier(.5,0,.9,.6) infinite;
  animation-delay: var(--delay, 0s);
}

@keyframes bloodDrop {
  0%   { transform: translateY(-40%) scale(.2, .2); opacity: 0; }
  8%   { opacity: 1; }
  45%  { transform: translateY(0) scale(1, 1); opacity: 1; }
  55%  { transform: translateY(10%) scale(.9, 1.25); opacity: 1; }
  85%  { transform: translateY(var(--fall, 900%)) scale(.45, 2.2); opacity: .9; }
  100% { transform: translateY(var(--fall, 900%)) scale(.45, 2.2); opacity: 0; }
}

/* Υπολογιστής: όλη η εικόνα σε ύψος οθόνης, πλαϊνά με θολό φόντο */
@media (min-width: 768px) and (min-aspect-ratio: 3/4) {
  .splash-art {
    width: auto;
    height: 100%;
  }

  .splash-art img {
    -webkit-mask-image:
      linear-gradient(transparent 0, #000 6%, #000 94%, transparent 100%),
      linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(transparent 0, #000 6%, #000 94%, transparent 100%),
      linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
    mask-composite: intersect;
  }
}

@media (prefers-reduced-motion: reduce) {
  .splash-art, .splash-glow, .splash-beam, .blood-flow, .blood-drop { animation: none; }
  .blood-drop { opacity: 0; }
}
</style>
</head>

<script>

let selectedLanguage = "gr";

// =========================================
// ΗΧΟΣ
// Στο site (http/https) όλοι οι ήχοι φορτώνονται στη μνήμη και παίζουν μέσα από
// το Web Audio. Έτσι στα κινητά (iPhone & Android):
//  - παίζουν σωστά ακόμα κι όταν ξεκινούν από χρονόμετρο, όχι από άγγιγμα
//  - η ένταση και τα fade δουλεύουν
//  - οι λούπες του υποβάθρου δεν έχουν κενό
// Αν η σελίδα ανοίξει κατευθείαν από αρχείο (file://), χρησιμοποιείται το <audio>.
// =========================================

let audioCtx = null;
let masterGain = null;

const USE_WEBAUDIO =
  location.protocol.startsWith("http") &&
  !!(window.AudioContext || window.webkitAudioContext);

const audioBuffers = {};   // αρχείο -> Promise<AudioBuffer>
const audioErrors = [];
const missingFiles = new Set();
const voices = {};         // id ήχου -> ό,τι παίζει τώρα

// Τα αρχεία ενός ήχου, όπως είναι γραμμένα στο <audio id="...">
function soundSources(id) {
  const el = document.getElementById(id);
  if (!el) return [];
  const list = [...el.querySelectorAll("source")].map(s => s.getAttribute("src"));
  if (el.getAttribute("src")) list.unshift(el.getAttribute("src"));
  return list;
}

function decodeAudio(data) {
  return new Promise((resolve, reject) => {
    const p = audioCtx.decodeAudioData(data, resolve, reject);
    if (p && p.then) p.then(resolve, reject);
  });
}

// Φορτώνει έναν ήχο στη μνήμη (δοκιμάζει με τη σειρά τα εναλλακτικά ονόματα)
function loadBuffer(srcList) {

  if (!audioCtx || !srcList.length) return Promise.resolve(null);

  const key = srcList.join("|");

  // Αρχείο που δεν υπάρχει στον server: δεν το ξαναζητάμε
  if (missingFiles.has(key)) return Promise.resolve(null);

  if (!audioBuffers[key]) {
    audioBuffers[key] = (async () => {
      const failed = [];
      for (const src of srcList) {
        try {
          const res = await fetch(src);
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await decodeAudio(await res.arrayBuffer());
        } catch (e) {
          failed.push(decodeURIComponent(src) + " (" + (e.message || e) + ")");
        }
      }
      const msg = "ΔΕΝ ΒΡΕΘΗΚΕ: " + failed.join(" / ");
      if (!audioErrors.includes(msg)) audioErrors.push(msg);
      // Κανένα από τα ονόματα δεν υπάρχει στον server: δεν το ξαναζητάμε
      missingFiles.add(key);
      return null;
    })().then(buffer => {
      if (!buffer) delete audioBuffers[key];   // να ξαναδοκιμάσει αργότερα
      return buffer;
    });
  }

  return audioBuffers[key];
}

function rampParam(param, target, ms) {
  const now = audioCtx.currentTime;
  param.cancelScheduledValues(now);
  param.setValueAtTime(param.value, now);
  param.linearRampToValueAtTime(Math.max(0, Math.min(1, target)), now + Math.max(0.01, ms / 1000));
}

// iPhone παλιότερων εκδόσεων: ένας σιωπηλός ήχος σε λούπα κάνει τον ήχο
// να ακούγεται ακόμα κι όταν το κινητό είναι στο αθόρυβο
let keepAliveAudio = null;

function silentWavURL() {
  const rate = 8000, n = 8000;
  const buf = new ArrayBuffer(44 + n);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, "data"); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

function startKeepAlive() {
  if (!keepAliveAudio) {
    keepAliveAudio = document.createElement("audio");
    keepAliveAudio.setAttribute("playsinline", "");
    keepAliveAudio.setAttribute("x-webkit-airplay", "deny");
    keepAliveAudio.loop = true;
    keepAliveAudio.src = silentWavURL();
  }
  keepAliveAudio.play().catch(() => {});
}

// Καλείται μέσα στο πρώτο άγγιγμα του παίκτη (επιλογή γλώσσας)
function unlockAudio() {

  let hasAudioSession = false;
  try {
    if (navigator.audioSession) {
      navigator.audioSession.type = "playback";
      hasAudioSession = true;
    }
  } catch (e) {}

  if (!USE_WEBAUDIO) {
    // Χωρίς Web Audio: "ξεκλειδώνουμε" κάθε <audio> μέσα στο άγγιγμα
    // (η μουσική της αρχής ξεκινά αμέσως, δεν την "ξεκλειδώνουμε")
    const all = [...document.querySelectorAll("audio")]
      .filter(audio => !audio.id.startsWith("bg-intro") && !audio.id.startsWith("bg-start"));

    all.forEach(audio => {
      audio.muted = true;
      const p = audio.play();
      if (p) p.then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
      }).catch(() => { audio.muted = false; });
    });

    // Σιγουριά: κανένας ήχος δεν μένει να παίζει από το ξεκλείδωμα
    setTimeout(() => {
      all.forEach(audio => {
        if (audio.muted) {
          audio.pause();
          try { audio.currentTime = 0; } catch (e) {}
          audio.muted = false;
        }
      });
    }, 600);
    return;
  }

  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
    masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);

    // Τα <audio> της σελίδας δεν χρειάζεται να φορτώνουν πια μόνα τους
    document.querySelectorAll("audio").forEach(a => { a.preload = "none"; });
  }

  audioCtx.resume();

  // Κλασικό ξεκλείδωμα για iPhone: ένας μικροσκοπικός σιωπηλός ήχος
  const blank = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = blank;
  src.connect(audioCtx.destination);
  src.start(0);

  if (!hasAudioSession) startKeepAlive();

  preloadSounds();
}

// Αν το κινητό "κοιμίσει" τον ήχο (κλήση, αλλαγή εφαρμογής), ξυπνάει ξανά
function wakeAudio() {
  if (audioCtx && audioCtx.state !== "running") audioCtx.resume();
  if (keepAliveAudio && keepAliveAudio.paused) keepAliveAudio.play().catch(() => {});
}

// Όταν η σελίδα δεν φαίνεται (άλλη καρτέλα / εφαρμογή, κλειστή οθόνη) ο ήχος
// σταματά, ώστε να μην ακούγεται μαζί με άλλη καρτέλα του ίδιου site
let pausedElements = [];

document.addEventListener("visibilitychange", () => {

  if (document.hidden) {
    if (audioCtx && audioCtx.state === "running") audioCtx.suspend();
    if (keepAliveAudio) keepAliveAudio.pause();
    pausedElements = [...document.querySelectorAll("audio")].filter(a => !a.paused);
    pausedElements.forEach(a => a.pause());
    return;
  }

  wakeAudio();
  pausedElements.forEach(a => a.play().catch(() => {}));
  pausedElements = [];
});

window.addEventListener("pagehide", () => {
  if (audioCtx) audioCtx.suspend();
  document.querySelectorAll("audio").forEach(a => a.pause());
});

["touchend", "click"].forEach(type => {
  document.addEventListener(type, wakeAudio, { passive: true });
});


// ---------- Εφέ / ήχοι σκηνών ----------

// Χωρίς Web Audio: σταδιακή αλλαγή έντασης σε <audio>
const elementRamps = {};

function rampElement(audio, target, ms, onDone) {
  clearInterval(elementRamps[audio.id]);
  const steps = Math.max(1, Math.round(ms / 50));
  const start = audio.volume;
  let n = 0;
  elementRamps[audio.id] = setInterval(() => {
    n++;
    audio.volume = Math.max(0, Math.min(1, start + (target - start) * (n / steps)));
    if (n >= steps) {
      clearInterval(elementRamps[audio.id]);
      if (onDone) onDone();
    }
  }, ms / steps);
}

function playSound(id, volume, options = {}) {

  stopSound(id);

  if (!USE_WEBAUDIO) {
    const audio = document.getElementById(id);
    if (!audio) return;
    audio.loop = !!options.loop;
    audio.muted = false;
    audio.currentTime = 0;
    audio.volume = Math.max(0, Math.min(1, volume));
    audio.play().catch(error => audioErrors.push("Δεν έπαιξε: " + id + " " + error.message));
    return;
  }

  if (!audioCtx) return;

  // Μέχρι να φορτώσει ο ήχος, κρατάμε τι ζητήθηκε
  const pending = { pending: true, initial: volume, target: volume, fadeMs: 0 };
  voices[id] = pending;

  loadBuffer(soundSources(id)).then(buffer => {

    if (!buffer || voices[id] !== pending) return;

    const gain = audioCtx.createGain();
    gain.gain.value = pending.initial;
    gain.connect(masterGain);

    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const el = document.getElementById(id);
    source.loop = options.loop !== undefined ? !!options.loop : !!(el && el.loop);
    source.connect(gain);
    source.start(0);

    const voice = { source, gain };
    voices[id] = voice;

    source.onended = () => { if (voices[id] === voice) delete voices[id]; };

    if (pending.target !== pending.initial) {
      rampParam(gain.gain, pending.target, pending.fadeMs);
    }
  });
}

// Αλλάζει σιγά σιγά την ένταση ενός ήχου
function fadeAudioTo(id, target, duration) {

  if (!USE_WEBAUDIO) {
    const audio = document.getElementById(id);
    if (audio && !audio.paused) rampElement(audio, target, duration);
    return;
  }

  const voice = voices[id];
  if (!voice) return;

  if (voice.pending) {
    voice.target = target;
    voice.fadeMs = duration;
    return;
  }

  rampParam(voice.gain.gain, target, duration);
}

// Σβήνει έναν ήχο σιγά σιγά
function fadeOutAudio(id, duration) {

  if (!USE_WEBAUDIO) {
    const audio = document.getElementById(id);
    if (!audio || audio.paused) return;
    rampElement(audio, 0, duration, () => {
      audio.pause();
      audio.currentTime = 0;
    });
    return;
  }

  const voice = voices[id];
  if (!voice) return;

  delete voices[id];
  if (voice.pending) return;

  rampParam(voice.gain.gain, 0, duration);
  try { voice.source.stop(audioCtx.currentTime + duration / 1000 + 0.05); } catch (e) {}
}

function stopSound(id) {

  if (!USE_WEBAUDIO) {
    const audio = document.getElementById(id);
    if (!audio) return;
    clearInterval(elementRamps[id]);
    audio.pause();
    try { audio.currentTime = 0; } catch (e) {}
    return;
  }

  const voice = voices[id];
  if (!voice) return;
  delete voices[id];
  if (!voice.pending) {
    try { voice.source.stop(); } catch (e) {}
  }
}

// Σταματά όλα τα εφέ (όχι το υπόβαθρο)
function stopAllSounds() {
  if (USE_WEBAUDIO) {
    Object.keys(voices).forEach(stopSound);
  } else {
    document.querySelectorAll("audio:not(.bg-audio)").forEach(a => stopSound(a.id));
  }
}

// Η τρέχουσα ένταση ενός ήχου (για το πάνελ διάγνωσης)
function soundVolume(id) {
  const voice = voices[id];
  if (!voice) return null;
  return voice.pending ? voice.target : voice.gain.gain.value;
}



function enterExperience(language) {

  selectedLanguage = language;

  // Ήχος για κινητά: ξεκινά μέσα στο άγγιγμα του παίκτη

// Μουσική πρώτης οθόνης: ο browser δεν αφήνει ήχο πριν από την πρώτη
// επαφή του παίκτη, οπότε ξεκινά με το πρώτο άγγιγμα / κλικ / πλήκτρο

function startMusicOnFirstTouch() {

["touchend", "click", "keydown"].forEach(type => {

});


// ==========================================
// ΕΛΕΓΧΟΣ ACTIVE EVENT / TIMERS
// ==========================================

let eventTimers = [];
let eventIntervals = [];

function eventTimeout(callback, delay) {

  const timer = setTimeout(callback, delay);

  eventTimers.push(timer);

  return timer;
}

function eventInterval(callback, delay) {

  const interval = setInterval(callback, delay);

  eventIntervals.push(interval);

  return interval;
}

function clearEventTimers() {

  eventTimers.forEach(timer => clearTimeout(timer));
  eventIntervals.forEach(interval => clearInterval(interval));

  eventTimers = [];
  eventIntervals = [];
}


// RESET ΟΛΩΝ ΤΩΝ ΗΧΩΝ ΚΑΙ VIDEO

function checkRiddle1() {

        "Not her.",
        "It should have been you. I'll fix it."

  lines.forEach((line, index) => {

          eventTimeout(() => {

        }, 8000);

      }, 50);

    }, index * 3000);

  eventTimeout(() => {

    const screen3 = document.getElementById("storyScreen3");

    if (screen3.classList.contains("hidden")) {
      return;

      if (screen3.classList.contains("hidden")) {

      const fireVideo = document.getElementById("fireVideo");
      const fireAudio = document.getElementById("fireAudio");

      fireVideo.currentTime = 0;

      // Ο ήχος ανεβαίνει σιγά σιγά μαζί με την εικόνα, σε χαμηλότερη ένταση

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();

// Τυχαία σκισμένη άκρη - διαφορετική σε κάθε σελίδα
function makeTornEdge() {
  const count = 16;
  const points = [];
  for (let i = 0; i < count; i++) {
    points.push({
      x: (i / (count - 1)) * 100,
      y: 2 + Math.random() * 6        // 2%–8% από την κορυφή
    });
  }
  return points;
}

function tearOffSheet(nextDate) {

  const page = document.getElementById("calendarPage");
  const stub = document.getElementById("calendarStub");

  // 1. Αντίγραφο της τρέχουσας σελίδας -> αυτό θα σκιστεί
  const sheet = page.cloneNode(true);
  sheet.removeAttribute("id");
  sheet.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
  sheet.classList.add("torn-sheet");
  page.parentElement.appendChild(sheet);

  // 2. Από κάτω εμφανίζεται ήδη η επόμενη μέρα
  setCalendarDate(nextDate);

  // 3. Σχήματα σκισίματος
  const edge = makeTornEdge();
  const poly = pts =>
    `polygon(${pts.map(p => `${p.x}% ${p.y}%`).join(", ")}, 100% 100%, 0% 100%)`;

  const intact  = poly(edge.map(p => ({ x: p.x, y: 0 })));
  const halfway = poly(edge.map(p => ({ x: p.x, y: p.x > 55 ? p.y : 0 }))); // σκίζεται από δεξιά
  const torn    = poly(edge);

  const drift = -20 + Math.random() * 40;
  const spin  = 6 + Math.random() * 10;

  const anim = sheet.animate([
    { offset: 0,   clipPath: intact,  transform: "translate(0,0) rotate(0deg)",   opacity: 1 },
    { offset: 0.2, clipPath: halfway, transform: "translate(0,2px) rotate(1.5deg)", opacity: 1 },
    { offset: 0.4, clipPath: torn,    transform: "translate(0,6px) rotate(3deg)",   opacity: 1 },
    { offset: 1,   clipPath: torn,    transform: `translate(${drift}px,190px) rotate(${spin}deg)`, opacity: 0 }
  ], { duration: 700, easing: "ease-in", fill: "forwards" });

  // 4. Τη στιγμή που αποκολλάται, μένει το σκισμένο κομμάτι πάνω
  eventTimeout(() => {
    stub.style.clipPath =
      `polygon(0% 0%, 100% 0%, ${[...edge].reverse().map(p => `${p.x}% ${p.y}%`).join(", ")})`;
  }, 280);

  anim.onfinish = () => sheet.remove();
}

// Μόνιμη φθορά: κάθε πένθιμο γεγονός παίρνει κάτι για πάντα
let griefLoss = 0;

function applyCalendarLife(progress, grieving) {

  const calendar = document.getElementById("calendar");
  const wither = document.getElementById("calendarWither");

  // Φθορά από τον χρόνο + από τα πένθιμα γεγονότα
  let brightness = 1 - progress * 0.25 - griefLoss * 0.5;
  let saturation = 1 - progress * 0.5 - griefLoss;
  let sepia = Math.min(0.3, griefLoss);
  let witherOpacity = griefLoss * 1.5;

  // Τη στιγμή του πένθους: μαρασμός
  if (grieving) {
    brightness -= 0.3;
    saturation -= 0.45;
    sepia = 0.4;
    witherOpacity = 1;
  }

  calendar.style.filter =
    `brightness(${Math.max(0.3, brightness)}) ` +
    `saturate(${Math.max(0, saturation)}) ` +
    `sepia(${sepia})`;

  wither.style.opacity = Math.min(1, witherOpacity);

  calendar.classList.toggle("grieving", grieving);
  document.getElementById("storyScreen4").classList.toggle("mourning", grieving);
}

function startEvent4Calendar() {

  const current = new Date(CALENDAR_START);
  const totalDays = Math.round((CALENDAR_END - CALENDAR_START) / 86400000);
  let delay = 900;

  // Υπόβαθρο: 4.mp3 όσο περνούν οι μέρες
  setBackground("event4");

  // Καθαρή εκκίνηση
  document.querySelectorAll(".torn-sheet").forEach(s => s.remove());
  document.getElementById("calendarStub").style.clipPath = "";
  document.getElementById("calendarMark").classList.remove("draw");
  document.getElementById("griefLine").classList.remove("show");
  griefLoss = 0;
  applyCalendarLife(0, false);
  resetDeskScene();
  resetResearchScene();
  setCalendarDate(current);

  function tick() {

    if (document.getElementById("storyScreen4").classList.contains("hidden")) return;

    const remaining = Math.round((CALENDAR_END - current) / 86400000);

    if (remaining <= 0) {
      onCalendarFinished();
      return;
    }

    let step = 1;

    if (remaining <= 10) {
      delay = Math.min(delay * 1.3, 1200);   // φρενάρει στις τελευταίες μέρες
    } else {
      delay = Math.max(delay * 0.88, 90);    // επιταχύνει
      if (delay <= 100) step = 4;            // στη μέγιστη ταχύτητα, 4 μέρες τη φορά
    }

    step = Math.min(step, remaining);

    // Να μην προσπεράσει ποτέ πένθιμη μέρα
    const nextMoment = calendarMoments.find(m => m.date > current);
    if (nextMoment) {
      const toMoment = Math.round((nextMoment.date - current) / 86400000);
      step = Math.min(step, toMoment);
    }

    current.setDate(current.getDate() + step);
    tearOffSheet(current);

    // Πόσος χρόνος έχει περάσει (0 → 1)
    const progress =
      1 - Math.round((CALENDAR_END - current) / 86400000) / totalDays;

    const moment = calendarMoments.find(m => sameDay(m.date, current));

    // ===== ΠΕΝΘΙΜΗ ΜΕΡΑ =====
    if (moment) {

      // Το ημερολόγιο μαραζώνει, ο κόσμος σκοτεινιάζει
      applyCalendarLife(progress, true);

      eventTimeout(() => {
        showGriefLine(selectedLanguage === "gr" ? moment.gr : moment.en, 4200);
      }, 900);

      // Συνέρχεται λίγο, αλλά κρατά μόνιμη φθορά
      eventTimeout(() => {
        griefLoss += 0.06;
        applyCalendarLife(progress, false);
      }, 5400);

      delay = 400;
      eventTimeout(tick, 6800);
      return;
    }

    // ===== ΚΑΝΟΝΙΚΗ ΜΕΡΑ =====
    applyCalendarLife(progress, false);

    eventTimeout(tick, delay);
  }

  eventTimeout(tick, 1200); // μικρή παύση πριν αρχίσει
}

function openDeskItem(type) {

  const t = deskText();
  const viewer = document.getElementById("deskViewer");
  const content = document.getElementById("deskViewerContent");

  // Το 2019 ο υπολογιστής μένει κλειστός. Ανοίγει μόνο στην τελική σκηνή.
  if (type === "laptop" && !finalPhase) {
    tapGriefItem("laptop");
    return;
  }

  // ===== ΜΑΡΤΥΡΙΑ (ΕΦΗΜΕΡΙΔΑ) =====
  if (type === "newspaper") {

    content.innerHTML = `
      <div class="viewer-newspaper">
        <div class="masthead">THE EVENING CHRONICLE</div>
        <div class="dateline">${t.dateline}</div>
        <h3>${t.headline}</h3>
        <p>${t.article}</p>
      </div>
      <div class="viewer-tip">${t.closeTip}</div>`;

    deskSeen.newspaper = true;
    document.getElementById("newspaperClip").classList.add("seen");
  }

  // ===== ΣΗΜΕΙΩΣΕΙΣ HENRY =====
  if (type === "notes") {

    content.innerHTML = `
      <div class="viewer-notes">${t.notes}</div>
      <div class="viewer-tip">${t.closeTip}</div>`;

    deskSeen.notes = true;
    document.getElementById("deskNotes").classList.add("seen");
  }

  // ===== ΥΠΟΛΟΓΙΣΤΗΣ: κλείδωμα με σύμβολο → forum Curiosity Lust =====
  if (type === "laptop") {

    content.innerHTML = laptopUnlocked
      ? `${buildForumSite()}<div class="viewer-tip">${t.laptopTip}</div>`
      : `${buildLockScreen()}<div class="viewer-tip">${t.closeTip}</div>`;
  }

  // Ο υπολογιστής ανοίγει σε πιο φαρδύ παράθυρο
  content.classList.toggle("wide", type === "laptop");

  // ===== ΦΥΛΛΑΔΙΟ ΜΕΝΤΙΟΥΜ (γυρίζει) =====
  if (type === "flyer") {

    content.innerHTML = `
      <div class="flyer-card" onclick="flipCard(event, 'flyer')">
        <div id="cardInner" class="flyer-inner">
          <div class="flyer-face flyer-front">
            <div class="f-title">${t.flyerTitle}</div>
            <div class="f-symbol">☽&#xFE0E;</div>
            <div class="f-name">Madame Céleste Marchand</div>
            <div class="f-quote">${t.flyerQuote}</div>
            <div class="f-details">${t.flyerDetails}</div>
          </div>
          <div class="flyer-face flyer-back">${t.flyerBack}</div>
        </div>
      </div>
      <div class="viewer-tip">${t.flyerTip}</div>`;
  }

  viewer.classList.remove("hidden");
  eventTimeout(() => viewer.classList.add("show"), 30);

function flipCard(event, type) {

  // Να μην κλείσει το viewer όταν γυρίζουμε το φυλλάδιο
  event.stopPropagation();

  const inner = document.getElementById("cardInner");
  inner.classList.toggle("flipped");

  // Μετράει ως "διαβασμένο" μόνο όταν δει την πίσω πλευρά
  if (inner.classList.contains("flipped")) {
    deskSeen[type] = true;
    document.getElementById("mediumFlyer").classList.add("seen");
  }
}

      }
    : {

        mail:    "Bills. Final notices. Not a single envelope was ever opened.",
        wine:    "The wine she loved. He opened it every Friday, like before.",

function closeDeskItem() {

  const viewer = document.getElementById("deskViewer");

  viewer.classList.remove("show");
  eventTimeout(() => viewer.classList.add("hidden"), 600);

  // Τελική σκηνή: μόλις κλείσει το forum, τελειώνει το Event 04
  if (finalPhase) {
    if (finalForumOpened && !finalDone) {
      finalDone = true;
      eventTimeout(showFinalLine, 900);
    }
    return;

  // Όταν έχει δει μαρτυρία, φυλλάδιο και σημειώσεις → ελπίδα
  if (!deskDone && deskSeen.newspaper && deskSeen.flyer && deskSeen.notes) {
    deskDone = true;
    eventTimeout(showHenryHope, 900);
  }

  return `

        </div>
        <div id="lockMessage" class="lock-message"></div>

function tryLockSymbol(key) {

  if (laptopUnlocked) return;

  const t = deskText();
  const button = document.getElementById("lock-" + key);
  const message = document.getElementById("lockMessage");

  if (key === "baron") {

    laptopUnlocked = true;
    finalForumOpened = true;

    button.classList.add("correct");
    message.style.color = "#5fa873";
    message.textContent = t.lockCorrect;

    // Ξεκλειδώνει και ανοίγει το forum
    eventTimeout(() => {
      document.getElementById("deskViewerContent").innerHTML =
        `${buildForumSite()}<div class="viewer-tip">${t.laptopTip}</div>`;
    }, 1300);

  } else {

    button.classList.add("wrong");
    message.style.color = "#e06060";
    message.textContent = t.lockWrong;
  }
}

function forumEntry(entry, isReply) {

  const replies = (entry.replies || []).map(r => forumEntry(r, true)).join("");

  return `

      <div class="forum-meta">
        ${forumAvatar}
        <span class="forum-user ${entry.bold ? "bold" : ""}">${entry.user}</span>
        <span>| ${entry.date}</span>
      </div>
      <div class="forum-text">${isReply ? forumReplyIcon : ""}${entry.text}</div>
      ${replies}
    </div>`;
}

function resetResearchScene() {

  researchPhase = "read";
  researchRead.clear();

  const scene = document.getElementById("researchScene");
  scene.classList.remove("show");
  scene.classList.add("hidden");

  document.getElementById("researchList").innerHTML = "";
  document.getElementById("researchQuestion").classList.remove("show");
  document.getElementById("researchMessage").textContent = "";

  // Επαναφορά των στοιχείων του γραφείου
  deskElements.forEach(id => {
    document.getElementById(id).classList.remove("desk-fade");
  });
}

function showResearchScene() {

  const t = researchText();

  // Σβήνουν γραφείο, hint, γρίφος και φράση
  deskElements.forEach(id => {
    document.getElementById(id).classList.add("desk-fade");
  });

  eventTimeout(() => {

    deskElements.forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });

    document.getElementById("researchDate").textContent = t.date;
    document.getElementById("notebookTitle").textContent = t.title;
    document.getElementById("researchQuestion").textContent = t.question;

    document.getElementById("researchList").innerHTML = t.paths.map(p => `
      <div class="research-entry" id="entry-${p.id}" onclick="tapResearchEntry('${p.id}')">
        <div class="entry-name">${p.name}</div>
        <div class="entry-note">${p.note}</div>
      </div>
    `).join("");

    const scene = document.getElementById("researchScene");
    scene.classList.remove("hidden");

    eventTimeout(() => {
      scene.classList.add("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }, 50);

  }, 1500);
}

function tapResearchEntry(id) {

  const t = researchText();
  const entry = document.getElementById("entry-" + id);
  const message = document.getElementById("researchMessage");

  // ΦΑΣΗ 1: Ο παίκτης διαβάζει τις σημειώσεις
  if (researchPhase === "read") {

    entry.classList.add("revealed");
    researchRead.add(id);

    if (researchRead.size === t.paths.length) {

      researchPhase = "choose";

      eventTimeout(() => {
        const q = document.getElementById("researchQuestion");
        q.classList.add("show");
        q.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 1200);
    }

    return;
  }

  // ΦΑΣΗ 2: Ο παίκτης επιλέγει το ανοιχτό μονοπάτι
  if (researchPhase === "choose") {

    if (id === "nola") {

      researchPhase = "done";
      entry.classList.add("circled");

      message.style.color = "#5fa873";
      message.textContent = t.correct;

      // Όλα τα άλλα διαγράφονται
      t.paths.forEach(p => {
        if (p.id !== "nola") {
          document.getElementById("entry-" + p.id).classList.add("struck");
        }
      });

      eventTimeout(onResearch1Solved, 4500);

    } else {

      entry.classList.add("struck");
      message.style.color = "#b83232";
      message.textContent = t.wrong;
    }
  }
}

function onResearch1Solved() {
  // Εδώ θα μπουν αργότερα τα στάδια 2–5 της έρευνας.
  // Προς το παρόν πάμε κατευθείαν στην τελική σκηνή (υπολογιστής / forum).
  showFinalForumScene();
}

const POOL_IMAGE = "mpam.png";

// Πού βρίσκονται τα κεριά πάνω στη φωτογραφία (0 = αριστερά/πάνω, 1 = δεξιά/κάτω)
const CANDLE_POSITIONS = [

  { x: 0.42, y: 0.96 }    // μπροστά, στο πάτωμα
];

// Από ποιο σημείο βγαίνει το αίμα
const POOL_ORIGIN = { x: 0.33, y: 0.77 };   // κάτω από το σώμα

// Προοπτική του πατώματος (1 = κύκλος, μικρότερο = πιο «ξαπλωμένη» λίμνη)
const POOL_FLATTEN = 0.32;

// Πού αρχίζει το πάτωμα (το αίμα δεν ανεβαίνει πιο ψηλά από εδώ, 0 = πάνω, 1 = κάτω)
const POOL_FLOOR_TOP = 0.6;

// Πόσο σκοτάδι μένει ανάλογα με τα αναμμένα κεριά (0, 1, 2, 3)
const POOL_DARK_LEVELS = [0.94, 0.72, 0.5, 0.22];
