<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSESSED</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=GFS+Didot&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #eee;
}

body {
  font-family: "Noto Serif", serif;
}

.screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 80px 24px 90px;

  overflow-x: hidden;
}

.hidden {
  display: none !important;
}


/* =========================
   ΠΡΩΤΗ ΟΘΟΝΗ
========================= */

#languageScreen {
  overflow: hidden;

  background-image:
    linear-gradient(
      rgba(0,0,0,.18),
      rgba(0,0,0,.32)
    ),
    url("file_00000000a95081f4ad0a889b8883d67c.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

#languageScreen::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,.22) 60%,
      rgba(0,0,0,.75) 100%
    );

  pointer-events: none;
}

.language-content {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 430px;

  display: flex;
  flex-direction: column;
  align-items: center;

  transform: translateY(90px);
}


/* LANGUAGE BUTTONS */

.language-button {
  width: 290px;
  max-width: 90%;

  margin: 8px 0;
  padding: 17px 20px;

  background: rgba(3,3,3,.76);
  border: 1px solid rgba(130,20,20,.8);

  color: #e3dfd8;

  font-family: "Cinzel", serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 2px;

  cursor: pointer;

  backdrop-filter: blur(3px);

  transition:
    background .25s,
    border-color .25s,
    transform .15s;
}

.language-button:active {
  transform: scale(.98);
  background: rgba(80,0,0,.35);
  border-color: #b32828;
}

.flag {
  margin-right: 13px;
  font-size: 21px;
}


/* =========================
   LANGUAGE SWITCHER
========================= */

#languageSwitcher {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;
  box-sizing: border-box;

  height: 55px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 3px;

  padding: 0 18px;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.95),
    rgba(0,0,0,.70),
    transparent
  );

  pointer-events: none;
}

#languageSwitcher button {
  border: 0;
  background: transparent;

  padding: 5px 6px;

  font-size: 19px;
  cursor: pointer;

  opacity: .4;

  pointer-events: auto;
}

#languageSwitcher button.active {
  opacity: 1;
}


/* =========================
   VIDEO / INTRO
========================= */

#videoScreen {
  background:
    radial-gradient(
      circle at center,
      #140707 0%,
      #050303 45%,
      #000 100%
    );

  padding-top: 35px;
  padding-bottom: 100px;
  justify-content: flex-start;
}

.video-frame {
  position: relative;

  width: min(100%, 360px);
  aspect-ratio: 9 / 16;
  max-height: 48vh;

  background: #050505;
  border: 1px solid #351010;

  overflow: hidden;

  box-shadow:
    0 0 45px rgba(80,0,0,.18),
    inset 0 0 50px #000;

  flex-shrink: 1;
}


/* =========================
   STORY CHAPTER 01
========================= */

.story-chapter {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}

.chapter-number {
  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: #7d1b1b;
  margin-bottom: 6px;
}

.story-title {
  font-family: "Cinzel", serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 3px;
  margin: 0 0 20px;
  color: #eee9e2;
}


/* FLIP PHOTO */

.memory-photo {
  width: 100%;
  aspect-ratio: 2 / 3;
  margin-bottom: 22px;

  perspective: 1200px;
  cursor: pointer;

  background: transparent;
  border: none;
  overflow: visible;
}

.memory-card {
  position: relative;
  width: 100%;
  height: 100%;

  transition: transform .8s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.memory-card.flipped {
  transform: rotateY(180deg);
}

.memory-card-face {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.memory-card-back {
  transform: rotateY(180deg);
}

.memory-card-face img {
  width: 100%;
  height: 100%;
  object-fit: cover;

  display: block;

  user-select: none;
  -webkit-user-drag: none;
}


/* STORY TEXT */

.story-text {
  font-family: "GFS Didot", serif;
  font-size: 18px;
  line-height: 1.65;
  color: #d8d3cc;
  margin-bottom: 25px;
}


/* RIDDLE */

.riddle-box {
  width: 100%;
  padding-top: 20px;
  border-top: 1px solid #301010;
}

.riddle-text {
  font-family: "GFS Didot", serif;
  font-style: italic;
  font-size: 17px;
  line-height: 1.6;
  color: #c9c3bc;
  margin-bottom: 18px;
}

.riddle-input {
  width: 100%;
  box-sizing: border-box;

  padding: 13px 14px;

  background: rgba(0,0,0,.55);
  border: 1px solid #4a1818;

  color: #eee9e2;
  text-align: center;

  font-family: "GFS Didot", serif;
  font-size: 17px;

  outline: none;
}

.riddle-input:focus {
  border-color: #8b2525;
}

.riddle-button {
  margin-top: 12px;
  padding: 11px 24px;

  border: 1px solid #651c1c;
  background: transparent;

  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 12px;
  letter-spacing: 2px;

  cursor: pointer;
}

.riddle-message {
  min-height: 22px;
  margin-top: 12px;

  font-family: "GFS Didot", serif;
  font-size: 15px;
}


/* =========================
   INTRO TEXT
========================= */

.placeholder {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Cinzel", serif;
  color: #5d5555;

  font-size: 12px;
  letter-spacing: 4px;
}

.quote {
  max-width: 520px;

  margin: 30px auto;

  color: #e0dcd5;

  font-family: "GFS Didot", serif;
  font-size: 19px;
  font-weight: 400;
  font-style: italic;

  line-height: 1.75;
  letter-spacing: .2px;

  text-shadow:
    0 1px 2px rgba(0,0,0,.8);
}


/* START BUTTON */

.start-button {
  width: 300px;
  max-width: 90%;

  padding: 16px;

  background: rgba(0,0,0,.5);

  color: #ddd8d0;

  border: 1px solid #651313;

  font-family: "Cinzel", serif;
  font-size: 13px;
  letter-spacing: 1.5px;

  cursor: pointer;
}

.start-button:active {
  background: rgba(90,0,0,.3);
}


/* =========================
   NAVIGATION ARROWS
========================= */

#navigationArrows {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  min-height: 65px;

  padding:
    8px
    18px
    max(12px, env(safe-area-inset-bottom));

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;

  background: linear-gradient(
    to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.65),
    transparent
  );

  pointer-events: none;
}

#navigationArrows button {
  width: 42px;
  height: 42px;

  border: none;
  background: transparent;
  color: #ddd8d0;

  font-family: "Cinzel", serif;
  font-size: 25px;

  cursor: pointer;
  opacity: .75;
  pointer-events: auto;
}

#navigationArrows button:active {
  background: transparent;
  color: #ffffff;
  opacity: 1;
}

#navigationArrows button:disabled {
  opacity: .2;
  cursor: default;
}


/* =========================
   DESKTOP
========================= */

#storyScreen1,
#storyScreen2 {
  justify-content: flex-start;
  padding-top: 35px;
}

#storyScreen2 {
  transform: none;
}

#storyScreen2 .heart-monitor {
  margin-top: 22vh;
}
  
  .heart-monitor {
  width: 100%;
  margin: 35px 0;
  padding: 18px 0;
  background: #020403;
  overflow: hidden;
  box-shadow: inset 0 0 30px rgba(0, 255, 100, 0.05);
}

  .heart-monitor.fade-out {
  opacity: 0;
  transition: opacity 2s ease;
}

.monitor-line {
  width: 100%;
  height: 120px;
  overflow: hidden;
}

.monitor-line svg {
  width: 300%;
  height: 100%;
  animation: ecgCollapse 10s linear forwards;
}

.ecg-line {
  fill: none;
  stroke: #39ff78;
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 5px #39ff78);
}

@keyframes ecgCollapse {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-60%);
  }
}

@media (min-width: 768px) {

  .video-frame {
    width: 280px;
    max-height: 52vh;
  }

  .quote {
    max-width: 650px;
  }

  #languageScreen {
    background-size: auto 100%;
    background-position: center;
    background-color: #000;
  }
}
.hospital-document {
  opacity: 0;
transition: opacity 3s ease;
  width: 100%;
  max-width: 390px;
  margin: 25px auto 40px;
  padding: 28px 24px;

  background:
    linear-gradient(
      rgba(255,255,255,.04),
      rgba(0,0,0,.05)
    ),
    #d8d0ba;

  color: #171512;

  text-align: left;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.55;

  border: 1px solid #8e8775;

  box-shadow:
    0 8px 30px rgba(0,0,0,.8),
    inset 0 0 35px rgba(70,55,30,.12);

  transform: rotate(-0.4deg);
}
.hospital-document.show {
  opacity: 1;
}
#hospitalName {
  text-align: center;
  font-weight: bold;
  font-size: 16px;
  letter-spacing: 1px;
}

#hospitalRecordTitle {
  text-align: center;
  font-weight: bold;
  font-size: 12px;
  margin-top: 5px;
  letter-spacing: .8px;
}

.hospital-document hr {
  border: 0;
  border-top: 1px solid rgba(30,25,20,.45);
  margin: 17px 0;
}

#hospitalTimeline {
  line-height: 1.8;
}

#hospitalMotherStatus {
  margin-top: 4px;
  font-weight: bold;
}

#incidentTimeInput {
  width: 55%;
  padding: 10px;

  background: rgba(255,255,255,.35);
  border: 1px solid #625c50;

  color: #171512;
  text-align: center;

  font-family: "Courier New", monospace;
  font-size: 16px;
}

#incidentTimeButton {
  width: 43%;
  padding: 10px 4px;

  background: #24211c;
  border: 1px solid #24211c;

  color: #ddd5c1;

  font-family: "Courier New", monospace;
  font-size: 11px;

  cursor: pointer;
}
.henry-anger {
  height: 150px;
overflow: hidden;
  margin-top: 35px;
  text-align: center;
  position: relative;
  font-size: 19px;
  line-height: 1.6;

  opacity: 1;
  transition: opacity 2s ease;
}

/* EVENT 03 - Smooth κίνηση λόγων Henry */
.henry-line {
  position: absolute;
  left: 0;
  top: 120px;
  width: 100%;

  opacity: 0;

  transition:
    top 9s linear,
    opacity 1s ease;
}

.henry-line.show {
  top: -40px;
  opacity: 1;
}

.henry-line.fade-away {
  top: 0;
  opacity: 0;
}
  #storyScreen3 {
  justify-content: flex-start;
  padding-top: 35px;
}

#storyScreen3 .story-chapter {
  width: 100%;
}

#storyScreen3 .henry-anger {
  margin-top: 22vh;
}
/* EVENT 03 - ΣΚΗΝΗ ΦΩΤΙΑΣ */
/* EVENT 03 - ΣΚΗΝΗ ΦΩΤΙΑΣ */
.fire-scene {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 100%;

  transform: translate(-50%, -50%);
  opacity: 0;

  transition: opacity 2s ease;
}

.fire-scene.show {
  opacity: 1;
}

.fire-scene video {
  width: 100%;
  max-height: 55vh;
  object-fit: cover;
  display: block;
}
  
 /* EVENT 03 - ΕΠΙΣΗΜΗ ΚΑΤΑΘΕΣΗ HENRY */
.henry-statement {
  cursor: pointer;
-webkit-tap-highlight-color: transparent;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 40px);
  max-width: 390px;

  margin: 30px auto;
  padding: 26px 22px;

background:
  linear-gradient(
    rgba(25, 18, 14, .18),
    rgba(0, 0, 0, .12)
  ),
  #aaa18c;

color: #18130f;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.65;
  text-align: left;

  border: 1px solid #8e8775;

box-shadow:
  0 12px 35px rgba(0,0,0,.95),
  inset 0 0 45px rgba(45,20,8,.28),
  inset 0 0 8px rgba(0,0,0,.35);

  opacity: 0;
  transition: opacity 3s ease;
}

.henry-statement.show {
  opacity: 1;
}
/* EVENT 03 - ΑΝΑΦΟΡΑ ΠΥΡΟΣΒΕΣΤΙΚΗΣ / ΑΣΤΥΝΟΜΙΑΣ */
.fire-report {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: calc(100% - 40px);
  max-width: 390px;

  margin: 30px auto;
  padding: 26px 22px;

background:
  linear-gradient(
    rgba(25, 18, 14, .20),
    rgba(0, 0, 0, .14)
  ),
  #9f9785;

color: #17120f;

  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.65;
  text-align: left;

  border: 1px solid #77736a;

box-shadow:
  0 12px 35px rgba(0,0,0,.95),
  inset 0 0 45px rgba(45,20,8,.30),
  inset 0 0 8px rgba(0,0,0,.38);

  opacity: 0;

transition: opacity 1.5s ease;
}

.fire-report.show {
  opacity: 1;
}

  /* EVENT 03 - ΚΡΥΜΜΕΝΟ ΣΤΟΙΧΕΙΟ */
.hidden-evidence {
  position: absolute;
  top: 50%;
  left: 50%;

  width: calc(100% - 30px);
  max-width: 420px;
  aspect-ratio: 3 / 4;

  transform: translate(-50%, -50%);

  background: #020202;

  overflow: hidden;

  opacity: 0;
  transition: opacity 2s ease;

  box-shadow: 0 10px 40px rgba(0,0,0,.95);
  touch-action: none;
}
.hidden-evidence.show {
  opacity: 1;
}
.hidden-evidence img {
  filter: brightness(1.35) contrast(1.05);
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;

  user-select: none;
  -webkit-user-drag: none;
}

.evidence-darkness {
  position: absolute;
  inset: 0;

  background: rgba(0, 0, 0, 0.97);

  -webkit-mask-image: radial-gradient(
    circle 65px at var(--x, 50%) var(--y, 50%),
    transparent 0,
    transparent 45px,
    black 75px
  );

  mask-image: radial-gradient(
    circle 65px at var(--x, 50%) var(--y, 50%),
    transparent 0,
    transparent 45px,
    black 75px
  );

  pointer-events: none;
  z-index: 2;
}
  
</style>
</head>

    <h2 id="storyTitle1" class="story-title">

let eventTimers = [];
let eventIntervals = [];

function eventTimeout(callback, delay) {

  const timer = setTimeout(callback, delay);

  eventTimers.push(timer);

  return timer;
}

function eventInterval(callback, delay) {

  const interval = setInterval(callback, delay);

  eventIntervals.push(interval);

  return interval;
}

function clearEventTimers() {

  eventTimers.forEach(timer => clearTimeout(timer));
  eventIntervals.forEach(interval => clearInterval(interval));

  eventTimers = [];
  eventIntervals = [];
}

  // RESET ΟΛΩΝ ΤΩΝ ΗΧΩΝ ΚΑΙ VIDEO
function resetMedia() {

  document.querySelectorAll("audio, video").forEach(media => {

    media.pause();

    try {
      media.currentTime = 0;
    } catch (e) {}

    if (media.tagName === "AUDIO") {
      media.volume = 1;
    }

  });

}

  const y = event.clientY - rect.top;

  darkness.style.setProperty("--x", x + "px");
  darkness.style.setProperty("--y", y + "px");
